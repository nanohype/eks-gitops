name: Diff

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to render'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
          - hub

permissions:
  contents: read

# The helm and kustomize the CI render gates use, pinned and watched exactly as
# ci.yml's env block pins them, so this render matches theirs.
env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
  KUSTOMIZE_VERSION: 5.8.1

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }} # zizmor: ignore[unpinned-tools]

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }} # zizmor: ignore[unpinned-tools]

      - name: Render manifests
        run: |
          mkdir -p rendered
          find . -path "*/overlays/${{ inputs.environment }}/kustomization.yaml" -exec dirname {} \; | while read dir; do
            name=$(echo "$dir" | sed 's|^\./||' | tr '/' '-')
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/${name}.yaml" || exit 1
          done
          # Env-agnostic kustomize roots (no per-env overlays — same on every cluster).
          for dir in dashboards/base addons/bootstrap/secret-stores addons/bootstrap/secret-stores-managed; do
            name=$(echo "$dir" | sed 's|^\./||' | tr '/' '-')
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/${name}.yaml" || exit 1
          done
          echo "All manifests rendered."

      - name: Upload rendered manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-${{ inputs.environment }}
          path: rendered/
          retention-days: 14
