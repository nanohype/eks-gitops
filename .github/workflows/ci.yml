name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Tool versions this workflow resolves: release tarballs, a setup action's
# download, and the npm package the Renovate gates run against. Pinned in one
# place so a Renovate custom manager can watch each `# renovate:`-annotated line
# and open a currency PR that runs the render/schema/policy gates before merge.
# A tarball bump also invalidates the hardcoded SHA256 below it, so a human
# confirms the new checksum.
#
# Every tarball is downloaded under curl's --connect-timeout, --max-time and
# --retry. Without them a download a mirror stops serving mid-body runs until
# the job's timeout, and the job is cancelled on that step with nothing said
# about the download. Every job sets a timeout-minutes of its own for the same
# reason one level up: the runner's default is six hours, which a hung step
# spends holding a runner and the merge gate. scripts/tests/test_workflows.py
# holds every workflow in .github/workflows/ to both.
#
# RENOVATE_VERSION is pinned for a second reason. The drift check compares
# scripts/renovate-manager-defaults.json against the defaults inside this exact
# package, so an unpinned install would move the thing being compared: a default
# Renovate changed would surface on whichever unrelated PR ran next. Pinned, it
# surfaces on the currency PR that raises the pin, where re-recording is the fix.
env:
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: v1.19.2
  KYVERNO_SHA256: 357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # A node image the KIND_VERSION release lists, by the digest its notes give,
  # at the fleet's Kubernetes minor. A kind bump replaces it with that release's
  # image for the same minor. scripts/check-digest-rewrite.sh reads it from here.
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: v1.36.4
  KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.1
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.65.0

jobs:
  placeholders:
    name: Zero-placeholder gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No unfilled placeholders in deploy config
        run: ./scripts/no-placeholders.sh

  lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  # ── Pinned chart archives ────────────────────────────────────────────
  # Every job that renders a pinned chart waits on this one and reads the
  # archives it caches, so a registry is read once per pin set rather than once
  # per job. A retry cannot recover every 429: ECR Public allows an
  # unauthenticated client a fixed amount of data per month and identifies the
  # client by its address, so a shared runner address can arrive with that
  # allowance spent, and no wait inside a job outlasts it. Every job that renders
  # a pinned chart would fetch from its own runner address and fail on whichever
  # one is spent. Here one job fetches, through scripts/registry.py's client,
  # which waits out a 429 that does relent and checks each archive against its
  # digest; a failure leaves one job to re-run, and no rendering job starts
  # without its charts.
  #
  # The key is the appset pins and the client that verified the archives, so a
  # run that moves neither fetches nothing, and names nothing about the branch
  # or the run, so a pull request whose pins match main's restores main's set.
  # --fetch removes every cached file no pin names, so whatever set a run starts
  # from, the set it keeps holds the current pins and nothing older.
  #
  # The cache is restored and saved as separate steps, because a combined
  # actions/cache step saves only when the whole job succeeds: a fetch that
  # verified every chart but the one a registry throttled would keep none of
  # them, and the next run would read every chart again from an address in the
  # same position. The save runs whatever the fetch did. A complete set goes
  # under the key every rendering job restores. A set the fetch left incomplete
  # goes under a key of its own, charts-partial- followed by the same pins hash,
  # the run and its attempt, so no later save collides with it, since a saved
  # key is never replaced.
  #
  # A restore that misses its key exactly takes the newest key the key is a
  # prefix of, before it reads restore-keys, so no incomplete set's key begins
  # with the key the rendering jobs restore: they restore a complete set or
  # nothing. This job's restore-keys hand it, in order, the newest set an earlier
  # attempt at the same pins left incomplete, so a re-run fetches only what that
  # attempt did not reach, and then the newest set kept for any pins, so a pin
  # bump fetches only the moved chart. A client change hands it archives the
  # client re-checks against their digest records, and fetches again any that
  # carry none.
  #
  # ECR Public serves an anonymous client one image pull a second, and one chart
  # read is several requests to it, so REQUEST_SPACING_SECONDS in
  # scripts/registry.py holds every request to public.ecr.aws apart rather than
  # leaving the retries to wait out the 429 a burst draws.
  #
  # This job and every job that restores its archives allow longer than
  # registry.CALL_BOUND_SECONDS. Each call runs to a deadline,
  # registry.CALL_DEADLINE_SECONDS after it starts, and the token request a 401
  # challenge leads to spends that same deadline: room for RETRY_ATTEMPTS
  # requests of up to HTTP_TIMEOUT each and, before every retry, a wait of at
  # most RETRY_MAX_WAIT_SECONDS stretched by RETRY_JITTER. The bound adds the
  # one socket read, of up to HTTP_TIMEOUT, that a body still arriving at the
  # deadline can have under way. A call the registry throttles to its deadline,
  # or trickles a body past it, then reports which host it was reading before
  # the job is cancelled, and a registry that throttles call after call ends the
  # job at its timeout rather than at the runner's ceiling. test_registry holds
  # each of those jobs above the bound and on this job's cache key.
  #
  # The cache path and key are anchored here. The jobs that restore the archives
  # alias one restore step, defined on the first of them, so none of them can
  # restore from anywhere else.
  #
  # ── Authenticated pulls from public.ecr.aws ──────────────────────────
  # The per-address allowance above is the anonymous one. A client logged in
  # with an ECR Public authorization token is metered against the AWS account
  # that issued it instead, so this job and image-vulnerabilities, the two that
  # read public.ecr.aws in bulk, log in before they read. The role named by the
  # ECR_PUBLIC_PULL_ROLE_ARN repo variable is trusted from this repo's
  # pull_request and main contexts and can do nothing but mint that token. The
  # two jobs grant id-token at job level, and no other job and no workflow
  # grants it, so no other job can mint the OIDC token the role is assumed
  # with.
  #
  # The login is skipped, and the job reads anonymously, when the variable is
  # unset and when the run is for a pull request from a fork, which GitHub
  # issues no OIDC token to. Once the variable is set, a role that cannot be
  # assumed fails the job on that step rather than falling back, so a
  # misconfigured role is reported where it is, not as the throttling the login
  # exists to prevent.
  #
  # The role's credentials reach the login step alone, as outputs of the step
  # that assumed the role, not as environment every later step inherits. The
  # login pipes the token into `docker login` under pipefail, so a token that
  # could not be fetched fails the step whatever docker makes of the empty
  # input it is handed. ECR Public issues tokens from us-east-1 only.
  #
  # `docker login` stores the token in ~/.docker/config.json. trivy reads
  # registry credentials from there, and scripts/registry.py sends them to a
  # token realm only when the realm and the registry it is reading are both
  # the host they were stored for, so one login serves both.
  # scripts/tests/test_workflows.py evaluates both steps' conditions, runs the
  # login against stand-ins for both CLIs, and holds the id-token grant to
  # these two jobs.
  charts:
    name: Pinned chart archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # the OIDC token the ECR Public pull role is assumed with
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - &ecr-public-credentials
        name: Assume the ECR Public pull role
        id: ecr-public
        if: vars.ECR_PUBLIC_PULL_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }}
          aws-region: us-east-1
          output-credentials: true
          output-env-credentials: false
      - &ecr-public-login
        name: Log in to public.ecr.aws
        if: steps.ecr-public.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.ecr-public.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.ecr-public.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.ecr-public.outputs.aws-session-token }}
        run: |
          set -o pipefail
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Restore the chart archives kept last
        id: chart-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: &chart-cache ~/.cache/eks-gitops/charts
          key: &chart-cache-key charts-${{ hashFiles('applicationsets/*.yaml', 'scripts/registry.py') }}
          restore-keys: |
            charts-partial-${{ hashFiles('applicationsets/*.yaml', 'scripts/registry.py') }}-
            charts-

      - name: Fetch every pinned chart
        id: fetch
        run: ./scripts/render-addons.py --fetch

      - name: Keep the complete set under the key the rendering jobs restore
        if: always() && steps.fetch.outcome == 'success' && steps.chart-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *chart-cache
          key: ${{ steps.chart-cache.outputs.cache-primary-key }}

      - name: Keep what the fetch verified before it stopped
        if: always() && (steps.fetch.outcome == 'failure' || steps.fetch.outcome == 'cancelled')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *chart-cache
          key: charts-partial-${{ hashFiles('applicationsets/*.yaml', 'scripts/registry.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ── Dashboard gate ───────────────────────────────────────────────────
  # Every spec.grafanaCom.id must (a) still exist on grafana.com and (b) be
  # saveable by Amazon Managed Grafana. Both failure modes park the CR forever
  # and hold the dashboards Application — and app-of-apps — Degraded, and
  # neither is visible to kustomize/kubeconform/trivy: the ids render as valid
  # ints, so only grafana.com itself can answer. Talks to grafana.com over the
  # network; the script retries each request with backoff so a blip is a retry,
  # not a red build.
  dashboards:
    name: Dashboard gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dead ids + AMG-unsaveable legacy alerts
        run: ./scripts/validate-dashboards.py

      # The datasource gate above resolves a panel's uid against the datasource
      # files, which says nothing about whether the Secret behind a datasource
      # ever arrives. An ExternalSecret naming a cluster-scoped secret the
      # ApplicationSet does not patch never syncs, and External Secrets fails one
      # whole — so an unpatched key takes the keys that WERE patched down with it,
      # and every datasource reading that Secret goes with them while this job
      # stays green.
      - name: ExternalSecret keys are named once and patched per cluster
        run: ./scripts/check-externalsecret-keys.py

      # The catalog declares one ClusterSecretStore and eleven other places
      # restate its name — eight secretStoreRefs, an ApplicationSet patch target,
      # and five chart defaults in repositories this one does not own. An
      # ExternalSecret naming a store that is not there installs and syncs
      # cleanly and records SecretSyncedError on an object nothing in the install
      # path reads; an unmatched kustomize patch target is not an error at all,
      # so the region rewrite silently does not happen. This holds them to the
      # declaration and publishes it for the consumers outside this repository.
      - name: Every secret-store reference resolves to the declared store
        run: ./scripts/check-secret-store-refs.py

      # A CUR export runs an explicit column projection, so its delivered set is
      # far narrower than the CUR specification and every documented column name
      # looks plausible in a panel query. The dashboard gate below reads
      # datasource refs and grafana.com ids and never opens rawSQL, so a panel
      # naming an undelivered column is invisible to it. The equivalent assertion
      # in eks-agent-platform sits next to the table definition and cannot reach
      # the consumer side of the repo boundary.
      - name: Athena panels name only columns the CUR export delivers
        run: ./scripts/check-athena-panel-columns.py

      # A rule that excludes a state is asserting some other rule covers it. Two
      # rules can each be individually correct and leave the state reported by
      # nobody. kubeconform SKIPs the Grafana CRDs and no gate executes the
      # PromQL, so an alert that can never fire looks exactly like one that has
      # not fired yet.
      - name: Excluded alert states are somebody's job
        run: ./scripts/check-alert-coverage.py

      # A rule labelled to page is asking for a human to be woken. Grafana keeps
      # that promise by matching the label against a notification policy; with
      # no matching route the alert falls to the tree's root, and with no tree at
      # all to the workspace default policy and its empty default contact point.
      # The rule and the policy never name each other, so nothing else in the
      # tree can see the gap — and the signal arrives at the moment nobody is
      # watching a dashboard.
      - name: Every alert severity routes to a declared contact point
        run: ./scripts/check-alert-severity-routes.py

      # A burn-rate summary is the alert TITLE — the sentence that reaches a
      # human first and often the only one they read. The figure in it is prose
      # that nothing parses, so a rule can name a budget its own expression does
      # not spend and pass every rule-level validation, because the expression is
      # correct and only the sentence is wrong. This derives the figure from the
      # rule's factor and window against the objective the dashboards measure, so
      # there is no constant here to agree with the standard today and be
      # compared to nothing tomorrow.
      - name: Burn-rate summaries state the budget their expression spends
        run: ./scripts/check-burn-rate-budgets.py

  # ── Kyverno policy unit tests ────────────────────────────────────────
  # `kyverno test` proves each policy rule PASSES a compliant resource and FAILS
  # a violating one (policies/kyverno/tests). Without this, a policy could be
  # weakened, mis-indented into a no-op, or have its pattern silently broken and
  # still render + schema-validate clean — the cluster would just stop enforcing
  # it. This gate catches that at PR time. CLI pinned to the release the policies
  # were authored against.
  serviceaccount-bindings:
    name: Pods name ServiceAccounts that exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # A Pod Identity association binds by ServiceAccount NAME and does not fail
      # when the name is wrong — it is created, it shows in the console, and the pod
      # runs on the node role instead. Every manifest is valid and the workload has
      # no AWS identity.
      - name: Every pod names a ServiceAccount its chart creates
        run: ./scripts/check-serviceaccount-bindings.py

  platform-crs:
    name: the catalog's own CRs are admissible
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # Restored under the key the charts job keeps them under. A miss leaves
      # the job to fetch every chart from its own runner address, spending that
      # address's registry allowance, which is the exposure the charts job
      # exists to remove, so a miss is raised as a warning on the run.
      - &restore-charts
        name: Restore the pinned chart archives
        id: charts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *chart-cache
          key: *chart-cache-key
      - &charts-missed
        name: Say so when no pinned chart archives were restored
        if: steps.charts.outputs.cache-hit != 'true'
        run: echo "::warning title=Chart cache miss::No archives were restored under the charts job's key, so this job fetches every pinned chart from its own runner address."
      # The platform's own CRDs are on kubeconform-scan.sh's skip list — their
      # schemas are published to no public catalog — and that skip's comment says
      # these kinds are validated out-of-band against a real webhook. This closes
      # that gap without a cluster: a required field missing from a CR —
      # `spec.agents[].image` on an AgentFleet, say — renders and schema-scans
      # clean and only fails at apply. The CRDs come from the operator chart
      # version this catalog pins.
      - name: The walker is wrong loudly, not quietly
        run: ./scripts/check-platform-crs.py --self-test
      - name: Every platform CR the catalog declares would be admitted
        run: ./scripts/check-platform-crs.py --list

  catalog-revision:
    name: a catalog source reads its revision, never pins one
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # cluster-bootstrap stamps gitops/repo-branch beside gitops/repo-url. Only
      # app-of-apps ever read it, so a cluster bootstrapped against any other
      # revision would run app-of-apps there and every child Application on main —
      # two revisions of the catalog at once, both reporting Synced and Healthy.
      - name: Catalog sources read gitops/repo-branch
        run: ./scripts/check-catalog-revision.py --list

  gate-tests:
    name: the gates themselves are tested
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # The positive controls exercise every gate that carries one, and some of
      # those shell out: check-policy-validity needs kustomize and kyverno,
      # check-alert-severity-routes and check-burn-rate-budgets need kustomize,
      # and check-serviceaccount-bindings needs helm. Without these the control
      # cannot establish that the gate is clean before mutating, so it proves
      # nothing.
      #
      # Those gates exit 2 with a sentence when a tool is absent rather than
      # raising FileNotFoundError, so a missing binary is distinguishable from a
      # finding. Installing them here is the other half: a gate that CAN run
      # should.
      - name: Install Kyverno CLI
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      # Every other gate in this workflow checks a manifest. This one checks
      # the gates: a canary proves a gate RAN, and nothing proves it computes
      # the right answer. stdlib unittest, no test dependency to install.
      # Identical to `task validate:gate-tests` — same working directory, same
      # argv. Keep the two argv-identical: a local gate and its CI counterpart
      # drifting apart is how a green `task validate` stops meaning anything
      # about the build.
      - name: Gate-script unit tests and coverage ratchet
        run: COVERAGE_REQUIRED=1 coverage run --rcfile=.coveragerc scripts/tests/run.py
      # A unit test says a gate computes the right answer on a fixture. A
      # positive control says the gate REJECTS the violation it exists to
      # catch, on the real tree: it asserts the gate is clean, introduces the
      # violation, verifies the edit actually landed and changed the meaning,
      # and requires a non-zero exit. A gate carrying neither a control nor an
      # asserted exemption fails this step, so the suite cannot shrink quietly.
      - name: Positive controls — every gate can reject
        run: ./scripts/tests/controls.py
      # A control proves a gate rejects a violation it was handed. This proves it
      # rejects the ABSENCE of the thing it reads — a renamed directory, a
      # narrowed glob, a filter that stopped matching. Every gate is probed, from
      # the tree rather than a list, so the class stays closed as gates are added.
      - name: No gate reports success over an absent corpus
        run: ./scripts/tests/empty-corpus.py
      # A control proves a GATE rejects a planted defect. This proves the TESTS
      # reject a reverted behaviour, and requires the assertion that catches each
      # one to be the assertion that names it — a non-zero exit says the suite
      # noticed something, not that the test describing the behaviour is what
      # noticed. It runs here rather than by hand because it is offline and its
      # cost is one test module per probe — no render, no registry, no cluster.
      - name: Reverted gate behaviour is named by the test that holds it
        run: ./scripts/tests/reverify-tests.sh
      # Prose that names a path, a task target or a file:line is a claim about
      # the tree, and nothing else keeps those claims true as the tree moves.
      - name: Named things in prose resolve
        run: ./scripts/check-named-things.py
      # The AI control plane's CRs reference each other, and nothing else reads
      # those references. A route naming an un-allowlisted model, a dangling
      # budget reference, or a bare foundation-model id each break at runtime on
      # a path no other gate exercises.
      - name: AI control-plane configuration is consistent
        run: ./scripts/check-ai-config.py
      # An appset's selector decides which environments an addon lands on; its
      # values files decide which it can render for. render-addons reads a
      # missing delta as "not deployed here" and passes, so nothing compared
      # the two until this gate.
      - name: Addons render for every environment their appset reaches
        run: ./scripts/check-env-coverage.py
      # This repo ships no package manifest, so the workflows are its whole
      # third-party surface. Offline, so the verdict is a function of the commit
      # rather than of what an upstream said today.
      - name: Workflows pass static analysis
        run: ./scripts/check-workflows.sh

  policy-validity:
    name: every rendered policy is one Kyverno will accept
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same pinned tarball + checksum the kyverno job uses. Not an install
      # action: a bump has to fail the hardcoded SHA256 next to it until a human
      # confirms the new one.
      - name: Install Kyverno CLI
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      # kyverno test proves what a policy DOES; this proves the API server
      # would accept it at all. Kyverno enforces semantic rules no schema
      # encodes — on a ClusterPolicy verifyImages rule, mutateDigest:true under
      # an Audit failure action is rejected outright — and an invalid overlay
      # renders clean, passes kubeconform, passes kyverno test, and then fails
      # to sync on every cluster.
      - name: Every rendered policy overlay is valid
        run: ./scripts/check-policy-validity.py

  python-lint:
    name: the gate scripts and their tests pass lint, typecheck and shellcheck
    runs-on: ubuntu-latest
    # pip and the ShellCheck download read the network, each bounded per
    # attempt; this bounds the job as a whole.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # 3,044 statements carrying 221 annotation-bearing lines had nothing
      # checking either. scripts/tests is in scope deliberately: a fixture that
      # drifts from the gate it exercises is invisible to a passing test run and
      # visible to a type checker. Neither step is `|| true`.
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy
      # The shell gates and the harnesses that drive them, under
      # scripts/.shellcheckrc. The runner image ships a shellcheck of its own, so
      # the pinned one is installed ahead of it on PATH and its version printed.
      - name: Install ShellCheck
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/shellcheck.tar.gz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/shellcheck.tar.gz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # Identical to `task lint:shell`.
      - name: Shell lint
        run: shellcheck scripts/*.sh scripts/tests/*.sh

  falco-rule-floor:
    name: every Falco rule set installed is one Falco loads
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *restore-charts
      - *charts-missed
      # Downloading a rule set and loading it are different things, and the
      # values file is where both look correct. falcoctl writes each ref to the
      # root of rulesfilesDir; Falco reads only what falco.rules_files names. A
      # ref added without a matching entry is pulled onto every node and never
      # evaluated, and the download succeeding means nothing else reports it.
      #
      # The gate resolves each ref against ghcr.io, so it needs the network and
      # carries no positive control — it is exempted in scripts/tests/controls.py
      # instead. An unreachable registry exits 2, a pinned major the registry
      # does not have exits 1: a network outage is not a verdict about this repo.
      - name: Every installed rule set is read, at a priority that loads it
        run: ./scripts/check-falco-rule-floor.py

  log-volume-budget:
    name: the Loki volume warns before it stops accepting writes
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *restore-charts
      - *charts-missed
      # Loki bounds nothing by stored bytes: retention reacts to the age of a
      # chunk, never to the size of the volume. The only disk-aware control is
      # the ingester's WAL threshold, and crossing it rejects every push on the
      # cluster at once. The gate renders the chart, so it needs the network —
      # which is also why it carries no positive control and is exempted in
      # scripts/tests/controls.py instead.
      #
      # It deliberately does NOT assert the volume is large enough. The PVC size
      # in values.yaml sits under ignoreDifferences and is never reconciled, and
      # counted bytes reach disk gzipped at a ratio that is a property of the
      # logs rather than the config. A green capacity claim built on either would
      # read as proof the volume fits.
      - name: The cutoff is declared and the alert leads it
        run: ./scripts/check-log-volume-budget.py

  renovate-coverage:
    name: every chart pin is watched by a manager that resolves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A customManager whose regex matches nothing is valid config —
      # renovate-config-validator passes it, because the schema is fine and the
      # pattern never runs against a file. And the built-in argocd manager can
      # *detect* a pin while deriving a package name that resolves to nothing.
      # Both leave a pin aging in silence with the config looking complete.
      # check-renovate-coverage.py READS renovate.json and applies its regexes, so
      # the config is a dependency of the gate. A manager Renovate would discard
      # as malformed still parses here, and the gate would then report a pin as
      # covered by a rule the tool never ran. Validate the config before trusting
      # what the gate says about it.
      #
      # PARTIAL by design, and stated so rather than rounded up: this checks
      # schema validity, not semantics. It accepts a datasourceTemplate naming a
      # datasource that does not exist.
      #
      # The Renovate package declares `engines.node`, and its own code uses
      # language features that decide whether it loads at all — so the Node this
      # job runs is part of what makes the two steps below meaningful. Inherited
      # from the runner it is whatever the image ships and moves without this
      # repository changing; read from .node-version it is a pin like the others,
      # and the renovate-coverage gate below asserts a manager watches it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Installed rather than run through `npx --package`, because two steps
      # below need the same resolved package: the validator, and the drift check
      # that imports each manager's defaultConfig out of it. Resolving it twice
      # would let them disagree about which Renovate the answers came from.
      - name: Resolve the Renovate package
        run: npm install --no-save --no-audit --no-fund "renovate@${RENOVATE_VERSION}"
      - name: Renovate config is well-formed
        run: ./node_modules/.bin/renovate-config-validator renovate.json
      # The Python gate matches each pin against the file patterns of the manager
      # it is attributed to. Where renovate.json configures none, those patterns
      # come from defaultConfig inside this package, which no offline gate reads —
      # so scripts/renovate-manager-defaults.json transcribes them. A stale
      # transcript is worse than none: it certifies pins against a pattern
      # Renovate does not use and prints the same success as a correct one.
      - name: Recorded manager defaults match the shipped package
        run: node scripts/check-renovate-defaults.mjs
      - name: Every chart pin is watched
        run: ./scripts/check-renovate-coverage.py

  kyverno:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    # The verify-images rows reach the registry, the Sigstore TUF mirror and
    # Rekor. kyverno-test.sh runs the suite under GNU timeout, which sends a run
    # TERM at its bound and KILL a grace period later if it is still going;
    # either counts as a transport failure, and the run is repeated. This sits
    # above every attempt at the bound and the grace, so a read that stops
    # answering ends on the script's own diagnostic.
    # scripts/tests/test_kyverno_test.py holds the two together.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Kyverno CLI
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Run policy unit tests
        run: ./scripts/kyverno-test.sh policies/kyverno/tests

      # The subnet-injection policy decides private-or-public from a scheme it
      # believes a load balancer will have, and that belief is only as wide as the
      # set of inputs it reads. The AWS Load Balancer Controller decides the same
      # thing from four annotations, an IngressClassParams field, an Ingress
      # group, and a load balancer that already exists in AWS. This derives that
      # set from the controller source at the pinned chart version and fails when
      # one of them is neither read by the policy nor recorded with the reason it
      # is not — so a spelling nobody has heard of yet lands red rather than
      # quietly taking the default. Offline: the derivation is keyed on the chart
      # pin, so moving the pin fails here, and upstream/pins re-derives on a
      # schedule.
      - name: Every input the controller decides a scheme on is one the policy reads
        run: |
          pip install --require-hashes -r requirements.txt
          ./scripts/check-lb-scheme-inputs.py
          ./scripts/check-lb-scheme-inputs.py --self-test

      # The unit tests above prove the release identity admits a release-signed
      # image and refuses a branch-signed one. They cannot see an identity
      # weakened in a way both fixtures still satisfy — a subjectRegExp other
      # than the one release identity, a flipped `required`, the transparency
      # log switched off, a validation that passes every image, a namespace
      # exclusion grown over a workload namespace. This structural gate refuses
      # those on the base and on each supply-chain overlay as kustomize renders
      # it, which is what a cluster installs: it holds the subjectRegExp and both
      # validations to one expression each, compared whole, and each tier to the
      # validationActions its environment enforces.
      # scripts/tests/test_image_verification.py applies each weakening and
      # requires the refusal.
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      - name: Verify-images signing-identity contract
        run: |
          pip install --require-hashes -r requirements.txt
          ./scripts/check-image-verification.py

  # ── Digest rewrite under real admission ──────────────────────────────
  # verify-images pins every ghcr.io/nanohype/* tag to the digest it verified,
  # and that pin is written by Kyverno's mutating webhook, which the Kyverno CLI
  # never runs for an ImageValidatingPolicy. So this brings up kind, installs the
  # pinned Kyverno chart with the catalog's values, applies each rendered
  # supply-chain overlay, and admits a tag-only signed pod and a branch-signed
  # pod through the API server: the first must come back @sha256-pinned at every
  # tier, the second must be denied wherever the overlay says Deny. Reaches the
  # registry and Rekor from inside the cluster, the round trip admission makes.
  digest-rewrite:
    name: admission pins a verified tag to its digest
    runs-on: ubuntu-latest
    # A bound on the job as a whole, above the bound the script puts on each step
    # taken alone: each kubectl request, each wait under GNU timeout, and kind
    # and helm under GNU timeout. One step that stalls ends on the script's own
    # diagnostic rather than on the runner's. The steps' bounds are not summed,
    # and a run in which several each stall to their bound can still reach this
    # one. scripts/tests/test_digest_rewrite.py holds each step's bound under it.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install kind
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version
      - name: Install kubectl
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Each supply-chain overlay pins a tag and decides a foreign identity
        run: ./scripts/check-digest-rewrite.sh

  # ── Fork-safety gate ─────────────────────────────────────────────────
  # An applied ApplicationSet must not hardcode nanohype/eks-gitops — THIS
  # CATALOG — in a repoURL. The catalog is vended: a customer forks it and
  # points their hub at THEIR fork, so a hardcoded catalog ref keeps syncing
  # from upstream and the fork's own edits never take effect. Each must resolve
  # from the cluster Secret annotation gitops/repo-url, the same mechanism
  # dashboards.yaml already uses for monitoring/grafana-url.
  #
  # The scope is CATALOG-only, and that is load-bearing — do not widen it:
  # nanohype's PUBLISHED ARTIFACTS are correctly hardcoded, because a vended org
  # CONSUMES them from upstream rather than forking them, exactly like a Helm
  # repo or a container registry. Out of scope on purpose:
  #   - nanohype/eks-agent-platform — the operator's own source/chart repo. A
  #     customer does not fork the product; templating it would point at a fork
  #     that does not exist.
  #   - ghcr.io/nanohype/* images, oci://ghcr.io/nanohype charts.
  #   - the Kyverno keyless-signing subjectRegExp — a signing IDENTITY to verify
  #     against, not a source to sync from.
  #   - everything under applicationsets/opt-in/ — app-of-apps sources
  #     `path: applicationsets` without directory.recurse, so a default install
  #     never applies them; their org-specific URLs are documented in
  #     applicationsets/opt-in/README.md as a repoint-before-enabling step.
  # See the full rationale in scripts/check-hardcoded-org.py.
  #
  # BLOCKING. Every applied ApplicationSet reads its source from
  # `{{ index .metadata.annotations "gitops/repo-url" }}`, which cluster-bootstrap
  # stamps on the ArgoCD cluster Secret. A hardcoded catalog repoURL makes a
  # forked catalog INERT — the fork syncs from the upstream org's repo and edits
  # to it do nothing. Expected count: 0.
  fork-safety:
    name: Fork-safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No hardcoded catalog repoURL in applied ApplicationSets
        run: ./scripts/check-hardcoded-org.py --blocking

  # ── Helm-render gate ─────────────────────────────────────────────────
  # Every addon is a base values.yaml plus per-env deltas, and nothing templates
  # the chart until an ArgoCD sync. A key the chart does not accept — several
  # upstream charts ship a values.schema.json that rejects unknown keys — renders
  # clean through kustomize and kubeconform and only fails at sync, fleet-wide,
  # after merge. This job templates every addon against its appset-pinned chart
  # version with the committed base + each env's values, so a bad key, a
  # malformed override, or a chart bump that drops a value fails the build
  # instead of the fleet. Chart coordinates are DERIVED from the ApplicationSets —
  # the single source of truth — by scripts/render-addons.py. The charts are
  # read from the archive cache the charts job fills.
  helm-render:
    name: Helm-render addons
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - *restore-charts
      - *charts-missed

      - name: Render every addon across every environment
        run: ./scripts/render-addons.py
      # Tag immutability is a fact about the commit under test, so it blocks
      # here. What the image CONTAINS is a separate question with a separate
      # job — image-vulnerabilities — because it has to pull every image and is
      # slow enough to be worth running in parallel with this one.
      - name: Every rendered image carries an immutable reference
        run: ./scripts/check-image-pins.py

  # ── Image vulnerability gate ─────────────────────────────────────────
  # Whoever moves a chart pin owns what the image behind it carries, and this
  # repo pins independently of any cluster. trivy-operator reports the same
  # findings at runtime, but to an operator who cannot change the pin without a
  # pull request here — so the decision belongs at the pin, which is this job.
  #
  # Blocking on a CRITICAL with a published fix that image-advisories.yaml does
  # not acknowledge. A new advisory can therefore turn a pull request red for a
  # reason the pull request did not cause; that is deliberate and the advisory
  # file is the release valve, because the alternative is a scan whose findings
  # nobody has to answer. HIGH is counted and printed, not gated.
  #
  # The run scans a digest-pinned end-of-life image first and requires its known
  # CRITICALs back. A scanner with no database returns a clean result for every
  # image, which is indistinguishable from a healthy fleet by exit code — so
  # without the canary a green run here would prove nothing at all.
  image-vulnerabilities:
    name: Rendered images carry no unacknowledged CRITICAL
    runs-on: ubuntu-latest
    needs: charts
    # trivy pulls and scans every rendered image on top of the render.
    timeout-minutes: 30
    # The ECR Public login steps are anchored on the charts job, whose comment
    # covers both jobs.
    permissions:
      contents: read
      id-token: write  # the OIDC token the ECR Public pull role is assumed with
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      # Same guard the validate job carries: setup-trivy reads an empty version
      # as "install the latest release", so an expansion failure would scan with
      # an unpinned trivy and pass.
      - name: Assert the pinned trivy version resolved
        run: |
          if [ -z "${{ env.TRIVY_VERSION }}" ]; then
            echo "TRIVY_VERSION expanded empty. setup-trivy reads that as 'latest',"
            echo "so this job would scan with an unpinned trivy and pass. Restore"
            echo "the TRIVY_VERSION key in this workflow's env block."
            exit 1
          fi

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }} # zizmor: ignore[unpinned-tools]

      - *restore-charts
      - *charts-missed
      - *ecr-public-credentials
      - *ecr-public-login

      - name: Every fixed CRITICAL is acknowledged
        run: ./scripts/check-image-vulnerabilities.py

  # ── Policy-admission gate ────────────────────────────────────────────
  # The best-practice / pod-security policies run in Enforce mode on staging and
  # production (the overlays flip validationFailureAction to Enforce), so a
  # workload that violates one is DENIED at admission on a vended cluster. Each
  # such policy carries a hand-maintained namespace exclusion list, and the addon
  # fleet cannot satisfy the policies (upstream charts never carry the org
  # platform.nanohype.dev/* label tier, device plugins and security agents need
  # root/host access, batch jobs have no service-style probes). If an addon lands
  # in a namespace that is NOT excluded, its Deployment/DaemonSet is denied — and
  # every other gate (render, kubeconform, kyverno unit tests) stays green,
  # because the contradiction only exists where the addon MEETS the policy on a
  # real Enforce cluster. This job renders the whole fleet into its real
  # destination namespaces and runs `kyverno apply` against the Enforce overlay,
  # so that class of contradiction fails here instead of at sync. It also asserts
  # all four exclusion lists are identical (their divergence is the same bug
  # class) and exercises the Audit overlay to prove the warn-vs-deny split.
  #
  # The fleet renders alongside a canary: one deliberately non-compliant workload
  # in a namespace on no exclusion list, which every rule must deny (Enforce) and
  # warn (Audit). Without it the run is indistinguishable from one that evaluated
  # nothing — every fleet namespace IS excluded, so Kyverno legitimately matches
  # zero resources and exits 0. The verdict therefore comes from the per-resource
  # policy report, not the exit code, which the canary keeps permanently non-zero.
  # A companion check asserts every namespace the fleet lands a workload in is on
  # the exclusion list, so a new addon in a new namespace is reported as uncovered.
  policy-admission:
    name: Policy-admission gate
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Install Kyverno CLI
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - *restore-charts
      - *charts-missed

      - name: Render the fleet and apply the Enforce-tier policies
        run: ./scripts/check-policy-admission.py

  # ── ApplicationSet gate ──────────────────────────────────────────────
  # The render→scan path gates rendered/ output; it never schema-checks the
  # ApplicationSet generators themselves. This validates every ApplicationSet
  # against its published schema and asserts the documented sync-wave category
  # ordering (bootstrap < networking < security < observability < operations <
  # ai-platform < argo-platform < apps) holds across them — so a malformed
  # generator or a category deployed out of order fails at PR time.
  appsets:
    name: ApplicationSet schema + sync waves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Cache kubeconform + schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/bin/kubeconform
            ~/.cache/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-${{ env.KUBECONFORM_VERSION }}-

      - name: Install kubeconform
        run: |
          if [ ! -x "$HOME/.local/bin/kubeconform" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
              -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
            tar -xz -C "$HOME/.local/bin" -f /tmp/kubeconform.tar.gz kubeconform
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ApplicationSet schema gate
        run: |
          mkdir -p "$HOME/.cache/kubeconform"
          KUBECONFORM_SKIP="" KUBECONFORM_CACHE="$HOME/.cache/kubeconform" \
            ./scripts/kubeconform-scan.sh applicationsets/

      - name: Sync-wave ordering gate
        run: ./scripts/check-sync-waves.py

      # An ApplicationSet's spec.template.metadata.labels is a plain string map
      # in the CRD schema, so kubeconform admits any value there. It only
      # becomes a label when the controller renders an Application, and an
      # invalid value fails that Application at admission — which fails the
      # app-of-apps sync task, which stops the entire addon catalog from
      # installing. Valid manifest, passing schema gate, nothing deployed.
      - name: Label-value gate
        run: ./scripts/check-label-values.py

      # Offline half of the chart-provenance gate: every pinned chart has a
      # record and every record a pin. Deliberately does not touch the network —
      # whether a chart went deprecated overnight is not a function of this
      # commit, and gating merges on it would redden pull requests that changed
      # nothing. chart-provenance.yml asks that question on a schedule.
      - name: Chart provenance gate
        run: |
          ./scripts/check-chart-deprecation.py
          ./scripts/check-chart-deprecation.py --self-test

      # A source with a `path` and no chart is not automatically a kustomize
      # directory: ArgoCD classifies by what the directory holds, and a Directory
      # source is the one shape the repo-server measures against
      # --max-combined-directory-manifests-size. Over that, it generates nothing
      # and reports ComparisonError, which reads as `Unknown` in the sync column
      # and surfaces waves later as whatever workload needed the kind that never
      # installed. Offline like the chart half above: the sizes are keyed on
      # (repoURL, targetRevision, path), so a pin cannot move without its
      # measurement going stale here, and upstream/pins asks the live question.
      - name: Directory sources fit the repo-server's combined-manifest ceiling
        run: |
          ./scripts/check-directory-manifest-size.py
          ./scripts/check-directory-manifest-size.py --self-test

  # ── Appset render gate ───────────────────────────────────────────────
  # The Karpenter EC2NodeClass patch carries if/range control flow inside a
  # `patch: |-` string block. Every other gate treats that string as opaque —
  # the appset schema gate validates its YAML shape, kustomize builds the
  # overlays without ever rendering the per-cluster patch, so a control-flow
  # edit that breaks the render (a bare index that trips missingkey=error, or a
  # dig that panics on the string label map the cluster generator hands back)
  # ships green and only breaks at sync, on every cluster the generator
  # produces. This job renders the committed template the way the ArgoCD
  # ApplicationSet controller does (Go text/template + sprig,
  # Option("missingkey=error")) against fixture create/adopt/legacy cluster
  # Secrets and asserts the subnetSelectorTerms shape for each.
  appset-render:
    name: Appset render (Karpenter subnet selector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: applicationsets/rendertest/go.mod
          cache-dependency-path: applicationsets/rendertest/go.sum

      - name: Render Karpenter patch template against fixture cluster Secrets
        working-directory: applicationsets/rendertest
        run: go test ./...

  # ── Secret scan ──────────────────────────────────────────────────────
  # gitleaks over the working tree. The catalog keeps secrets out by
  # construction (External Secrets + Pod Identity, no static keys in values), but
  # nothing mechanically stops a future commit from pasting a raw credential
  # into a values file — the residual the threat model named
  # (docs/threat-model.md). Run as the pinned binary rather than the marketplace
  # action, which is license-gated for organization accounts.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
            -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact -v

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production, hub]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Render manifests
        run: |
          mkdir -p rendered
          echo "Rendering ${{ matrix.environment }} overlays..."
          find . -path "*/overlays/${{ matrix.environment }}/kustomization.yaml" -exec dirname {} \; | while read dir; do
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/$(echo "$dir" | tr '/' '_').yaml" || exit 1
          done
          # Env-agnostic kustomize roots — identical on every cluster (their
          # per-environment values resolve through External Secrets and the
          # cluster generator), so they carry no per-env overlays.
          for dir in dashboards/base addons/bootstrap/secret-stores addons/bootstrap/secret-stores-managed; do
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/$(echo "$dir" | tr '/' '_').yaml" || exit 1
          done
          echo "All ${{ matrix.environment }} manifests rendered successfully."

      # The druid catalog chart is a tenant-workload chart (not wired by a
      # default ApplicationSet). Render it with synthetic tenant values so its
      # templates still pass the same render-assert / schema / misconfiguration
      # gates as every kustomize root.
      - name: Render druid catalog chart
        run: |
          helm template ci catalog/druid/chart -n druid-ci \
            -f catalog/druid/values.yaml \
            --set hostedId=ci \
            --set environment=${{ matrix.environment }} \
            --set secrets.metadata=ci/druid/metadata \
            --set secrets.admin=ci/druid/admin \
            --set secrets.system=ci/druid/system \
            --set secrets.keystore=ci/druid/keystore \
            --set s3.indexLogsBucket=ci-druid-indexlogs \
            --set s3.deepStorageBucket=ci-druid-deepstorage \
            --set s3.msqBucket=ci-druid-msq \
            > rendered/catalog_druid_chart.yaml

      # Source files are gated by the zero-placeholder job; this asserts the
      # RENDERED output too — catching a zero account id, placeholder token, or
      # account-less ARN that only appears after kustomize/helm templating.
      - name: Assert no unfilled sentinels in rendered output
        # Pinned to a commit SHA, not a floating branch: this action runs in the
        # merge path, so a pin keeps a change to nanohype/nanohype from silently
        # altering this gate. nanohype/nanohype publishes no release tags, so the
        # SHA is the immutable ref; Renovate's github-actions manager bumps it.
        uses: nanohype/nanohype/.github/actions/render-assert@d75fb5c26a1745df8e33d1a8c89f6f7de6c37b39 # nanohype/nanohype main
        with:
          manifests: rendered
          exclude: ''

      # ── Schema gate ────────────────────────────────────────────────────
      # kubeconform in strict mode over everything just rendered, via the shared
      # scripts/kubeconform-scan.sh — the SINGLE source of truth for the strict
      # invocation and its skip list, so `task scan` (local) and this job never
      # disagree. Native kinds resolve from yannh/kubernetes-json-schema and CRD
      # kinds from the datreeio CRDs-catalog, each at a commit the script pins
      # and Renovate moves; there is deliberately no -ignore-missing-schemas. The
      # skip list (the external Grafana CR and the first-party platform CRDs,
      # validated out-of-band against the real webhook) and its full rationale
      # live in that script.
      #
      # The binary and downloaded schemas are cached; restore-keys lets each run
      # reuse the newest cache while still persisting newly fetched schemas.
      - name: Cache kubeconform + schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/bin/kubeconform
            ~/.cache/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-${{ env.KUBECONFORM_VERSION }}-

      - name: Install kubeconform
        run: |
          if [ ! -x "$HOME/.local/bin/kubeconform" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 \
              -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
            tar -xz -C "$HOME/.local/bin" -f /tmp/kubeconform.tar.gz kubeconform
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Schema gate (kubeconform)
        run: |
          mkdir -p "$HOME/.cache/kubeconform"
          KUBECONFORM_CACHE="$HOME/.cache/kubeconform" ./scripts/kubeconform-scan.sh rendered

      # ── Misconfiguration gate ──────────────────────────────────────────
      # trivy config over the rendered manifests — not the repo tree — so
      # every check sees the post-templating truth with helm values applied.
      # MEDIUM and above hard-fails; .trivyignore.yaml carries the scoped,
      # justified exceptions (device-plugin root/hostPath, druid's
      # k8s-extensions Role, env-indirected config keys).
      # setup-trivy treats an empty `version` as "install the latest release"
      # rather than as an error, so an env key that is renamed or removed does
      # not fail this step — it silently installs a different scanner than the
      # one this workflow pins, and the job still reports a clean scan. Empty is
      # a valid instruction to the receiver, which is the case no workflow linter
      # models: the YAML, the shell and the expression are all well-formed.
      #
      # Asserted with a shell conditional rather than a tool, so no missing
      # binary can delete the assertion.
      - name: Assert the pinned trivy version resolved
        run: |
          if [ -z "${{ env.TRIVY_VERSION }}" ]; then
            echo "TRIVY_VERSION expanded empty. setup-trivy reads that as 'latest',"
            echo "so this job would scan with an unpinned trivy and pass. Restore"
            echo "the TRIVY_VERSION key in this workflow's env block."
            exit 1
          fi

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # TRIVY_VERSION is a literal in this workflow's env block, carrying a
          # `# renovate:` annotation and asserted by the renovate-coverage gate.
          # zizmor cannot follow the env indirection and reads any expansion here
          # as unpinned; the pin it looks for is one level up.
          version: ${{ env.TRIVY_VERSION }} # zizmor: ignore[unpinned-tools]
          cache: true

      - name: Misconfiguration gate (trivy config)
        run: |
          trivy config --exit-code 1 \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            rendered

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.event_name == 'pull_request'
    needs:
      [
        placeholders,
        charts,
        lint,
        dashboards,
        kyverno,
        digest-rewrite,
        fork-safety,
        helm-render,
        image-vulnerabilities,
        policy-admission,
        appsets,
        appset-render,
        secrets,
        validate,
        renovate-coverage,
        log-volume-budget,
        falco-rule-floor,
        python-lint,
        policy-validity,
        gate-tests,
        serviceaccount-bindings,
        platform-crs,
        catalog-revision,
      ]
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const icon = r => r === 'success' ? ':white_check_mark:'
              : r === 'skipped' ? ':fast_forward:' : ':x:';
            const results = {
              'Zero-placeholder gate': '${{ needs.placeholders.result }}',
              'Pinned chart archives': '${{ needs.charts.result }}',
              'YAML Lint': '${{ needs.lint.result }}',
              'Dashboard gate (live grafana.com ids + AMG-saveable)': '${{ needs.dashboards.result }}',
              'Kyverno policy tests (+ verify-images contract)': '${{ needs.kyverno.result }}',
              'Admission pins a verified tag to its digest (kind)': '${{ needs.digest-rewrite.result }}',
              'Fork-safety gate (no hardcoded org, blocking)': '${{ needs.fork-safety.result }}',
              'Helm-render (every addon × every env)': '${{ needs.helm-render.result }}',
              'Rendered images carry no unacknowledged CRITICAL': '${{ needs.image-vulnerabilities.result }}',
              'Policy-admission (Enforce-tier Kyverno vs the fleet)': '${{ needs.policy-admission.result }}',
              'ApplicationSet schema + sync waves': '${{ needs.appsets.result }}',
              'Appset render (Karpenter subnet selector)': '${{ needs.appset-render.result }}',
              'Secret scan (gitleaks)': '${{ needs.secrets.result }}',
              'Render + assert + schema + misconfig (all environments)': '${{ needs.validate.result }}',
              'Renovate manager coverage': '${{ needs.renovate-coverage.result }}',
              'Loki volume warns before cutoff': '${{ needs.log-volume-budget.result }}',
              'Falco loads every rule set it installs': '${{ needs.falco-rule-floor.result }}',
              'Gate scripts pass lint, typecheck and shellcheck': '${{ needs.python-lint.result }}',
              'Policy validity (kustomize + kyverno)': '${{ needs.policy-validity.result }}',
              'The gates themselves are tested': '${{ needs.gate-tests.result }}',
              'Pods name ServiceAccounts that exist': '${{ needs.serviceaccount-bindings.result }}',
              'Catalog CRs admissible against the operator chart': '${{ needs.platform-crs.result }}',
              'Catalog source reads its revision': '${{ needs.catalog-revision.result }}',
            };
            const rows = Object.entries(results)
              .map(([check, r]) => `| ${check} | ${icon(r)} ${r} |`)
              .join('\n');
            const passed = Object.values(results).every(r => r === 'success' || r === 'skipped');

            const body = `## CI Results

            | Check | Status |
            |-------|--------|
            ${rows}

            ${passed ? 'All checks passed.' : 'One or more checks failed — see the job logs.'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        placeholders,
        charts,
        renovate-coverage,
        log-volume-budget,
        falco-rule-floor,
        python-lint,
        policy-validity,
        gate-tests,
        lint,
        dashboards,
        serviceaccount-bindings,
        platform-crs,
        catalog-revision,
        kyverno,
        digest-rewrite,
        fork-safety,
        helm-render,
        image-vulnerabilities,
        policy-admission,
        appsets,
        appset-render,
        secrets,
        validate,
        pr-summary,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
