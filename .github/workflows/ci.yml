name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# CLI tools this workflow downloads as release tarballs or installs through a
# setup action. Pinned in one place so a
# Renovate custom manager can watch each `# renovate:`-annotated line and open a
# currency PR that runs the render/schema/policy gates before merge. A bump also
# invalidates the hardcoded SHA256 below it, so a human confirms the new checksum.
env:
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: v1.18.2
  KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.72.0

jobs:
  placeholders:
    name: Zero-placeholder gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No unfilled placeholders in deploy config
        run: ./scripts/no-placeholders.sh

  lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  # ── Dashboard gate ───────────────────────────────────────────────────
  # Every spec.grafanaCom.id must (a) still exist on grafana.com and (b) be
  # saveable by Amazon Managed Grafana. Both failure modes park the CR forever
  # and hold the dashboards Application — and app-of-apps — Degraded, and
  # neither is visible to kustomize/kubeconform/trivy: the ids render as valid
  # ints, so only grafana.com itself can answer. Talks to grafana.com over the
  # network; the script retries each request with backoff so a blip is a retry,
  # not a red build.
  dashboards:
    name: Dashboard gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dead ids + AMG-unsaveable legacy alerts
        run: ./scripts/validate-dashboards.py

      # The datasource gate above resolves a panel's uid against the datasource
      # files, which says nothing about whether the Secret behind a datasource
      # ever arrives. An ExternalSecret naming a cluster-scoped secret the
      # ApplicationSet does not patch never syncs, and External Secrets fails one
      # whole — so an unpatched key takes the keys that WERE patched down with it,
      # and every datasource reading that Secret goes with them while this job
      # stays green.
      - name: ExternalSecret keys are named once and patched per cluster
        run: ./scripts/check-externalsecret-keys.py

      # A CUR export runs an explicit column projection, so its delivered set is
      # far narrower than the CUR specification and every documented column name
      # looks plausible in a panel query. The dashboard gate below reads
      # datasource refs and grafana.com ids and never opens rawSQL, so a panel
      # naming an undelivered column is invisible to it. The equivalent assertion
      # in eks-agent-platform sits next to the table definition and cannot reach
      # the consumer side of the repo boundary.
      - name: Athena panels name only columns the CUR export delivers
        run: ./scripts/check-athena-panel-columns.py

      # A rule that excludes a state is asserting some other rule covers it. Two
      # rules can each be individually correct and leave the state reported by
      # nobody. kubeconform SKIPs the Grafana CRDs and no gate executes the
      # PromQL, so an alert that can never fire looks exactly like one that has
      # not fired yet. kubeconform SKIPs the Grafana CRDs and no gate
      # executes the PromQL, so an alert that can never fire looks exactly like
      # one that has not fired yet.
      - name: Excluded alert states are somebody's job
        run: ./scripts/check-alert-coverage.py

  # ── Kyverno policy unit tests ────────────────────────────────────────
  # `kyverno test` proves each policy rule PASSES a compliant resource and FAILS
  # a violating one (policies/kyverno/tests). Without this, a policy could be
  # weakened, mis-indented into a no-op, or have its pattern silently broken and
  # still render + schema-validate clean — the cluster would just stop enforcing
  # it. This gate catches that at PR time. CLI pinned to the release the policies
  # were authored against.
  serviceaccount-bindings:
    name: Pods name ServiceAccounts that exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # A Pod Identity association binds by ServiceAccount NAME and does not fail
      # when the name is wrong — it is created, it shows in the console, and the pod
      # runs on the node role instead. Every manifest is valid and the workload has
      # no AWS identity.
      - name: Every pod names a ServiceAccount its chart creates
        run: ./scripts/check-serviceaccount-bindings.py

  platform-crs:
    name: the catalog's own CRs are admissible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # The platform's own CRDs are on kubeconform-scan.sh's skip list — their
      # schemas are published to no public catalog — and that skip's comment says
      # these kinds are validated out-of-band against a real webhook. This closes
      # that gap without a cluster: a required field missing from a CR —
      # `spec.agents[].image` on an AgentFleet, say — renders and schema-scans
      # clean and only fails at apply. The CRDs come from the operator chart
      # version this catalog pins.
      - name: The walker is wrong loudly, not quietly
        run: ./scripts/check-platform-crs.py --self-test
      - name: Every platform CR the catalog declares would be admitted
        run: ./scripts/check-platform-crs.py --list

  catalog-revision:
    name: a catalog source reads its revision, never pins one
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # cluster-bootstrap stamps gitops/repo-branch beside gitops/repo-url. Only
      # app-of-apps ever read it, so a cluster bootstrapped against any other
      # revision would run app-of-apps there and every child Application on main —
      # two revisions of the catalog at once, both reporting Synced and Healthy.
      - name: Catalog sources read gitops/repo-branch
        run: ./scripts/check-catalog-revision.py --list

  gate-tests:
    name: the gates themselves are tested
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # The positive controls exercise every gate, and three of them shell out:
      # check-policy-validity needs kustomize and kyverno, check-platform-crs
      # and render-addons need helm. Without these the control cannot establish
      # that the gate is clean before mutating, so it proves nothing — which is
      # exactly what this job reported before they were installed.
      #
      # Those gates now exit 2 with a sentence when a tool is absent rather than
      # raising FileNotFoundError, so a missing binary is distinguishable from a
      # finding. Installing them here is the other half: a gate that CAN run
      # should.
      - name: Install Kyverno CLI
        run: |
          curl -fsSL -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      # Every other gate in this workflow checks a manifest. This one checks
      # the gates: a canary proves a gate RAN, and nothing proves it computes
      # the right answer. stdlib unittest, no test dependency to install.
      # Identical to `task validate:gate-tests` — same working directory, same
      # argv. Keep the two argv-identical: a local gate and its CI counterpart
      # drifting apart is how a green `task validate` stops meaning anything
      # about the build.
      - name: Gate-script unit tests and coverage ratchet
        run: COVERAGE_REQUIRED=1 coverage run --rcfile=.coveragerc scripts/tests/run.py
      # A unit test says a gate computes the right answer on a fixture. A
      # positive control says the gate REJECTS the violation it exists to
      # catch, on the real tree: it asserts the gate is clean, introduces the
      # violation, verifies the edit actually landed and changed the meaning,
      # and requires a non-zero exit. A gate carrying neither a control nor an
      # asserted exemption fails this step, so the suite cannot shrink quietly.
      - name: Positive controls — every gate can reject
        run: ./scripts/tests/controls.py
      # Prose that names a path, a task target or a file:line is a claim about
      # the tree, and nothing else keeps those claims true as the tree moves.
      - name: Named things in prose resolve
        run: ./scripts/check-named-things.py
      # The AI control plane's CRs reference each other, and nothing else reads
      # those references. A route naming an un-allowlisted model, a dangling
      # budget reference, or a bare foundation-model id each break at runtime on
      # a path no other gate exercises.
      - name: AI control-plane configuration is consistent
        run: ./scripts/check-ai-config.py
      # An appset's selector decides which environments an addon lands on; its
      # values files decide which it can render for. render-addons reads a
      # missing delta as "not deployed here" and passes, so nothing compared
      # the two until this gate.
      - name: Addons render for every environment their appset reaches
        run: ./scripts/check-env-coverage.py
      # This repo ships no package manifest, so the workflows are its whole
      # third-party surface. Offline, so the verdict is a function of the commit
      # rather than of what an upstream said today.
      - name: Workflows pass static analysis
        run: ./scripts/check-workflows.sh

  policy-validity:
    name: every rendered policy is one Kyverno will accept
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same pinned tarball + checksum the kyverno job uses. Not an install
      # action: a bump has to fail the hardcoded SHA256 next to it until a human
      # confirms the new one.
      - name: Install Kyverno CLI
        run: |
          curl -fsSL -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3
      # kyverno test proves what a policy DOES; this proves the API server
      # would accept it at all. Kyverno enforces semantic rules no schema
      # encodes — mutateDigest:true under an Audit failure action is rejected
      # outright — and an invalid overlay renders clean, passes kubeconform,
      # passes kyverno test, and then fails to sync on every cluster.
      - name: Every rendered policy overlay is valid
        run: ./scripts/check-policy-validity.py

  python-lint:
    name: the gate scripts lint and typecheck, tests included
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt
      # 3,044 statements carrying 221 annotation-bearing lines had nothing
      # checking either. scripts/tests is in scope deliberately: a fixture that
      # drifts from the gate it exercises is invisible to a passing test run and
      # visible to a type checker. Neither step is `|| true`.
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy

  falco-rule-floor:
    name: every Falco rule set installed is one Falco loads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Downloading a rule set and loading it are different things, and the
      # values file is where both look correct. falcoctl writes each ref to the
      # root of rulesfilesDir; Falco reads only what falco.rules_files names. A
      # ref added without a matching entry is pulled onto every node and never
      # evaluated, and the download succeeding means nothing else reports it.
      #
      # The gate resolves each ref against ghcr.io, so it needs the network and
      # carries no positive control — it is exempted in scripts/tests/controls.py
      # instead. An unreachable registry exits 2, a pinned major the registry
      # does not have exits 1: a network outage is not a verdict about this repo.
      - name: Every installed rule set is read, at a priority that loads it
        run: ./scripts/check-falco-rule-floor.py

  log-volume-budget:
    name: the Loki volume warns before it stops accepting writes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Loki bounds nothing by stored bytes: retention reacts to the age of a
      # chunk, never to the size of the volume. The only disk-aware control is
      # the ingester's WAL threshold, and crossing it rejects every push on the
      # cluster at once. The gate renders the chart, so it needs the network —
      # which is also why it carries no positive control and is exempted in
      # scripts/tests/controls.py instead.
      #
      # It deliberately does NOT assert the volume is large enough. The PVC size
      # in values.yaml sits under ignoreDifferences and is never reconciled, and
      # counted bytes reach disk gzipped at a ratio that is a property of the
      # logs rather than the config. A green capacity claim built on either would
      # read as proof the volume fits.
      - name: The cutoff is declared and the alert leads it
        run: ./scripts/check-log-volume-budget.py

  renovate-coverage:
    name: every chart pin is watched by a manager that resolves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A customManager whose regex matches nothing is valid config —
      # renovate-config-validator passes it, because the schema is fine and the
      # pattern never runs against a file. And the built-in argocd manager can
      # *detect* a pin while deriving a package name that resolves to nothing.
      # Both leave a pin aging in silence with the config looking complete.
      # check-renovate-coverage.py READS renovate.json and applies its regexes, so
      # the config is a dependency of the gate. A manager Renovate would discard
      # as malformed still parses here, and the gate would then report a pin as
      # covered by a rule the tool never ran. Validate the config before trusting
      # what the gate says about it.
      #
      # PARTIAL by design, and stated so rather than rounded up: this checks
      # schema validity, not semantics. It accepts a datasourceTemplate naming a
      # datasource that does not exist.
      - name: Renovate config is well-formed
        run: npx --yes --package renovate renovate-config-validator renovate.json
      - name: Every chart pin is watched
        run: ./scripts/check-renovate-coverage.py

  kyverno:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Kyverno CLI
        run: |
          curl -fsSL -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Run policy unit tests
        run: kyverno test policies/kyverno/tests

      # `kyverno test` cannot reach Fulcio/Rekor, so it never verifies a Cosign
      # signature offline — the unit tests above only pin verify-images' match/
      # exclude scoping. This structural gate guards the signing-IDENTITY contract
      # the unit tests are blind to (required signature, GitHub OIDC issuer,
      # anchored org-scoped release-workflow subjectRegExp), so a widened
      # subjectRegExp or a flipped `required` can't ship silently.
      - name: Verify-images signing-identity contract
        run: |
          pip install --require-hashes -r requirements.txt
          ./scripts/check-image-verification.py

  # ── Fork-safety gate ─────────────────────────────────────────────────
  # An applied ApplicationSet must not hardcode nanohype/eks-gitops — THIS
  # CATALOG — in a repoURL. The catalog is vended: a customer forks it and
  # points their hub at THEIR fork, so a hardcoded catalog ref keeps syncing
  # from upstream and the fork's own edits never take effect. Each must resolve
  # from the cluster Secret annotation gitops/repo-url, the same mechanism
  # dashboards.yaml already uses for monitoring/grafana-url.
  #
  # The scope is CATALOG-only, and that is load-bearing — do not widen it:
  # nanohype's PUBLISHED ARTIFACTS are correctly hardcoded, because a vended org
  # CONSUMES them from upstream rather than forking them, exactly like a Helm
  # repo or a container registry. Out of scope on purpose:
  #   - nanohype/eks-agent-platform — the operator's own source/chart repo. A
  #     customer does not fork the product; templating it would point at a fork
  #     that does not exist.
  #   - ghcr.io/nanohype/* images, oci://ghcr.io/nanohype charts.
  #   - the Kyverno keyless-signing subjectRegExp — a signing IDENTITY to verify
  #     against, not a source to sync from.
  #   - everything under applicationsets/opt-in/ — app-of-apps sources
  #     `path: applicationsets` without directory.recurse, so a default install
  #     never applies them; their org-specific URLs are documented in
  #     applicationsets/opt-in/README.md as a repoint-before-enabling step.
  # See the full rationale in scripts/check-hardcoded-org.py.
  #
  # BLOCKING. Every applied ApplicationSet reads its source from
  # `{{ index .metadata.annotations "gitops/repo-url" }}`, which cluster-bootstrap
  # stamps on the ArgoCD cluster Secret. A hardcoded catalog repoURL makes a
  # forked catalog INERT — the fork syncs from the upstream org's repo and edits
  # to it do nothing. Expected count: 0.
  fork-safety:
    name: Fork-safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: No hardcoded catalog repoURL in applied ApplicationSets
        run: ./scripts/check-hardcoded-org.py --blocking

  # ── Helm-render gate ─────────────────────────────────────────────────
  # Every addon is a base values.yaml plus per-env deltas, and nothing templates
  # the chart until an ArgoCD sync. A key the chart does not accept — several
  # upstream charts ship a values.schema.json that rejects unknown keys — renders
  # clean through kustomize and kubeconform and only fails at sync, fleet-wide,
  # after merge. This job templates every addon against its appset-pinned chart
  # version with the committed base + each env's values, so a bad key, a
  # malformed override, or a chart bump that drops a value fails the build
  # instead of the fleet. Chart coordinates are DERIVED from the ApplicationSets —
  # the single source of truth — by scripts/render-addons.py; charts are cached,
  # keyed on the appset pins so a version bump refetches.
  helm-render:
    name: Helm-render addons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Cache Helm charts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/helm
          key: helm-charts-${{ hashFiles('applicationsets/*.yaml') }}
          restore-keys: |
            helm-charts-

      - name: Render every addon across every environment
        run: ./scripts/render-addons.py
      # Tag immutability is a fact about the commit under test, so it blocks
      # here. What the image CONTAINS is a separate question with a separate
      # job — image-vulnerabilities — because it has to pull every image and is
      # slow enough to be worth running in parallel with this one.
      - name: Every rendered image carries an immutable reference
        run: ./scripts/check-image-pins.py

  # ── Image vulnerability gate ─────────────────────────────────────────
  # Whoever moves a chart pin owns what the image behind it carries, and this
  # repo pins independently of any cluster. trivy-operator reports the same
  # findings at runtime, but to an operator who cannot change the pin without a
  # pull request here — so the decision belongs at the pin, which is this job.
  #
  # Blocking on a CRITICAL with a published fix that image-advisories.yaml does
  # not acknowledge. A new advisory can therefore turn a pull request red for a
  # reason the pull request did not cause; that is deliberate and the advisory
  # file is the release valve, because the alternative is a scan whose findings
  # nobody has to answer. HIGH is counted and printed, not gated.
  #
  # The run scans a digest-pinned end-of-life image first and requires its known
  # CRITICALs back. A scanner with no database returns a clean result for every
  # image, which is indistinguishable from a healthy fleet by exit code — so
  # without the canary a green run here would prove nothing at all.
  image-vulnerabilities:
    name: Rendered images carry no unacknowledged CRITICAL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      # Same guard the validate job carries: setup-trivy reads an empty version
      # as "install the latest release", so an expansion failure would scan with
      # an unpinned trivy and pass.
      - name: Assert the pinned trivy version resolved
        run: |
          if [ -z "${{ env.TRIVY_VERSION }}" ]; then
            echo "TRIVY_VERSION expanded empty. setup-trivy reads that as 'latest',"
            echo "so this job would scan with an unpinned trivy and pass. Restore"
            echo "the TRIVY_VERSION key in this workflow's env block."
            exit 1
          fi

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: ${{ env.TRIVY_VERSION }} # zizmor: ignore[unpinned-tools]

      - name: Cache Helm charts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/helm
          key: helm-charts-${{ hashFiles('applicationsets/*.yaml') }}
          restore-keys: |
            helm-charts-

      - name: Every fixed CRITICAL is acknowledged
        run: ./scripts/check-image-vulnerabilities.py

  # ── Policy-admission gate ────────────────────────────────────────────
  # The best-practice / pod-security policies run in Enforce mode on staging and
  # production (the overlays flip validationFailureAction to Enforce), so a
  # workload that violates one is DENIED at admission on a vended cluster. Each
  # such policy carries a hand-maintained namespace exclusion list, and the addon
  # fleet cannot satisfy the policies (upstream charts never carry the org
  # platform.nanohype.dev/* label tier, device plugins and security agents need
  # root/host access, batch jobs have no service-style probes). If an addon lands
  # in a namespace that is NOT excluded, its Deployment/DaemonSet is denied — and
  # every other gate (render, kubeconform, kyverno unit tests) stays green,
  # because the contradiction only exists where the addon MEETS the policy on a
  # real Enforce cluster. This job renders the whole fleet into its real
  # destination namespaces and runs `kyverno apply` against the Enforce overlay,
  # so that class of contradiction fails here instead of at sync. It also asserts
  # all four exclusion lists are identical (their divergence is the same bug
  # class) and exercises the Audit overlay to prove the warn-vs-deny split.
  #
  # The fleet renders alongside a canary: one deliberately non-compliant workload
  # in a namespace on no exclusion list, which every rule must deny (Enforce) and
  # warn (Audit). Without it the run is indistinguishable from one that evaluated
  # nothing — every fleet namespace IS excluded, so Kyverno legitimately matches
  # zero resources and exits 0. The verdict therefore comes from the per-resource
  # policy report, not the exit code, which the canary keeps permanently non-zero.
  # A companion check asserts every namespace the fleet lands a workload in is on
  # the exclusion list, so a new addon in a new namespace is reported as uncovered.
  policy-admission:
    name: Policy-admission gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Install Kyverno CLI
        run: |
          curl -fsSL -o /tmp/kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kyverno.tar.gz kyverno
          sudo install -m 0755 /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Cache Helm charts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/helm
          key: helm-charts-${{ hashFiles('applicationsets/*.yaml') }}
          restore-keys: |
            helm-charts-

      - name: Render the fleet and apply the Enforce-tier policies
        run: ./scripts/check-policy-admission.py

  # ── ApplicationSet gate ──────────────────────────────────────────────
  # The render→scan path gates rendered/ output; it never schema-checks the
  # ApplicationSet generators themselves. This validates every ApplicationSet
  # against its published schema and asserts the documented sync-wave category
  # ordering (bootstrap < networking < security < observability < operations <
  # ai-platform < argo-platform < apps) holds across them — so a malformed
  # generator or a category deployed out of order fails at PR time.
  appsets:
    name: ApplicationSet schema + sync waves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Cache kubeconform + schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/bin/kubeconform
            ~/.cache/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-${{ env.KUBECONFORM_VERSION }}-

      - name: Install kubeconform
        run: |
          if [ ! -x "$HOME/.local/bin/kubeconform" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
            tar -xz -C "$HOME/.local/bin" -f /tmp/kubeconform.tar.gz kubeconform
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ApplicationSet schema gate
        run: |
          mkdir -p "$HOME/.cache/kubeconform"
          KUBECONFORM_SKIP="" KUBECONFORM_CACHE="$HOME/.cache/kubeconform" \
            ./scripts/kubeconform-scan.sh applicationsets/

      - name: Sync-wave ordering gate
        run: ./scripts/check-sync-waves.py

      # An ApplicationSet's spec.template.metadata.labels is a plain string map
      # in the CRD schema, so kubeconform admits any value there. It only
      # becomes a label when the controller renders an Application, and an
      # invalid value fails that Application at admission — which fails the
      # app-of-apps sync task, which stops the entire addon catalog from
      # installing. Valid manifest, passing schema gate, nothing deployed.
      - name: Label-value gate
        run: ./scripts/check-label-values.py

      # Offline half of the chart-provenance gate: every pinned chart has a
      # record and every record a pin. Deliberately does not touch the network —
      # whether a chart went deprecated overnight is not a function of this
      # commit, and gating merges on it would redden pull requests that changed
      # nothing. chart-provenance.yml asks that question on a schedule.
      - name: Chart provenance gate
        run: |
          ./scripts/check-chart-deprecation.py
          ./scripts/check-chart-deprecation.py --self-test

  # ── Appset render gate ───────────────────────────────────────────────
  # The Karpenter EC2NodeClass patch carries if/range control flow inside a
  # `patch: |-` string block. Every other gate treats that string as opaque —
  # the appset schema gate validates its YAML shape, kustomize builds the
  # overlays without ever rendering the per-cluster patch, so a control-flow
  # edit that breaks the render (a bare index that trips missingkey=error, or a
  # dig that panics on the string label map the cluster generator hands back)
  # ships green and only breaks at sync, on every cluster the generator
  # produces. This job renders the committed template the way the ArgoCD
  # ApplicationSet controller does (Go text/template + sprig,
  # Option("missingkey=error")) against fixture create/adopt/legacy cluster
  # Secrets and asserts the subnetSelectorTerms shape for each.
  appset-render:
    name: Appset render (Karpenter subnet selector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: applicationsets/rendertest/go.mod
          cache-dependency-path: applicationsets/rendertest/go.sum

      - name: Render Karpenter patch template against fixture cluster Secrets
        working-directory: applicationsets/rendertest
        run: go test ./...

  # ── Secret scan ──────────────────────────────────────────────────────
  # gitleaks over the working tree. The catalog keeps secrets out by
  # construction (External Secrets + Pod Identity, no static keys in values), but
  # nothing mechanically stops a future commit from pasting a raw credential
  # into a values file — the residual the threat model named
  # (docs/threat-model.md). Run as the pinned binary rather than the marketplace
  # action, which is license-gated for organization accounts.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact -v

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production, hub]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Render manifests
        run: |
          mkdir -p rendered
          echo "Rendering ${{ matrix.environment }} overlays..."
          find . -path "*/overlays/${{ matrix.environment }}/kustomization.yaml" -exec dirname {} \; | while read dir; do
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/$(echo "$dir" | tr '/' '_').yaml" || exit 1
          done
          # Env-agnostic kustomize roots — identical on every cluster (their
          # per-environment values resolve through External Secrets and the
          # cluster generator), so they carry no per-env overlays.
          for dir in dashboards/base addons/bootstrap/secret-stores addons/bootstrap/secret-stores-managed; do
            echo "Rendering $dir ..."
            kustomize build --enable-helm "$dir" > "rendered/$(echo "$dir" | tr '/' '_').yaml" || exit 1
          done
          echo "All ${{ matrix.environment }} manifests rendered successfully."

      # The druid catalog chart is a tenant-workload chart (not wired by a
      # default ApplicationSet). Render it with synthetic tenant values so its
      # templates still pass the same render-assert / schema / misconfiguration
      # gates as every kustomize root.
      - name: Render druid catalog chart
        run: |
          helm template ci catalog/druid/chart -n druid-ci \
            -f catalog/druid/values.yaml \
            --set hostedId=ci \
            --set environment=${{ matrix.environment }} \
            --set secrets.metadata=ci/druid/metadata \
            --set secrets.admin=ci/druid/admin \
            --set secrets.system=ci/druid/system \
            --set secrets.keystore=ci/druid/keystore \
            --set s3.indexLogsBucket=ci-druid-indexlogs \
            --set s3.deepStorageBucket=ci-druid-deepstorage \
            --set s3.msqBucket=ci-druid-msq \
            > rendered/catalog_druid_chart.yaml

      # Source files are gated by the zero-placeholder job; this asserts the
      # RENDERED output too — catching a zero account id, placeholder token, or
      # account-less ARN that only appears after kustomize/helm templating.
      - name: Assert no unfilled sentinels in rendered output
        # Pinned to a commit SHA, not a floating branch: this action runs in the
        # merge path, so a pin keeps a change to nanohype/nanohype from silently
        # altering this gate. nanohype/nanohype publishes no release tags, so the
        # SHA is the immutable ref; Renovate's github-actions manager bumps it.
        uses: nanohype/nanohype/.github/actions/render-assert@d75fb5c26a1745df8e33d1a8c89f6f7de6c37b39 # nanohype/nanohype main
        with:
          manifests: rendered
          exclude: ''

      # ── Schema gate ────────────────────────────────────────────────────
      # kubeconform in strict mode over everything just rendered, via the shared
      # scripts/kubeconform-scan.sh — the SINGLE source of truth for the strict
      # invocation and its skip list, so `task scan` (local) and this job never
      # disagree. Native kinds resolve from the default kubernetes-json-schema
      # location; CRD kinds resolve from the datreeio CRDs-catalog; there is
      # deliberately no -ignore-missing-schemas. The skip list (the external
      # Grafana CR and the first-party platform CRDs, validated out-of-band
      # against the real webhook) and its full rationale live in that script.
      #
      # The binary and downloaded schemas are cached; restore-keys lets each run
      # reuse the newest cache while still persisting newly fetched schemas.
      - name: Cache kubeconform + schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/bin/kubeconform
            ~/.cache/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ github.run_id }}
          restore-keys: |
            kubeconform-${{ env.KUBECONFORM_VERSION }}-

      - name: Install kubeconform
        run: |
          if [ ! -x "$HOME/.local/bin/kubeconform" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
            tar -xz -C "$HOME/.local/bin" -f /tmp/kubeconform.tar.gz kubeconform
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Schema gate (kubeconform)
        run: |
          mkdir -p "$HOME/.cache/kubeconform"
          KUBECONFORM_CACHE="$HOME/.cache/kubeconform" ./scripts/kubeconform-scan.sh rendered

      # ── Misconfiguration gate ──────────────────────────────────────────
      # trivy config over the rendered manifests — not the repo tree — so
      # every check sees the post-templating truth with helm values applied.
      # MEDIUM and above hard-fails; .trivyignore.yaml carries the scoped,
      # justified exceptions (device-plugin root/hostPath, druid's
      # k8s-extensions Role, env-indirected config keys).
      # setup-trivy treats an empty `version` as "install the latest release"
      # rather than as an error, so an env key that is renamed or removed does
      # not fail this step — it silently installs a different scanner than the
      # one this workflow pins, and the job still reports a clean scan. Empty is
      # a valid instruction to the receiver, which is the case no workflow linter
      # models: the YAML, the shell and the expression are all well-formed.
      #
      # Asserted with a shell conditional rather than a tool, so no missing
      # binary can delete the assertion.
      - name: Assert the pinned trivy version resolved
        run: |
          if [ -z "${{ env.TRIVY_VERSION }}" ]; then
            echo "TRIVY_VERSION expanded empty. setup-trivy reads that as 'latest',"
            echo "so this job would scan with an unpinned trivy and pass. Restore"
            echo "the TRIVY_VERSION key in this workflow's env block."
            exit 1
          fi

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # TRIVY_VERSION is a literal in this workflow's env block, carrying a
          # `# renovate:` annotation and asserted by the renovate-coverage gate.
          # zizmor cannot follow the env indirection and reads any expansion here
          # as unpinned; the pin it looks for is one level up.
          version: ${{ env.TRIVY_VERSION }} # zizmor: ignore[unpinned-tools]
          cache: true

      - name: Misconfiguration gate (trivy config)
        run: |
          trivy config --exit-code 1 \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            rendered

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs:
      [
        placeholders,
        lint,
        dashboards,
        kyverno,
        fork-safety,
        helm-render,
        image-vulnerabilities,
        policy-admission,
        appsets,
        appset-render,
        secrets,
        validate,
        renovate-coverage,
        log-volume-budget,
        falco-rule-floor,
        python-lint,
        policy-validity,
        gate-tests,
        serviceaccount-bindings,
        platform-crs,
        catalog-revision,
      ]
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const icon = r => r === 'success' ? ':white_check_mark:'
              : r === 'skipped' ? ':fast_forward:' : ':x:';
            const results = {
              'Zero-placeholder gate': '${{ needs.placeholders.result }}',
              'YAML Lint': '${{ needs.lint.result }}',
              'Dashboard gate (live grafana.com ids + AMG-saveable)': '${{ needs.dashboards.result }}',
              'Kyverno policy tests (+ verify-images contract)': '${{ needs.kyverno.result }}',
              'Fork-safety gate (no hardcoded org, blocking)': '${{ needs.fork-safety.result }}',
              'Helm-render (every addon × every env)': '${{ needs.helm-render.result }}',
              'Rendered images carry no unacknowledged CRITICAL': '${{ needs.image-vulnerabilities.result }}',
              'Policy-admission (Enforce-tier Kyverno vs the fleet)': '${{ needs.policy-admission.result }}',
              'ApplicationSet schema + sync waves': '${{ needs.appsets.result }}',
              'Appset render (Karpenter subnet selector)': '${{ needs.appset-render.result }}',
              'Secret scan (gitleaks)': '${{ needs.secrets.result }}',
              'Render + assert + schema + misconfig (all environments)': '${{ needs.validate.result }}',
              'Renovate manager coverage': '${{ needs.renovate-coverage.result }}',
              'Loki volume warns before cutoff': '${{ needs.log-volume-budget.result }}',
              'Falco loads every rule set it installs': '${{ needs.falco-rule-floor.result }}',
              'Gate scripts lint and typecheck': '${{ needs.python-lint.result }}',
              'Policy validity (kustomize + kyverno)': '${{ needs.policy-validity.result }}',
              'The gates themselves are tested': '${{ needs.gate-tests.result }}',
              'Pods name ServiceAccounts that exist': '${{ needs.serviceaccount-bindings.result }}',
              'Catalog CRs admissible against the operator chart': '${{ needs.platform-crs.result }}',
              'Catalog source reads its revision': '${{ needs.catalog-revision.result }}',
            };
            const rows = Object.entries(results)
              .map(([check, r]) => `| ${check} | ${icon(r)} ${r} |`)
              .join('\n');
            const passed = Object.values(results).every(r => r === 'success' || r === 'skipped');

            const body = `## CI Results

            | Check | Status |
            |-------|--------|
            ${rows}

            ${passed ? 'All checks passed.' : 'One or more checks failed — see the job logs.'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        placeholders,
        renovate-coverage,
        log-volume-budget,
        falco-rule-floor,
        python-lint,
        policy-validity,
        gate-tests,
        lint,
        dashboards,
        serviceaccount-bindings,
        platform-crs,
        catalog-revision,
        kyverno,
        fork-safety,
        helm-render,
        image-vulnerabilities,
        policy-admission,
        appsets,
        appset-render,
        secrets,
        validate,
        pr-summary,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
