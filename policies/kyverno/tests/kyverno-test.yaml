# Unit tests for the Kyverno policies in this repo. Run with:
#   kyverno test policies/kyverno/tests
# Each rule is proven to PASS a compliant resource and FAIL a violating one, so
# a regression that weakens (or silently no-ops) a policy is caught in CI.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nanohype-kyverno-policies
policies:
  - ../best-practices/base/require-labels.yaml
  - ../best-practices/base/require-probes.yaml
  - ../pod-security-standards/base/require-non-root.yaml
  - ../pod-security-standards/base/require-resource-limits.yaml
  - ../supply-chain/base/verify-images.yaml
resources:
  - resources.yaml
results:
  # require-labels — the full required tier (name + managed-by + component +
  # environment + team). good-deploy carries all five; bad-deploy carries none;
  # bad-deploy-missing-tier carries name but omits team, so it proves the tier is
  # enforced, not just the app.kubernetes.io/name label.
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [good-deploy]
    result: pass
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [bad-deploy]
    result: fail
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [bad-deploy-missing-tier]
    result: fail

  # require-probes
  - policy: require-probes
    rule: require-readiness-probe
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-probes
    rule: require-liveness-probe
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-probes
    rule: require-readiness-probe
    kind: Pod
    resources: [bad-pod-no-probes]
    result: fail
  - policy: require-probes
    rule: require-liveness-probe
    kind: Pod
    resources: [bad-pod-no-probes]
    result: fail

  # require-run-as-non-root
  - policy: require-run-as-non-root
    rule: run-as-non-root
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-run-as-non-root
    rule: run-as-non-root
    kind: Pod
    resources: [bad-pod-root]
    result: fail

  # require-resource-limits
  - policy: require-resource-limits
    rule: require-cpu-limit
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-resource-limits
    rule: require-memory-limit
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-resource-limits
    rule: require-cpu-limit
    kind: Pod
    resources: [bad-pod-no-limits]
    result: fail
  - policy: require-resource-limits
    rule: require-memory-limit
    kind: Pod
    resources: [bad-pod-no-limits]
    result: fail

  # verify-images — an ImageValidatingPolicy, evaluated against the registry and
  # Rekor, so this suite needs the network. Results carry the policy name as the
  # rule. The CLI runs the validating path only, which is why every matched
  # fixture is pinned by digest (see resources.yaml) and why the digest rewrite
  # admission performs is asserted against a real API server by
  # scripts/check-digest-rewrite.sh rather than here.
  #
  # Kyverno verifies cosign's legacy .sig/.att format and a Sigstore bundle on
  # separate paths, and resources.yaml says which fixture carries which. The
  # legacy path is proven both ways, a release signature admitted and a branch
  # signature refused; the bundle path is proven to admit an operator and an
  # eval-runner release. No row refuses a signer on the bundle path: vi-tag-only
  # is bundle-signed and is refused for its missing digest.
  #
  # A pod whose namespace the policy excludes produces no result at all, and the
  # CLI reports an expectation with no result as a failure, so the namespace
  # exclusion is asserted by scripts/check-image-verification.py instead.
  - policy: verify-images
    isImageValidatingPolicy: true
    kind: Pod
    resources: [vi-external-image, vi-signed, vi-signed-with-sidecar,
                vi-bundle-signed-operator, vi-bundle-signed-eval-runner]
    result: pass
  - policy: verify-images
    isImageValidatingPolicy: true
    kind: Pod
    resources: [vi-tag-only, vi-branch-signed, vi-branch-signed-init]
    result: fail
