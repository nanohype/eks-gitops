# Unit tests for the Kyverno policies in this repo. Run with:
#   kyverno test policies/kyverno/tests
# Each rule is proven to PASS a compliant resource and FAIL a violating one, so
# a regression that weakens (or silently no-ops) a policy is caught in CI.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nanohype-kyverno-policies
policies:
  - ../best-practices/base/require-labels.yaml
  - ../best-practices/base/require-probes.yaml
  - ../pod-security-standards/base/require-non-root.yaml
  - ../pod-security-standards/base/require-resource-limits.yaml
  - ../supply-chain/base/verify-images.yaml
resources:
  - resources.yaml
results:
  # require-labels — the full required tier (name + managed-by + component +
  # environment + team). good-deploy carries all five; bad-deploy carries none;
  # bad-deploy-missing-tier carries name but omits team, so it proves the tier is
  # enforced, not just the app.kubernetes.io/name label.
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [good-deploy]
    result: pass
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [bad-deploy]
    result: fail
  - policy: require-labels
    rule: require-standard-labels
    kind: Deployment
    resources: [bad-deploy-missing-tier]
    result: fail

  # require-probes
  - policy: require-probes
    rule: require-readiness-probe
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-probes
    rule: require-liveness-probe
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-probes
    rule: require-readiness-probe
    kind: Pod
    resources: [bad-pod-no-probes]
    result: fail
  - policy: require-probes
    rule: require-liveness-probe
    kind: Pod
    resources: [bad-pod-no-probes]
    result: fail

  # require-run-as-non-root
  - policy: require-run-as-non-root
    rule: run-as-non-root
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-run-as-non-root
    rule: run-as-non-root
    kind: Pod
    resources: [bad-pod-root]
    result: fail

  # require-resource-limits
  - policy: require-resource-limits
    rule: require-cpu-limit
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-resource-limits
    rule: require-memory-limit
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-resource-limits
    rule: require-cpu-limit
    kind: Pod
    resources: [bad-pod-no-limits]
    result: fail
  - policy: require-resource-limits
    rule: require-memory-limit
    kind: Pod
    resources: [bad-pod-no-limits]
    result: fail

  # verify-images — SCOPING ONLY. `kyverno test` cannot reach Fulcio/Rekor, so it
  # never actually verifies a Cosign signature (a matched image reports Pass/Ok
  # regardless of the attestor). These cases therefore pin the MATCH/EXCLUDE
  # scoping, which IS deterministic offline: a non-nanohype image and a pod in an
  # excluded namespace are skipped (Pass/Excluded, no verification attempted).
  # Widening imageReferences to "*" flips vi-external-image to fail; dropping the
  # namespace exclude flips vi-excluded-ns to fail — both verified against
  # mutations. The signing-IDENTITY contract (required signature, issuer, anchored
  # org-scoped subjectRegExp) is what kyverno test is blind to; it is guarded
  # structurally by scripts/check-image-verification.py in CI.
  - policy: verify-images
    rule: verify-ghcr-nanohype
    kind: Pod
    resources: [vi-external-image]
    result: pass
  - policy: verify-images
    rule: verify-ghcr-nanohype
    kind: Pod
    resources: [vi-excluded-ns]
    result: pass
