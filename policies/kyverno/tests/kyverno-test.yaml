# Unit tests for the Kyverno policies in this repo. Run with:
#   kyverno test policies/kyverno/tests
# Each policy is proven to PASS a compliant resource and FAIL a violating one, so
# a regression that weakens (or silently no-ops) a policy is caught in CI.
#
# Every validation policy is a ValidatingPolicy holding ONE validation. A
# ValidatingPolicy reports a single result per resource, carrying the index of
# the first validation that failed and nothing about the rest, so a policy with
# two validations could never be shown to fail on its second — the readiness and
# liveness checks, and the cpu and memory limits, are separate policies for that
# reason. Results carry no rule name.
#
# The UPDATE rows proving an existing violation is grandfathered live in
# existing-violations/, a test of their own: an explicit operation re-runs every
# policy in the test under it, which here would verify every image twice.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nanohype-kyverno-policies
policies:
  - ../best-practices/base/require-labels.yaml
  - ../best-practices/base/require-readiness-probe.yaml
  - ../best-practices/base/require-liveness-probe.yaml
  - ../pod-security-standards/base/require-non-root.yaml
  - ../pod-security-standards/base/require-cpu-limit.yaml
  - ../pod-security-standards/base/require-memory-limit.yaml
  - ../supply-chain/base/verify-images.yaml
resources:
  - resources.yaml
results:
  # require-labels — the full required tier (name + managed-by + component +
  # environment + team). good-deploy carries all five; bad-deploy carries none;
  # bad-deploy-missing-tier carries name but omits team, so it proves the tier is
  # enforced, not just the app.kubernetes.io/name label.
  - policy: require-labels
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy, good-deploy-probes]
    result: pass
  - policy: require-labels
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy, bad-deploy-missing-tier]
    result: fail

  # require-readiness-probe / require-liveness-probe — controllers, never Pods.
  # Each bad fixture lacks exactly one probe, so it passes the other policy.
  - policy: require-readiness-probe
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy-probes, bad-deploy-no-liveness]
    result: pass
  - policy: require-readiness-probe
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy-no-readiness]
    result: fail
  - policy: require-liveness-probe
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy-probes, bad-deploy-no-readiness]
    result: pass
  - policy: require-liveness-probe
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy-no-liveness]
    result: fail

  # require-run-as-non-root — the Pod rule, then its autogen Deployment variant.
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    kind: Pod
    resources: [good-pod]
    result: pass
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-pod-root]
    result: fail
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy-probes]
    result: pass
  - policy: require-run-as-non-root
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy-pod-security]
    result: fail

  # require-cpu-limit / require-memory-limit — each bad fixture lacks exactly one
  # limit, so it passes the other policy; bad-pod-no-limits fails both.
  - policy: require-cpu-limit
    isValidatingPolicy: true
    kind: Pod
    resources: [good-pod, bad-pod-no-memory-limit]
    result: pass
  - policy: require-cpu-limit
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-pod-no-limits, bad-pod-no-cpu-limit]
    result: fail
  - policy: require-memory-limit
    isValidatingPolicy: true
    kind: Pod
    resources: [good-pod, bad-pod-no-cpu-limit]
    result: pass
  - policy: require-memory-limit
    isValidatingPolicy: true
    kind: Pod
    resources: [bad-pod-no-limits, bad-pod-no-memory-limit]
    result: fail
  - policy: require-cpu-limit
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy-probes]
    result: pass
  - policy: require-cpu-limit
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy-pod-security]
    result: fail
  - policy: require-memory-limit
    isValidatingPolicy: true
    kind: Deployment
    resources: [good-deploy-probes]
    result: pass
  - policy: require-memory-limit
    isValidatingPolicy: true
    kind: Deployment
    resources: [bad-deploy-pod-security]
    result: fail

  # verify-images — an ImageValidatingPolicy, evaluated against the registry and
  # Rekor, so this suite needs the network. Results carry the policy name as the
  # rule. The CLI runs the validating path only, which is why every matched
  # fixture is pinned by digest (see resources.yaml) and why the digest rewrite
  # admission performs is asserted against a real API server by
  # scripts/check-digest-rewrite.sh rather than here.
  #
  # Kyverno verifies cosign's legacy .sig/.att format and a Sigstore bundle on
  # separate paths, and resources.yaml says which fixture carries which. The
  # legacy path is proven both ways, a release signature admitted and a branch
  # signature refused; the bundle path is proven to admit an operator and an
  # eval-runner release. No row refuses a signer on the bundle path: vi-tag-only
  # is bundle-signed and is refused for its missing digest.
  #
  # A pod whose namespace the policy excludes produces no result at all, and the
  # CLI reports an expectation with no result as a failure, so the namespace
  # exclusion is asserted by scripts/check-image-verification.py instead.
  - policy: verify-images
    isImageValidatingPolicy: true
    kind: Pod
    resources: [vi-external-image, vi-signed, vi-signed-with-sidecar,
                vi-bundle-signed-operator, vi-bundle-signed-eval-runner]
    result: pass
  - policy: verify-images
    isImageValidatingPolicy: true
    kind: Pod
    resources: [vi-tag-only, vi-branch-signed, vi-branch-signed-init]
    result: fail
