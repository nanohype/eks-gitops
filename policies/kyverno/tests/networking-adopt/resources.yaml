# Fixtures for the adopt-mode subnet-injection cases. All Ingress/Service objects
# live in a workload namespace (the policy matches every namespace). The
# network-config ConfigMap state is supplied to the CLI as context via values.yaml.
---
# Plain Ingress, no scheme annotation → the controller's default → private subnets.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-plain
  namespace: workloads
spec:
  rules:
    - host: a.example.com
---
# Ingress explicitly internet-facing → public subnets.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-internet
  namespace: workloads
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
    - host: b.example.com
---
# Ingress that already pins its own subnets → the add-if-absent anchor must leave
# it untouched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-explicit
  namespace: workloads
  annotations:
    alb.ingress.kubernetes.io/subnets: subnet-tenant-1,subnet-tenant-2
spec:
  rules:
    - host: c.example.com
---
# Ingress in a group. One load balancer serves every member and its scheme is
# decided across all of them, so this object does not carry the answer even
# though it looks like it does — no injection.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-grouped
  namespace: workloads
  annotations:
    alb.ingress.kubernetes.io/group.name: shared
spec:
  rules:
    - host: d.example.com
---
# Plain LoadBalancer Service: no loadBalancerClass, no aws-load-balancer-type.
# The AWS Load Balancer Controller does not claim it, the in-tree cloud provider
# builds a Classic Load Balancer, and neither the scheme nor the subnets
# annotation is read — so injecting one would be writing to nobody.
apiVersion: v1
kind: Service
metadata:
  name: svc-plain
  namespace: workloads
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
# Claimed by loadBalancerClass, no scheme stated → default → private subnets.
apiVersion: v1
kind: Service
metadata:
  name: svc-nlb-class
  namespace: workloads
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  ports:
    - port: 80
---
# Claimed by the type annotation plus an instance target type → private subnets.
apiVersion: v1
kind: Service
metadata:
  name: svc-external-instance
  namespace: workloads
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
# Claimed by the nlb-ip type annotation, explicitly internet-facing → public.
apiVersion: v1
kind: Service
metadata:
  name: svc-internet
  namespace: workloads
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
# The legacy spelling with no scheme annotation. "false" means internet-facing to
# the controller, so this Service needs the PUBLIC subnets. Reading only the
# scheme annotation makes it look like a default-internal Service and hands it
# the private CSV for a load balancer the controller puts on public subnets.
apiVersion: v1
kind: Service
metadata:
  name: svc-legacy-internal-false
  namespace: workloads
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
# The same legacy spelling saying internal → private subnets.
apiVersion: v1
kind: Service
metadata:
  name: svc-legacy-internal-true
  namespace: workloads
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  ports:
    - port: 80
---
# Both spellings, disagreeing. The scheme annotation is read first and the legacy
# flag is not consulted, so this is internal and takes the private subnets.
apiVersion: v1
kind: Service
metadata:
  name: svc-scheme-beats-legacy
  namespace: workloads
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  ports:
    - port: 80
---
# A ClusterIP Service is not a load balancer → the spec.type precondition skips it,
# proving the mutation does not touch non-LoadBalancer Services.
apiVersion: v1
kind: Service
metadata:
  name: svc-clusterip
  namespace: workloads
spec:
  type: ClusterIP
  ports:
    - port: 80
