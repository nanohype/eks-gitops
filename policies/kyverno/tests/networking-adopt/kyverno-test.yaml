# Adopt-mode cases for inject-adopt-lb-subnets. Run (with every other test in this
# tree) by `kyverno test policies/kyverno/tests`. The kube-system/network-config
# ConfigMap state is supplied via values.yaml.
#
# The matrix is the AWS Load Balancer Controller's own decision procedure: first
# whether the object is one it provisions a load balancer for, then which scheme
# it will compute for it.
#
#   Ingress
#     (a) plain                     → private-subnet CSV (the controller's default)
#     (b) internet-facing           → public-subnet CSV
#     (c) already pins subnets      → untouched
#     (d) member of a group         → untouched, the scheme belongs to the group
#   Service the controller claims
#     (e) by loadBalancerClass      → private
#     (f) by type=external + target → private
#     (g) by type=nlb-ip, scheme set → public
#     (h) legacy -internal: "false" → PUBLIC, with no scheme annotation present
#     (i) legacy -internal: "true"  → private
#     (j) both spellings disagreeing → private, the scheme annotation wins
#   Service the controller does not claim
#     (k) plain type=LoadBalancer   → untouched, the in-tree provider's Classic LB
#     (l) ClusterIP                 → untouched
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: inject-adopt-lb-subnets-adopt
policies:
  - ../../networking/base/inject-adopt-lb-subnets.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: inject-adopt-lb-subnets
    rule: ingress-internal-subnets
    kind: Ingress
    resources: [ing-plain]
    patchedResources: patched/ing-plain.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: ingress-internet-facing-subnets
    kind: Ingress
    resources: [ing-internet]
    patchedResources: patched/ing-internet.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: ingress-internal-subnets
    kind: Ingress
    resources: [ing-explicit]
    result: skip
  - policy: inject-adopt-lb-subnets
    rule: ingress-internal-subnets
    kind: Ingress
    resources: [ing-grouped]
    result: skip
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-nlb-class]
    patchedResources: patched/svc-nlb-class.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-external-instance]
    patchedResources: patched/svc-external-instance.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internet-facing-subnets
    kind: Service
    resources: [svc-internet]
    patchedResources: patched/svc-internet.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internet-facing-subnets
    kind: Service
    resources: [svc-legacy-internal-false]
    patchedResources: patched/svc-legacy-internal-false.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-legacy-internal-true]
    patchedResources: patched/svc-legacy-internal-true.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-scheme-beats-legacy]
    patchedResources: patched/svc-scheme-beats-legacy.yaml
    result: pass
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-plain]
    result: skip
  - policy: inject-adopt-lb-subnets
    rule: service-internal-subnets
    kind: Service
    resources: [svc-clusterip]
    result: skip
