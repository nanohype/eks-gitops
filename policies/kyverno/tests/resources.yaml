# Fixtures for the Kyverno policy unit tests. All live in a non-excluded
# namespace (workloads) so the policies actually evaluate them. Each "bad-*"
# resource violates exactly one policy and stays compliant with the others, so
# a failure points at a single rule.
---
# Compliant Deployment: carries the full required label tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: api
    platform.nanohype.dev/environment: development
    platform.nanohype.dev/team: platform-engineering
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Violates require-labels: no required labels at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy
  namespace: workloads
  labels:
    app: example
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Violates require-labels via the EXTENDED tier only: it carries
# app.kubernetes.io/name (a name-only check would pass it) but is
# missing platform.nanohype.dev/team, so it fails once the tier is enforced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy-missing-tier
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: api
    platform.nanohype.dev/environment: development
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Compliant Pod: non-root, both probes, cpu + memory limits.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-probes only: no readiness/liveness probes.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-probes
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-run-as-non-root only: no runAsNonRoot.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-root
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-resource-limits only: no cpu/memory limits.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-limits
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
---
# verify-images fixtures. Every nanohype reference is pinned by digest: the CLI
# runs the validating path only, never the digest mutation admission runs first,
# so a tag reaching verifyDigest fails here the way it would at the validating
# webhook (vi-tag-only). Each release-signed digest is a release of an
# eks-agent-platform image, signed and SPDX-attested by release.yaml on a tag;
# the branch-signed digest is a fab build signed by ci.yml on refs/heads/main, a
# real org signature from a workflow the policy does not trust.
#
# cosign records a signature in one of two formats, and Kyverno verifies each
# on its own path: a Sigstore bundle attached as an OCI referrer when the image
# carries one, and the legacy sha256-<digest>.sig and .att tags only when it
# carries none (`cosign tree <image>` lists which an image has).
#
#   legacy  operator@sha256:06a46523… (vi-signed, vi-signed-with-sidecar, the
#           app container of vi-branch-signed-init) and fab@sha256:9e415943…
#           (vi-branch-signed, the init container of vi-branch-signed-init)
#   bundle  operator@sha256:1e7d4ce9… (vi-bundle-signed-operator), the same
#           image by its tag operator:0.7.0 (vi-tag-only), and
#           eval-runner@sha256:674c0120… (vi-bundle-signed-eval-runner)
#
# The identity refusals, vi-branch-signed and vi-branch-signed-init, are
# decided on the legacy path. vi-tag-only names the bundle-signed operator
# release by tag, and verifyDigest refuses it for the missing digest rather
# than for its signer. No row shows the bundle path refusing a signer: that
# takes a bundle signed by a workflow the policy does not trust.
#
# An operator chart bump must move the bundle fixtures, vi-tag-only, the
# operator tag in supply-chain-digest/pod.yaml and deployment.yaml, and the
# eval-runner tag in scripts/check-policy-admission.py to the operator and
# eval-runner images the chart renders. `scripts/check-image-pins.py --list`
# prints each rendered image beside the charts that render it.
# scripts/tests/test_image_verification.py holds those fixtures to one another,
# each tag naming a release a bundle fixture is recorded under and each such
# release named by a tag, so a bump that moves some of them fails there. Nothing
# holds them to the chart pin itself.
#
# A non-nanohype image is outside matchImageReferences (ghcr.io/nanohype/*), so
# nothing is verified and the pod passes. Widening the glob to "*" makes this
# image subject to verification and flips it to fail.
apiVersion: v1
kind: Pod
metadata:
  name: vi-external-image
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
# A release-signed, SBOM-attested nanohype image in the legacy format, pinned by
# digest.
apiVersion: v1
kind: Pod
metadata:
  name: vi-signed
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
---
# The same image beside a third-party sidecar. The sidecar is outside
# matchImageReferences and never reaches the validations, so it cannot fail them.
apiVersion: v1
kind: Pod
metadata:
  name: vi-signed-with-sidecar
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
    - name: sidecar
      image: registry.k8s.io/pause:3.10
---
# An operator release signed and SPDX-attested as Sigstore bundles, pinned by
# digest.
apiVersion: v1
kind: Pod
metadata:
  name: vi-bundle-signed-operator
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:1e7d4ce9edbf602edc8cf72ca8dbff278b241122b56139a77f67eabe474d93ee
---
# An eval-runner release in the same bundle format. The operator chart's
# WorkflowTemplate runs eval-runner in step pods in the eval-runner namespace,
# which the policy does not exclude, so each step's eval-runner container is
# verified at admission.
apiVersion: v1
kind: Pod
metadata:
  name: vi-bundle-signed-eval-runner
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/eval-runner@sha256:674c0120c381c9b7ab01289e1ed875607864e976d3407734f9eb5be2e65b37dd
---
# A signed image named by tag. verifyDigest refuses an image that reaches
# validation without a digest, which at admission means the pin did not happen.
apiVersion: v1
kind: Pod
metadata:
  name: vi-tag-only
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.7.0
---
# Signed by the org, from ci.yml on a branch push. The subject regex admits only
# release.ya?ml on refs/tags, so this fails the signature validation.
apiVersion: v1
kind: Pod
metadata:
  name: vi-branch-signed
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/fab@sha256:9e415943a62573af33d4f4b85ad19700280679063de720ff59780844cb1b7c77
---
# A release-signed main container behind a branch-signed init container. Two
# fields fail it independently: the validations cover every container field,
# and `required: true` refuses a matched image no validation verified. The pod
# passes only when both are gone; scripts/check-image-verification.py asserts
# each one on its own.
apiVersion: v1
kind: Pod
metadata:
  name: vi-branch-signed-init
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: ghcr.io/nanohype/fab@sha256:9e415943a62573af33d4f4b85ad19700280679063de720ff59780844cb1b7c77
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
