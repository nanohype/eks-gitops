# Fixtures for the Kyverno policy unit tests. All live in a non-excluded
# namespace (workloads) so the policies actually evaluate them. Each "bad-*"
# resource violates exactly one policy and stays compliant with the others, so
# a failure points at a single rule.
---
# Compliant Deployment: carries the full required label tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: api
    platform.nanohype.dev/environment: development
    platform.nanohype.dev/team: platform-engineering
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Violates require-labels: no required labels at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy
  namespace: workloads
  labels:
    app: example
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Violates require-labels via the EXTENDED tier only: it carries
# app.kubernetes.io/name (a name-only check would pass it) but is
# missing platform.nanohype.dev/team, so it fails once the tier is enforced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deploy-missing-tier
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: api
    platform.nanohype.dev/environment: development
spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
---
# Compliant Pod: non-root, both probes, cpu + memory limits.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-probes only: no readiness/liveness probes.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-probes
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-run-as-non-root only: no runAsNonRoot.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-root
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
---
# Violates require-resource-limits only: no cpu/memory limits.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-no-limits
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
---
# verify-images fixtures. Every nanohype reference is pinned by digest: the CLI
# runs the validating path only, never the digest mutation admission runs first,
# so a tag reaching verifyDigest fails here the way it would at the validating
# webhook (vi-tag-only). The signed digest is a release of the operator, signed
# and SPDX-attested by release.yaml on a tag; the branch-signed digest is a fab
# build signed by ci.yml on refs/heads/main, a real org signature from a
# workflow the policy does not trust.
#
# A non-nanohype image is outside matchImageReferences (ghcr.io/nanohype/*), so
# nothing is verified and the pod passes. Widening the glob to "*" makes this
# image subject to verification and flips it to fail.
apiVersion: v1
kind: Pod
metadata:
  name: vi-external-image
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
---
# A release-signed, SBOM-attested nanohype image, pinned by digest.
apiVersion: v1
kind: Pod
metadata:
  name: vi-signed
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
---
# The same image beside a third-party sidecar. The sidecar is outside
# matchImageReferences and never reaches the validations, so it cannot fail them.
apiVersion: v1
kind: Pod
metadata:
  name: vi-signed-with-sidecar
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
    - name: sidecar
      image: registry.k8s.io/pause:3.10
---
# A signed image named by tag. verifyDigest refuses an image that reaches
# validation without a digest, which at admission means the pin did not happen.
apiVersion: v1
kind: Pod
metadata:
  name: vi-tag-only
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.6.1
---
# Signed by the org, from ci.yml on a branch push. The subject regex admits only
# release.ya?ml on refs/tags, so this fails the signature validation.
apiVersion: v1
kind: Pod
metadata:
  name: vi-branch-signed
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/nanohype/fab@sha256:9e415943a62573af33d4f4b85ad19700280679063de720ff59780844cb1b7c77
---
# A release-signed main container behind a branch-signed init container. Two
# fields fail it independently: the validations cover every container field,
# and `required: true` refuses a matched image no validation verified. The pod
# passes only when both are gone; scripts/check-image-verification.py asserts
# each one on its own.
apiVersion: v1
kind: Pod
metadata:
  name: vi-branch-signed-init
  namespace: workloads
  labels:
    app.kubernetes.io/name: example
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: ghcr.io/nanohype/fab@sha256:9e415943a62573af33d4f4b85ad19700280679063de720ff59780844cb1b7c77
  containers:
    - name: app
      image: ghcr.io/nanohype/eks-agent-platform/operator@sha256:06a465237e0caeb3fecfd46ae7cd143c7dc27b7164143bb8fde7127081392549
