# A pod no enforcing tier admits: a nanohype image signed by the org, but from
# ci.yml on a branch push rather than a release workflow on a tag. A real
# signature from a workflow the policy does not trust, so the denial is the
# identity check deciding, not a missing signature or an unreachable registry.
# The signature is in cosign's legacy .sig/.att format, so this refusal is
# decided on Kyverno's legacy verification path while the release fixture is
# admitted on its bundle path.
#
# Pinned by digest so the subject on the signature is fixed: a tag could later
# name a release-signed build and turn this into a pod every tier admits.
apiVersion: v1
kind: Pod
metadata:
  name: branch-signed
  namespace: eks-agent-platform
spec:
  containers:
    - name: manager
      image: ghcr.io/nanohype/fab@sha256:9e415943a62573af33d4f4b85ad19700280679063de720ff59780844cb1b7c77
