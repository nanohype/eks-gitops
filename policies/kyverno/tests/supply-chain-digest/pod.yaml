# A pod every tier admits, written the way the catalog writes one: a TAG.
#
# The tag is what makes this fixture mean something. A digest-pinned reference
# needs no rewrite, so the assertion would hold over a policy with mutateDigest
# turned off — which is the state this suite exists to detect.
#
# The image is the operator release the pinned operator chart renders, and
# moves with that chart. release.yaml keyless-signs and SPDX-attests it on a tag
# as Sigstore bundles, so admission verifies it on the path the deployed
# operator takes, and the admitted spec shows what the mutation wrote. The same
# tag runs as an init container too: the mutation pins every container field,
# and this is where the init field's pin is observed.
apiVersion: v1
kind: Pod
metadata:
  name: signed-operator
  namespace: eks-agent-platform
spec:
  initContainers:
    - name: init
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.6.2
  containers:
    - name: manager
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.6.2
