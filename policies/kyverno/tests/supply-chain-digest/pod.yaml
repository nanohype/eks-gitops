# A pod every tier admits, written the way the catalog writes one: a TAG.
#
# The tag is what makes this fixture mean something. A digest-pinned reference
# needs no rewrite, so the assertion would hold over a policy with mutateDigest
# turned off — which is the state this suite exists to detect.
#
# The image is an operator release, keyless-signed and SPDX-attested by
# release.yaml on a tag as Sigstore bundles, so admission verifies it on
# Kyverno's bundle path and the admitted spec shows what the mutation wrote. An
# operator chart bump must move this tag, and deployment.yaml's, to the operator
# image the chart renders, so the gate verifies the format the deployed
# operator is signed in. The same tag runs as an init container too: the
# mutation pins every container field, and this is where the init field's pin
# is observed.
apiVersion: v1
kind: Pod
metadata:
  name: signed-operator
  namespace: eks-agent-platform
spec:
  initContainers:
    - name: init
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.7.0
  containers:
    - name: manager
      image: ghcr.io/nanohype/eks-agent-platform/operator:0.7.0
