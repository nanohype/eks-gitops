apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/description: >-
      Workloads must carry the org resource-tagging standard's required
      Kubernetes label tier for identification, ownership, and cost/observability
      rollups: app.kubernetes.io/name plus the required-by-surface set
      (app.kubernetes.io/managed-by, app.kubernetes.io/component,
      platform.nanohype.dev/environment, platform.nanohype.dev/team).
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-standard-labels
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      exclude:
        any:
          - resources:
              # Platform-managed namespaces — control plane, addons, and system
              # infrastructure. These best-practice / pod-security policies govern
              # TENANT workloads. The addon fleet cannot satisfy them and should
              # not have to: upstream charts never carry the org
              # platform.nanohype.dev/* label tier, device plugins and security
              # agents need root / host access, and batch jobs have no
              # service-style probes. All four policies (require-labels,
              # require-probes, require-run-as-non-root, require-resource-limits)
              # exclude the SAME set so the lists cannot silently drift apart —
              # scripts/check-policy-admission.py asserts that equality AND renders
              # the whole fleet through these policies in Enforce mode, so an addon
              # landing in a non-excluded namespace fails CI instead of being
              # denied at admission on a vended enforce-tier cluster.
              namespaces:
                # Kubernetes + Argo control plane
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                # bootstrap / networking / security infrastructure
                - cert-manager
                - external-secrets
                - external-dns
                - reloader
                - kyverno
                - trivy-system
                - falco
                # observability
                - monitoring
                - grafana-operator
                - opencost
                - amazon-cloudwatch
                # operations
                - velero
                - goldilocks
                - vpa
                - keda
                - descheduler
                # argo platform
                - argo-rollouts
                - argo-events
                - argo-workflows
                # ai platform
                - envoy-gateway-system
                - eks-agent-platform
                # accelerators — device plugins need privileged host access
                - gpu-operator
                - nvidia-dra-driver
      validate:
        allowExistingViolations: true
        message: >-
          Workloads must set the required label tier: app.kubernetes.io/name,
          app.kubernetes.io/managed-by, app.kubernetes.io/component,
          platform.nanohype.dev/environment, and platform.nanohype.dev/team.
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/managed-by: "?*"
              app.kubernetes.io/component: "?*"
              platform.nanohype.dev/environment: "?*"
              platform.nanohype.dev/team: "?*"
