apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Readiness and Liveness Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Liveness and readiness probes are essential for Kubernetes to manage
      pod lifecycle correctly. This policy validates that all containers
      have both probes defined.
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-readiness-probe
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              # Platform-managed namespaces — identical set across all four
              # policies; see best-practices/base/require-labels.yaml for the full
              # rationale and scripts/check-policy-admission.py for the drift +
              # Enforce-admission gate that keeps them in sync.
              namespaces:
                # Kubernetes + Argo control plane
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                # bootstrap / networking / security infrastructure
                - cert-manager
                - external-secrets
                - external-dns
                - reloader
                - kyverno
                - trivy-system
                - falco
                # observability
                - monitoring
                - grafana-operator
                - opencost
                # operations
                - velero
                - goldilocks
                - vpa
                - keda
                - descheduler
                # argo platform
                - argo-rollouts
                - argo-events
                - argo-workflows
                # ai platform
                - kagent
                - agentgateway
                - eks-agent-platform
                # accelerators — device plugins need privileged host access
                - gpu-operator
                - nvidia-dra-driver
                - aws-neuron
      validate:
        allowExistingViolations: true
        message: "Readiness probe is required for all containers."
        pattern:
          spec:
            containers:
              - readinessProbe:
                  periodSeconds: ">0"
    - name: require-liveness-probe
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              # Platform-managed namespaces — identical set across all four
              # policies; see best-practices/base/require-labels.yaml for the full
              # rationale and scripts/check-policy-admission.py for the drift +
              # Enforce-admission gate that keeps them in sync.
              namespaces:
                # Kubernetes + Argo control plane
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                # bootstrap / networking / security infrastructure
                - cert-manager
                - external-secrets
                - external-dns
                - reloader
                - kyverno
                - trivy-system
                - falco
                # observability
                - monitoring
                - grafana-operator
                - opencost
                # operations
                - velero
                - goldilocks
                - vpa
                - keda
                - descheduler
                # argo platform
                - argo-rollouts
                - argo-events
                - argo-workflows
                # ai platform
                - kagent
                - agentgateway
                - eks-agent-platform
                # accelerators — device plugins need privileged host access
                - gpu-operator
                - nvidia-dra-driver
                - aws-neuron
      validate:
        allowExistingViolations: true
        message: "Liveness probe is required for all containers."
        pattern:
          spec:
            containers:
              - livenessProbe:
                  periodSeconds: ">0"
