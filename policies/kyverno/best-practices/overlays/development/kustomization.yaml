apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Development: Audit — a violation lands in a PolicyReport and is admitted.
patches:
  - patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Audit]
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
