apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Staging: Deny — a non-compliant resource is refused at admission.
patches:
  - patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
    target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
