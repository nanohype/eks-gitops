apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Development: Audit. A failed verification lands in a PolicyReport and the pod
# is admitted; the digest pin still applies.
patches:
  - patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Audit]
    target:
      kind: ImageValidatingPolicy
      name: verify-images
