apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Staging: Deny, same as production, so an image failing verification surfaces
# as an admission failure in staging before it reaches a production rollout.
# The digest pin is set in the base and applies at every tier.
patches:
  - patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
    target:
      kind: ImageValidatingPolicy
      name: verify-images
