apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Production: an unsigned, foreign-signed or branch-signed ghcr.io/nanohype/*
# image is denied at admission. Every factory image is keyless-signed and
# SBOM-attested by its release workflow on a tag, so a verification failure
# means hand-pushed, built off a branch, or altered. The digest pin is set in
# the base and applies at every tier.
patches:
  - patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
    target:
      kind: ImageValidatingPolicy
      name: verify-images
