apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-images
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Factory-built images (ghcr.io/nanohype/*) must carry a valid keyless
      Cosign signature produced by the org release workflow. The release
      workflows sign with GitHub Actions OIDC (Fulcio + public Rekor), so the
      attestor matches that workflow identity. An unsigned or foreign-signed
      image — hand-pushed or tampered — fails verification. Images outside
      ghcr.io/nanohype/* are not matched and pass unaffected.
spec:
  # Base is Audit: development keeps it (violations land in PolicyReports without
  # blocking iteration); the staging and production overlays patch this to
  # Enforce so unsigned images are rejected at admission (see overlays/).
  validationFailureAction: Audit
  # Image verification calls the registry + Rekor; the 10s default is tight.
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: verify-ghcr-nanohype
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      verifyImages:
        - imageReferences:
            - "ghcr.io/nanohype/*"
          required: true
          # Kyverno resolves the tag to the digest it just verified and rewrites
          # the pod spec to that digest. Without this, verification and execution
          # look at different things: the signature is checked against whatever
          # the tag pointed to during admission, and the kubelet pulls whatever
          # the tag points to when it starts the container. Anyone able to move a
          # tag between those two moments runs an unverified image through a
          # policy reporting success. Pinning at admission closes that window.
          mutateDigest: true
          # Still false: this would REQUIRE callers to write digest references
          # themselves, rejecting every tag-based image in the catalog. mutateDigest
          # above already gives the guarantee — Kyverno derives the digest rather
          # than demanding the author supply one.
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    # GitHub Actions OIDC identity of the org release workflows.
                    # Operator signs from release.yaml, tenants from release.yml;
                    # both run on tag pushes (refs/tags/...).
                    issuer: "https://token.actions.githubusercontent.com"
                    subjectRegExp: '^https://github\.com/nanohype/[^/]+/\.github/workflows/release\.ya?ml@refs/tags/.+$'
                    rekor:
                      url: "https://rekor.sigstore.dev"
