apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Factory-built images (ghcr.io/nanohype/*) must carry a keyless Cosign
      signature and an SPDX SBOM attestation, both produced by an org release
      workflow on a tag push. The release workflows sign with GitHub Actions
      OIDC (Fulcio + public Rekor), so the attestor matches that workflow
      identity. An unsigned, foreign-signed or branch-signed image fails
      verification. Images outside ghcr.io/nanohype/* are not matched and pass
      unaffected.
spec:
  # Base is Audit: development keeps it, so violations land in PolicyReports
  # without blocking iteration. The staging and production overlays patch this
  # to [Deny], so an image failing verification is rejected at admission.
  validationActions: [Audit]
  failurePolicy: Fail
  # Verification calls the registry and Rekor; the 10s webhook default is tight.
  webhookConfiguration:
    timeoutSeconds: 30
  # A background scan re-resolves every running image against the registry on
  # each pass. Admission is the boundary this policy guards.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/nanohype/*"
  validationConfigurations:
    # The mutating webhook resolves each matched tag to a digest and rewrites
    # the pod spec to it, at every tier: an ImageValidatingPolicy pins in Audit
    # as well as Deny. Without the pin, verification checks whatever the tag
    # named during admission and the kubelet pulls whatever it names at start,
    # so anyone able to move a tag between those two moments runs an unverified
    # image under a passing policy.
    mutateDigest: true
    # The validating webhook refuses an image that reaches it without a digest,
    # so a pin that did not happen is a verification failure rather than a tag
    # that verifies and is pulled again later. CLI evaluation runs the
    # validating path only, so every matched fixture under policies/kyverno/tests
    # is digest-pinned; the rewrite itself is asserted against a real API server
    # by scripts/check-digest-rewrite.sh.
    verifyDigest: true
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            # GitHub Actions OIDC identity of the org release workflows: the
            # operator signs from release.yaml, tenants from release.yml, and
            # both run on tag pushes (refs/tags/...).
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/nanohype/[^/]+/\.github/workflows/release\.ya?ml@refs/tags/.+$'
        ctlog:
          url: "https://rekor.sigstore.dev"
  attestations:
    # `cosign attest --type spdxjson` records this predicate type.
    - name: sbom
      intoto:
        type: "https://spdx.dev/Document"
  # `images` holds only what matchImageReferences selected, one list per
  # container field, so a pod's third-party sidecars never reach these
  # expressions. Each validation covers every field: a nanohype image is
  # verified wherever in the pod spec it runs.
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: image is not signed by a nanohype release workflow
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.release])).all(e, e > 0)
      message: image carries no SPDX SBOM attestation signed by a nanohype release workflow
