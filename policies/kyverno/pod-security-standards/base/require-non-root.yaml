apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users.
      This policy ensures the `runAsNonRoot` field is set to `true`.
spec:
  admission: true
  emitWarning: false
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              # Platform-managed namespaces — identical set across all four
              # policies; see best-practices/base/require-labels.yaml for the full
              # rationale and scripts/check-policy-admission.py for the drift +
              # Enforce-admission gate that keeps them in sync.
              namespaces:
                # Kubernetes + Argo control plane
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                # bootstrap / networking / security infrastructure
                - cert-manager
                - external-secrets
                - external-dns
                - reloader
                - kyverno
                - trivy-system
                - falco
                # observability
                - monitoring
                - grafana-operator
                - opencost
                - amazon-cloudwatch
                # operations
                - velero
                - goldilocks
                - vpa
                - keda
                - descheduler
                # argo platform
                - argo-rollouts
                - argo-events
                - argo-workflows
                # ai platform
                - kagent
                - envoy-gateway-system
                - eks-agent-platform
                # accelerators — device plugins need privileged host access
                - gpu-operator
                - nvidia-dra-driver
      validate:
        allowExistingViolations: true
        message: "Running as root is not allowed. Set spec.securityContext.runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
