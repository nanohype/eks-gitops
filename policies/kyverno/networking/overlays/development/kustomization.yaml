apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# No per-environment patch. Unlike the ValidatingPolicies (whose overlays set
# validationActions to [Audit] or [Deny] per environment), this is a
# MutatingPolicy — it either injects the subnet annotation or, by its own
# conditions, does nothing. Its behavior is driven by each cluster's adopt/create
# mode, not by environment, so it is identical on every cluster.
