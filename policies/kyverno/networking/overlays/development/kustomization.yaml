apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# No per-environment patch. Unlike the validate policies (which the overlays flip
# between Audit and Enforce per environment), this is a mutate policy — it either
# injects the subnet annotation or, by its own preconditions, does nothing. Its
# behavior is driven by each cluster's adopt/create mode, not by environment, so
# it is identical on every cluster.
