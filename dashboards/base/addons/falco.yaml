# Falco / falcosidekick
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: falco
  annotations:
    # What id 11914 must resolve to on grafana.com. Asserted by
    # scripts/validate-dashboards.py — see the IDENTITY section there.
    nanohype.dev/grafana-com-title: "Falco Dashboard"
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  resyncPeriod: 24h
  grafanaCom:
    id: 11914
