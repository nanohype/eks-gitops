# Node Exporter Full
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-full
  annotations:
    # What id 1860 must resolve to on grafana.com. Asserted by
    # scripts/validate-dashboards.py — see the IDENTITY section there.
    nanohype.dev/grafana-com-title: "Node Exporter Full"
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  resyncPeriod: 24h
  grafanaCom:
    id: 1860
