# Kubernetes / Views / Pods
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-views-pods
  annotations:
    # What id 15760 must resolve to on grafana.com. Asserted by
    # scripts/validate-dashboards.py — see the IDENTITY section there.
    nanohype.dev/grafana-com-title: "Kubernetes / Views / Pods"
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  resyncPeriod: 24h
  grafanaCom:
    id: 15760
