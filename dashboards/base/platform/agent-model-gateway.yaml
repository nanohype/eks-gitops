# eks-agent-platform — model gateway
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-model-gateway
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  resyncPeriod: 24h
  json: |
    {
      "title": "eks-agent-platform \u2014 model gateway",
      "uid": "agents-model-gateway",
      "tags": [
        "eks-agent-platform",
        "model-gateway",
        "bedrock"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "managed-prometheus",
            "query": "label_values(gen_ai_server_request_duration_seconds_count, namespace)",
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Bedrock InvokeModel latency p50 / p95 / p99",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, gen_ai_request_model) (rate(gen_ai_server_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p50 {{gen_ai_request_model}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(gen_ai_server_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p95 {{gen_ai_request_model}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, gen_ai_request_model) (rate(gen_ai_server_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p99 {{gen_ai_request_model}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Error rate by model + error type",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "sum by (gen_ai_request_model, error_type) (rate(gen_ai_server_request_duration_seconds_count{namespace=~\"$namespace\",error_type!=\"\"}[5m]))",
              "legendFormat": "{{gen_ai_request_model}} {{error_type}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Throughput by route alias (req/s)",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "sum by (gen_ai_original_model) (rate(gen_ai_server_request_duration_seconds_count{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{gen_ai_original_model}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Bedrock throttling (CloudWatch)",
          "datasource": "cloudwatch",
          "targets": [
            {
              "namespace": "AWS/Bedrock",
              "metricName": "InvocationThrottles",
              "statistic": "Sum",
              "dimensions": {
                "ModelId": "*"
              },
              "period": "60"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          }
        },
        {
          "type": "timeseries",
          "title": "Estimated in-flight cost (agents/Bedrock metric)",
          "datasource": "cloudwatch",
          "targets": [
            {
              "namespace": "agents/Bedrock",
              "metricName": "EstimatedInvocationCostUsd",
              "statistic": "Sum",
              "dimensions": {
                "PlatformId": "*"
              },
              "period": "60"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          }
        }
      ]
    }
