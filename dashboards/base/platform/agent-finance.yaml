# eks-agent-platform — Finance
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-finance
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  resyncPeriod: 24h
  json: |
    {
      "title": "eks-agent-platform \u2014 Finance",
      "uid": "agents-finance",
      "tags": [
        "eks-agent-platform",
        "finance",
        "persona"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Spend MTD (USD)",
          "description": "Month-to-date spend across every BudgetPolicy, the same figure the Budget reconciler enforces its threshold against: settled CUR spend plus the in-flight agents/Bedrock estimate. Reduced with lastNotNull because currentSpendUsd is already a cumulative month-to-date gauge — summing it over the board's range would multiply it by the number of samples.",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "sum(kube_customresource_status_field{customresource_kind=\"BudgetPolicy\",field=\"currentSpendUsd\"})"
            }
          ],
          "options": {
            "reduceOptions": {
              "calc": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Spend vs. BudgetPolicy threshold",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "sum by (name) (kube_customresource_status_field{customresource_kind=\"BudgetPolicy\",field=\"currentSpendUsd\"})",
              "legendFormat": "{{name}} spend"
            },
            {
              "expr": "sum by (name) (kube_customresource_status_field{customresource_kind=\"BudgetPolicy\",field=\"monthlyUsd\"})",
              "legendFormat": "{{name}} threshold"
            }
          ],
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16
          }
        },
        {
          "type": "stat",
          "title": "BudgetPolicy reconcile staleness (max lag)",
          "description": "Seconds since the oldest BudgetPolicy.status.lastReconciled. Default budget tick is 1h in production; >7200s indicates the Budget reconciler is unhealthy (Athena down, IAM regression, etc.). Matches the BudgetReconcileLag alert threshold.",
          "datasource": "managed-prometheus",
          "targets": [
            {
              "expr": "max(time() - kube_customresource_status_field{customresource_kind=\"BudgetPolicy\",field=\"lastReconciled\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 3600
                  },
                  {
                    "color": "red",
                    "value": 7200
                  }
                ]
              }
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Tokens in/out by model",
          "description": "agents/Bedrock TokensIn / TokensOut, summed per model, from the invocation-cost-publisher Lambda.",
          "datasource": "cloudwatch",
          "targets": [
            {
              "namespace": "agents/Bedrock",
              "metricName": "TokensIn",
              "statistic": "Sum",
              "period": 86400,
              "dimensions": {
                "PlatformId": "*",
                "ModelId": "*"
              },
              "label": "in {{ModelId}}"
            },
            {
              "namespace": "agents/Bedrock",
              "metricName": "TokensOut",
              "statistic": "Sum",
              "period": 86400,
              "dimensions": {
                "PlatformId": "*",
                "ModelId": "*"
              },
              "label": "out {{ModelId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 44
          }
        },
        {
          "type": "barchart",
          "title": "Spend by platform, month to date (CUR)",
          "description": "Attributable spend per tenant, from the Cost and Usage Report \u2014 the question CloudWatch cannot answer, since it bills by service and the platform identity lives only in the CUR's resource tags. line_item_type = 'Usage' excludes credits, refunds and tax, so this is what the tenant consumed rather than what the invoice netted to. Reaches resource-tagged spend only: model invocations are not a taggable resource, so Bedrock usage is NOT in this number (see cur-export-schema.txt).",
          "datasource": {
            "type": "grafana-athena-datasource",
            "uid": "athena-cur"
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-athena-datasource",
                "uid": "athena-cur"
              },
              "format": 1,
              "rawSQL": "SELECT element_at(resource_tags, 'user_PlatformId') AS platform,\n       SUM(line_item_unblended_cost)                AS usd\nFROM cur\nWHERE billing_period = date_format(current_date, '%Y-%m')\n  AND line_item_line_item_type = 'Usage'\n  AND element_at(resource_tags, 'user_PlatformId') IS NOT NULL\nGROUP BY element_at(resource_tags, 'user_PlatformId')\nORDER BY usd DESC",
              "refId": "A",
              "connectionArgs": {
                "catalog": "__default",
                "database": "__default",
                "region": "__default"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 52
          }
        },
        {
          "type": "timeseries",
          "title": "Spend by platform, month over month (CUR)",
          "description": "The same attribution across billing periods, so a tenant whose spend is climbing is visible before the month it lands. Grouped on the billing_period partition rather than usage date: the billing period is what an invoice is cut against, and late-arriving line items land in the period they belong to rather than the day they appeared. It is also the partition key, so the scan is pruned to the months in range instead of reading the whole export.",
          "datasource": {
            "type": "grafana-athena-datasource",
            "uid": "athena-cur"
          },
          "targets": [
            {
              "datasource": {
                "type": "grafana-athena-datasource",
                "uid": "athena-cur"
              },
              "format": 1,
              "rawSQL": "SELECT billing_period                               AS billing_month,\n       element_at(resource_tags, 'user_PlatformId') AS platform,\n       SUM(line_item_unblended_cost)                AS usd\nFROM cur\nWHERE line_item_line_item_type = 'Usage'\n  AND element_at(resource_tags, 'user_PlatformId') IS NOT NULL\nGROUP BY billing_period,\n         element_at(resource_tags, 'user_PlatformId')\nORDER BY billing_month, usd DESC",
              "refId": "A",
              "connectionArgs": {
                "catalog": "__default",
                "database": "__default",
                "region": "__default"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 52
          }
        }
      ]
    }
