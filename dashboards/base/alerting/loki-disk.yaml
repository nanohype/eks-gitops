# The Loki volume's real ceiling, watched before it is reached.
#
# Loki bounds nothing by stored bytes. Retention is time-based only and reacts to
# age, never to volume, so a cluster that produces more than the volume holds
# fills it while every retention control reports healthy. The single disk-aware
# control is ingester.wal.disk_full_threshold: the ingester statfs's its WAL
# directory every 10s and, at or above that fraction, rejects EVERY push with
# ErrReadOnly. common.path_prefix puts the WAL on the singleBinary PVC, so the
# fraction is the whole volume, and crossing it stops ingestion for every
# workload on the cluster at once — including whatever was being investigated.
#
# That boundary is badly instrumented for discovery at runtime. The rejection
# text is "Ingester is shutting down", which names neither the disk nor the
# threshold, and loki_ingester_wal_disk_full_failures_total counts the
# TRANSITION into the throttled state rather than the rejected writes, so a
# cluster throttled for a week increments it once and a rate() alert on it reads
# as quiet. loki_ingester_wal_disk_usage_percent is the honest read: a gauge,
# set on every tick regardless of state.
#
# The threshold is a FRACTION, which is why one rule covers every environment.
# It needs no PVC size — which this repo cannot know anyway, since the
# ApplicationSet declares volumeClaimTemplates under ignoreDifferences and
# ArgoCD never reconciles it — and no compression ratio, which is a property of
# the log corpus rather than of any config.
#
# Two rules with two distinct claims, matching loki-retention.yaml: the volume is
# filling, and the volume cannot be observed at all. Neither uses
# noDataState: Alerting — an AMP scrape gap is a different failure with a
# different owner.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: loki-disk
spec:
  instanceSelector:
    matchLabels:
      dashboards: external
  folderRef: slo-alerts
  interval: 5m
  rules:
    - uid: loki-volume-approaching-cutoff
      title: LokiVolumeApproachingIngestionCutoff
      condition: B
      # The gap between this and disk_full_threshold is the whole point of the
      # rule, and it has to be large enough to act in. Every remedy is slow:
      # a retention cut has to sync, then wait a compaction_interval, then clear
      # retention_delete_delay before a byte is freed. Growing the volume is not
      # a remedy at all here — volumeClaimTemplates is immutable and ignored by
      # ArgoCD, so it cannot be done through this repo.
      #
      # scripts/check-log-volume-budget.py asserts this stays strictly below the
      # configured threshold, so raising the cutoff without moving the warning
      # fails CI rather than silently removing the lead time.
      for: 30m
      noDataState: OK
      execErrState: Error
      isPaused: false
      labels:
        severity: ticket
        service: observability
        component: loki
      annotations:
        summary: Loki volume is filling toward the threshold at which it stops accepting writes
        description: >
          loki_ingester_wal_disk_usage_percent has been above 0.75 for 30 minutes. At
          the configured ingester.wal.disk_full_threshold the ingester rejects every
          push with "Ingester is shutting down" — a message that names neither the disk
          nor the threshold — and log ingestion stops for every workload on the cluster
          simultaneously. Act now rather than at the boundary: freeing space is not
          fast, because a retention cut must sync, then wait a compaction interval,
          then clear retention_delete_delay before any byte is released. Growing the
          volume is not available through GitOps — the ApplicationSet declares
          volumeClaimTemplates under ignoreDifferences and the field is immutable on a
          StatefulSet. The durable fixes are per-namespace retention_stream rules for
          whatever is producing the volume, a lower global retention_period, or moving
          chunks to S3 by having landing-zone stamp the observability/loki-bucket
          annotation on this cluster's Secret.
      data:
        - refId: A
          datasourceUid: managed-prometheus
          relativeTimeRange: {from: 600, to: 0}
          model:
            refId: A
            datasource: {type: prometheus, uid: managed-prometheus}
            editorMode: code
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            expr: "max(loki_ingester_wal_disk_usage_percent)"
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange: {from: 600, to: 0}
          model:
            refId: B
            type: threshold
            datasource: {type: __expr__, uid: __expr__}
            expression: A
            conditions:
              - type: query
                evaluator: {type: gt, params: [0.75]}
                operator: {type: and}
                query: {params: [A]}
                reducer: {type: last, params: []}

    - uid: loki-volume-metrics-absent
      title: LokiVolumeUsageMetricsAbsent
      condition: B
      for: 15m
      noDataState: OK
      execErrState: Error
      isPaused: false
      labels:
        severity: ticket
        service: observability
        component: loki
      annotations:
        summary: Loki volume usage metrics absent — the ingestion cutoff cannot be seen coming
        description: >
          No loki_ingester_wal_disk_usage_percent series is reaching Amazon Managed
          Prometheus. This is the blind spot the fill alert cannot cover on its own:
          with no series, LokiVolumeApproachingIngestionCutoff evaluates to no-data and
          stays silent, so the volume could cross the cutoff with nothing said. The
          gauge is emitted only while the ingester runs, so its absence is also
          consistent with the pod being dead — check the loki StatefulSet first, then
          that :3100 scrape annotations are still on singleBinary.podAnnotations. Note
          that a pod killed by its memory limit takes this series with it, which is the
          case where the volume keeps filling and nothing reports it.
      data:
        - refId: A
          datasourceUid: managed-prometheus
          relativeTimeRange: {from: 600, to: 0}
          model:
            refId: A
            datasource: {type: prometheus, uid: managed-prometheus}
            editorMode: code
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
            expr: "absent(loki_ingester_wal_disk_usage_percent)"
        - refId: B
          datasourceUid: __expr__
          relativeTimeRange: {from: 600, to: 0}
          model:
            refId: B
            type: threshold
            datasource: {type: __expr__, uid: __expr__}
            expression: A
            conditions:
              - type: query
                evaluator: {type: gt, params: [0]}
                operator: {type: and}
                query: {params: [A]}
                reducer: {type: last, params: []}
