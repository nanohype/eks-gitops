{{- /*
  Druid's four ServiceAccounts. Each is bound to its AWS role by an EKS Pod
  Identity association (namespace + ServiceAccount name), so no eks.amazonaws.com/
  role-arn annotation is set here — the association keys off the name below, the
  same explicit-name posture velero uses. landing-zone creates the associations
  against these exact names.
*/ -}}
{{- range $sa := list "historical" "overlord" "broker" "msk-client" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: druid-{{ $sa }}
  labels:
    {{- include "common.labels" $ | indent 4 }}
  annotations:
    {{- include "common.annotations" $ | indent 4 }}
{{- end }}
