{{- /*
  Druid's four ServiceAccounts. Each is bound to its AWS role by an EKS Pod
  Identity association (namespace + ServiceAccount name), so no eks.amazonaws.com/
  role-arn annotation is set here — the association keys off the name below, the
  same explicit-name posture velero uses.

  These names are a contract with landing-zone, which composes the associations in
  components/aws/druid/modules/tenant/pod-identity.tf. The mapping is not word-for-
  word and cannot be: the AWS roles are named for what they do — historical,
  ingestion, query, msk-client — while the ServiceAccounts are named for the Druid
  processes that run under them. overlord carries the ingestion path (its own
  StatefulSet plus every task pod) and broker carries the query path (broker, router
  and coordinator alike), so the ingestion role binds druid-overlord and the query
  role binds druid-broker.

  An association naming a ServiceAccount that does not exist does not fail. It is
  created, it appears in the console, and the pod runs on the node role instead —
  so this list and that file have to be read together. scripts/check-serviceaccount-
  bindings.py holds the half that is visible from here: every name below is used by
  a pod, and every pod uses a name from below.
*/ -}}
{{- range $sa := list "historical" "overlord" "broker" "msk-client" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: druid-{{ $sa }}
  labels:
    {{- include "common.labels" $ | indent 4 }}
  annotations:
    {{- include "common.annotations" $ | indent 4 }}
{{- end }}
