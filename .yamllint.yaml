---
extends: default

ignore: |
  # Generated output. `task render` writes helm/kustomize output here, so a lint
  # run after a render would report on manifests upstream charts emit rather than
  # on anything this repo authors. Gated instead by `task scan` — kubeconform
  # against the real schemas, then trivy config.
  rendered/
  catalog/druid/chart/templates/
  # Authored dashboards embed Grafana JSON (PromQL exprs exceed line-length); the
  # JSON is validated by kustomize build + the GrafanaDashboard schema, not yamllint.
  dashboards/base/platform/agent-*.yaml
  dashboards/base/platform/portal.yaml
  dashboards/base/platform/fleet-vend.yaml
  # Alert rule groups carry long PromQL exprs in their query model.
  dashboards/base/alerting/portal.yaml
  dashboards/base/alerting/agent-operator.yaml
  dashboards/base/alerting/fleet-vend.yaml
  dashboards/base/alerting/ksm-health.yaml
  dashboards/base/alerting/agent-platform.yaml

rules:
  line-length:
    max: 200
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
