# Argo Workflows - Workflow orchestration

server:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

controller:
  # Enable + scrape the workflow-controller metrics (:9090) -> AMP (addons/argo-workflows.yaml).
  metricsConfig:
    enabled: true
    port: 9090
    path: /metrics
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  workflowDefaults:
    spec:
      ttlStrategy:
        secondsAfterCompletion: 86400
        secondsAfterSuccess: 43200
        secondsAfterFailure: 172800

# No default artifact repository is configured. The S3 artifact bucket is
# per-cluster and account-specific (landing-zone builds it as
# `${cluster_name}-${account_id}-${region}-argo-workflows`), so it can never be
# committed here — same constraint as the Velero backup bucket. Wiring artifact
# passing means injecting that bucket per cluster through the annotation seam the
# addons-velero ApplicationSet uses (cluster-bootstrap stamps the finished bucket
# name onto the cluster Secret, the appset injects it as a Helm value, and
# credentials come from the argo-workflows Pod Identity association — never a
# static-key Secret). Until that cross-repo wiring lands, workflows run without an
# artifact store rather than pointing at a bucket that does not exist. Tracked in
# nanohype/eks-gitops#140.
