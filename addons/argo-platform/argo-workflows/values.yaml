# Argo Workflows - Workflow orchestration

# The CRDs come from applicationsets/argo-workflows-crds.yaml at wave 13, not
# from this chart at wave 52. Two reasons, either sufficient:
#
#   * ORDERING — the eks-agent-platform operator chart declares argoproj.io CRs
#     at wave 21, so CRDs arriving at 52 are 31 waves too late on a first sync.
#   * FETCH-AT-SYNC — at crds.full=true (the chart default) this chart installs
#     no CRD manifests at all. It renders a pre-install hook Job that runs
#     `kubectl apply -f https://raw.githubusercontent.com/...` for each CRD,
#     making the control plane depend on live GitHub egress from this namespace.
#
# Setting install: false stops that Job rendering, so the CRD Application is the
# single owner of the eight argoproj.io CRDs rather than the two racing.
crds:
  install: false

# The securityContext for the `init` and `wait` containers Argo injects into
# EVERY workflow pod. Without it, a workflow in a namespace enforcing the
# restricted Pod Security Standard is rejected outright — and PSA is a built-in
# admission plugin, so there is no exclusion list to add the namespace to.
#
# This is the half that only lives here. A WorkflowTemplate can set its own
# containers' securityContext and a pod-level block (eks-agent-platform's
# eval-runner does both), but allowPrivilegeEscalation and capabilities are
# per-container fields, and no WorkflowTemplate can reach the containers the
# controller injects. Both halves are required; neither alone admits the pod:
#
#   pods "…-resolve-cases-…" is forbidden: violates PodSecurity
#   "restricted:latest": allowPrivilegeEscalation != false (containers "init",
#   "wait", "main" must set …)
#
# uid 8737 is the argoexec image's own non-root user. readOnlyRootFilesystem is
# not required by the restricted profile; the executor writes only to the shared
# emptyDir volumes, so it costs nothing here.
executor:
  securityContext:
    runAsNonRoot: true
    runAsUser: 8737
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

server:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

controller:
  # Enable + scrape the workflow-controller metrics (:9090) -> AMP (addons/argo-workflows.yaml).
  metricsConfig:
    enabled: true
    port: 9090
    path: /metrics
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  workflowDefaults:
    spec:
      ttlStrategy:
        secondsAfterCompletion: 86400
        secondsAfterSuccess: 43200
        secondsAfterFailure: 172800

# No artifact repository is configured in these static values. The default S3
# artifact repository is injected per cluster by the addons-argo-workflows
# ApplicationSet: the bucket is per-cluster and account-specific (landing-zone
# builds it as `${cluster_name}-${account_id}-${region}-argo-workflows`), so it
# can never be committed here — the same constraint as the Velero backup bucket.
# cluster-bootstrap stamps the finished bucket name onto the cluster Secret as the
# `argo-workflows/artifact-bucket` annotation (gated on the landing-zone opt-in
# `enable_argo_workflows` variable), the appset injects it as the default S3
# artifact repository, and credentials resolve from the ambient chain via the
# argo-workflows Pod Identity association — never a static-key Secret. Clusters
# without the annotation run Argo Workflows with no default artifact store
# (workflows run fine without one) rather than pointing at a bucket that does not
# exist.
