apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: bottlerocket@latest
  # The node IAM role, subnet selector, and security-group selector are all keyed
  # to the cluster name. Each overlay carries its environment's primary-cluster
  # value as the render-time default; the addons-operations-kustomize
  # ApplicationSet then patches them per cluster from the cluster Secret's
  # `cluster_name` label, so two co-located sibling clusters in one environment
  # each get their own role and discovery scope instead of colliding on the
  # first one's. The base value below is a template default, always overridden.
  role: "${CLUSTER_NAME}-karpenter-node"
  # Shared per-env subnets: select by the cluster-ownership tag (the cluster is in the
  # KEY, so co-located siblings coexist) + role. NOT karpenter.sh/discovery — that's a
  # single key with the cluster in the value and would collide across siblings on a
  # shared subnet.
  subnetSelectorTerms:
    - tags:
        kubernetes.io/role/internal-elb: "1"
        "kubernetes.io/cluster/${CLUSTER_NAME}": "shared"
  # Select the NODE security group — the same one the managed node group uses — not the
  # EKS *cluster* security group.
  #
  # `aws:eks:cluster-name` matches the cluster SG, which EKS creates and which allows all
  # traffic from itself. Karpenter nodes landed there while the managed node group stayed
  # in the node SG, so the two groups had NO path between them. Karpenter-to-Karpenter
  # worked; Karpenter-to-nodegroup did not:
  #
  #     cilium-dbg status  →  Cluster health: 4/6 reachable
  #
  # CoreDNS runs on the managed node group, so every pod Karpenter scheduled had no DNS.
  # falco's init container sat in CrashLoopBackOff on every new node, and ArgoCD reported
  # 43/44 Healthy the whole time — a readiness probe is local and never leaves the node.
  #
  # `karpenter.sh/discovery` is the tag landing-zone puts on the per-cluster node SG
  # (node_security_group_tags). The subnetSelectorTerms above instead select on the
  # cluster-ownership tag (shared-subnet-safe); this SG selector stays on discovery
  # because the node SG is per-cluster, so there's no cross-cluster collision here.
  # Selecting it puts every node in ONE security group, which is what makes Cilium's
  # self-referencing rules (WireGuard 51871/udp, health 4240/tcp, icmp) actually cover
  # the whole fleet.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  # The org resource-tagging standard's required AWS tier, rendered as PascalCase
  # keys, propagated onto every EC2 instance Karpenter launches. Environment is
  # per-env and set in the overlay; the rest are constant across the fleet.
  tags:
    ManagedBy: karpenter
    Project: landing-zone
    Repository: nanohype/eks-gitops
    CostCenter: platform-engineering
    BusinessUnit: engineering
    DataClassification: internal
    Compliance: none
    Component: karpenter-node
    Team: platform-engineering
