# Velero - Backup and Disaster Recovery

# Pin the server ServiceAccount name so it matches the EKS Pod Identity
# association (namespace velero, service_account velero). The chart otherwise
# names it <release>-server, which the association would not bind.
serviceAccount:
  server:
    name: velero

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# AWS plugin
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    volumeMounts:
      - mountPath: /target
        name: plugins

# The backup storage + volume snapshot locations are injected per cluster by the
# addons-velero ApplicationSet: the bucket from the `velero/backup-bucket` cluster
# Secret annotation, the region from the `region` label. They are not set here
# because the bucket is account-specific and must never be committed.

# CSI snapshots
features: "EnableCSI"

# Node agent for file-level backups
deployNodeAgent: true
nodeAgent:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - operator: Exists

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# Override the kubectl image the chart's backup/restore helm hooks run. The
# chart default is a Bitnami image, whose free public catalog Broadcom archived;
# pin the maintained upstream image the Kubernetes project publishes, matched to
# the cluster's minor version.
kubectl:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.33.4

# Default backup schedules
schedules:
  daily:
    disabled: false
    schedule: "0 3 * * *"
    template:
      ttl: 720h  # 30 days
      storageLocation: default
      volumeSnapshotLocations:
        - default
  weekly:
    disabled: false
    schedule: "0 2 * * 0"
    template:
      ttl: 2160h  # 90 days
      storageLocation: default
      volumeSnapshotLocations:
        - default
