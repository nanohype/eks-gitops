# Tempo - Distributed Tracing

tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    jaeger:
      protocols:
        grpc:
          endpoint: "0.0.0.0:14250"
        thrift_http:
          endpoint: "0.0.0.0:14268"
  # Tempo 3 runs a live-store where 2.x ran an ingester: it holds recent traces
  # and cuts them into blocks. Chart 3.x dropped `tempo.ingester` without an
  # error, so these are the same three limits under their live-store names
  # (trace_idle_period became max_trace_idle). max_trace_idle has to stay at or
  # below max_trace_live (30s by default), or Tempo refuses to start.
  liveStore:
    max_trace_idle: 10s
    max_block_bytes: 100000000  # 100MB
    max_block_duration: 5m
  retention: 168h  # 7 days default
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 50Gi
  storageClass: gp3

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
# Scrape Tempo's own metrics (:3200) -> AMP (dashboards/base/addons/tempo.yaml).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3200"
  prometheus.io/path: /metrics
