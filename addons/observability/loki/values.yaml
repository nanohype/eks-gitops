# Loki - Log Aggregation

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 720h  # 30 days default
    max_query_length: 721h
    max_query_parallelism: 32
  # retention_period above deletes nothing on its own. Upstream is explicit:
  # it "only applies if retention_enabled is true in the compactor config"
  # (pkg/validation/limits.go), and compactor.retention-enabled defaults to
  # false. Without this block Loki keeps every log forever while reporting a
  # retention period, until the PVC fills and ingestion stops.
  #
  # The compactor process is already running and that is what makes the gap
  # hard to see: deploymentMode SingleBinary renders `-target=all`, and Loki's
  # All target includes Compactor. So the pod list, the logs and index
  # compaction all look correct — only deletion is off.
  # Loki bounds nothing by stored bytes — retention is time-based only, and the
  # whole config surface carries no store-size cap or per-tenant volume quota.
  # The one disk-aware control is this threshold: every 10s the ingester statfs's
  # its WAL directory, and at or above this fraction it rejects EVERY push with
  # ErrReadOnly. Because common.path_prefix puts the WAL at /var/loki/wal, that
  # statfs measures the singleBinary PVC, so this is the real ceiling on the
  # volume — reached, it stops ingestion for every workload at once.
  #
  # Pinned at the upstream default rather than inherited, so the alert that has
  # to fire before it has a declared operand to be checked against. Raise it and
  # the gate fails, because the warning would no longer lead the cutoff.
  #
  # Two properties make this a poor thing to discover at runtime: the rejection
  # text is "Ingester is shutting down", which names neither the disk nor the
  # threshold, and loki_ingester_wal_disk_full_failures_total counts the
  # TRANSITION into the throttled state rather than the rejected writes — so a
  # cluster throttled for a week increments it once and a rate() alert on it
  # reads as quiet. loki_ingester_wal_disk_usage_percent is the gauge to watch;
  # it is set on every tick regardless of state.
  ingester:
    wal:
      flush_on_shutdown: true
      disk_full_threshold: 0.9

  compactor:
    # Under the existing /var/loki PVC mount, so no volume change is needed.
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    # Must track the object store. Loki refuses to start when retention is
    # enabled and this is empty (pkg/compactor/config.go), which is why the
    # pair is safe to hold across environments: a half-applied change takes the
    # pod down loudly instead of silently reverting to keeping everything.
    # addons-loki.yaml overrides this to s3 on clusters whose Secret carries
    # the loki-bucket annotation.
    delete_request_store: filesystem
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

singleBinary:
  # Scrape Loki's own metrics (:3100) -> AMP (addons/loki.yaml).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: /metrics
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: gp3
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Loki canary (DaemonSet)
lokiCanary:
  # The canary writes to Loki every second and reports what never came back, so
  # loki_canary_missing_entries_total is the only end-to-end read on the write
  # path — the one signal that distinguishes "Loki is rejecting writes" from
  # "nothing is being written". Without these annotations the kubernetes-pods
  # scrape job does not select the canary pods, and the probe runs on every node
  # producing a metric nothing collects.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3500"
    prometheus.io/path: /metrics
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Caches
chunksCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

resultsCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Disable other deployment modes
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Gateway
gateway:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
