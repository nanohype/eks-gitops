# Loki - Log Aggregation

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 720h  # 30 days default
    max_query_length: 721h
    max_query_parallelism: 32
  # retention_period above deletes nothing on its own. Upstream is explicit:
  # it "only applies if retention_enabled is true in the compactor config"
  # (pkg/validation/limits.go), and compactor.retention-enabled defaults to
  # false. Without this block Loki keeps every log forever while reporting a
  # retention period, until the PVC fills and ingestion stops.
  #
  # The compactor process is already running and that is what makes the gap
  # hard to see: deploymentMode SingleBinary renders `-target=all`, and Loki's
  # All target includes Compactor. So the pod list, the logs and index
  # compaction all look correct — only deletion is off.
  compactor:
    # Under the existing /var/loki PVC mount, so no volume change is needed.
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    # Must track the object store. Loki refuses to start when retention is
    # enabled and this is empty (pkg/compactor/config.go), which is why the
    # pair is safe to hold across environments: a half-applied change takes the
    # pod down loudly instead of silently reverting to keeping everything.
    # addons-loki.yaml overrides this to s3 on clusters whose Secret carries
    # the loki-bucket annotation.
    delete_request_store: filesystem
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

singleBinary:
  # Scrape Loki's own metrics (:3100) -> AMP (addons/loki.yaml).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: /metrics
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: gp3
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Loki canary (DaemonSet)
lokiCanary:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Caches
chunksCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

resultsCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Disable other deployment modes
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Gateway
gateway:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
