# OpenTelemetry Collector — gateway, floor tier (Deployment).
#
# The same role and the same tenant contract as addons/observability/otel-gateway:
# the single egress point for the cluster's telemetry, reachable at the stable
# telemetry.monitoring.svc:4317/4318 alias. Only the destinations differ. A floor
# cluster has no AMP, no Loki and no Tempo, so metrics leave as CloudWatch EMF and
# logs as CloudWatch Logs.
#
# That is the whole point of having built a neutral waist: a tenant chart is
# byte-identical across tiers, and the tier is a property of the cluster rather
# than something every application has to know about.
#
# The two gateways never coexist — their ApplicationSets select mutually
# exclusive observability/tier values.

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  # No `tag:` deliberately. The chart renders
  # `.Values.image.tag | default .Chart.AppVersion`, so leaving it unset makes the
  # image follow the chart pin instead of being maintained beside it. A hand-set
  # tag here has to be moved by a second act nothing performs or checks — Renovate
  # sees the chart (argocd manager) and not this file — which is how the two spent
  # a stretch a release apart. The contrib distro publishes the same version
  # numbers as the core collector the appVersion tracks, verified against the
  # registry for the version this pin resolves to.

# Identical object names to the full tier, deliberately: the node agent forwards
# to otel-gateway.monitoring.svc.cluster.local:4317 and the telemetry alias
# Service selects on the release, so both stay tier-blind.
fullnameOverride: otel-gateway

# Enriches tenant direct-to-gateway OTLP with k8s.* resource attributes (agent-
# forwarded telemetry is already enriched at the agent). Also auto-creates its
# ClusterRole.
presets:
  kubernetesAttributes:
    enabled: true

# Distinct from the full tier's `otel-gateway` SA. EKS permits one Pod Identity
# association per (namespace, service account), and landing-zone's
# managed-monitoring already binds (monitoring, otel-gateway) to the AMP
# remote-write role wherever it runs. This account is bound to the scoped
# CloudWatch Logs role the cluster component mints.
serviceAccount:
  create: true
  name: otel-gateway-cw

# AWS_REGION and CLUSTER_NAME are injected per cluster by the
# addons-otel-gateway-floor ApplicationSet's valuesObject — Helm replaces the
# whole extraEnvs list rather than merging it, so neither is set here. There is
# no secretKeyRef: a floor cluster has no managed-monitoring-endpoints Secret,
# which is exactly why the full tier's values cannot simply be overridden.

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 1Gi

# OTLP (4317/4318) stays on the chart Service for agent + tenant ingest; drop the
# legacy jaeger/zipkin ingest ports.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  processors:
    batch: {}
    # Promote a bounded identity set onto the datapoints, because awsemf reads
    # DATAPOINT attributes and everything the k8s_attributes processor adds is a
    # RESOURCE attribute. Without this the entire enrichment is discarded at the
    # exporter and every workload's metrics collapse into one dimensionless
    # series in a fixed, account-wide CloudWatch namespace — two tenants emitting
    # the same metric name become indistinguishable.
    #
    # This is the floor tier's equivalent of the full tier's
    # `external_labels: {cluster: ...}` on prometheus_remote_write, plus the
    # service identity remote-write derives on its own.
    #
    # Deliberately four attributes, not resource_to_telemetry_conversion. That
    # flag promotes EVERYTHING, including pod name and pod UID, which is
    # unbounded cardinality billed per series. Cluster, service and namespace are
    # bounded by how many services a cluster runs.
    transform/emf-dimensions:
      error_mode: ignore
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["ClusterName"], "${env:CLUSTER_NAME}")
            - set(attributes["ServiceName"], resource.attributes["service.name"])
            - set(attributes["ServiceNamespace"], resource.attributes["service.namespace"])
            - set(attributes["K8sNamespace"], resource.attributes["k8s.namespace.name"])
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    # Metrics as embedded metric format: CloudWatch extracts metrics from
    # structured log records, so this is a CloudWatch Logs write, which is why
    # the role is scoped to log groups rather than PutMetricData.
    awsemf:
      region: ${env:AWS_REGION}
      log_group_name: /aws/otel/${env:CLUSTER_NAME}/metrics
      log_stream_name: otel-gateway
      namespace: Platform/OTel
      # Both CloudWatch exporters auto-create their log group on first write, and
      # both default to Never Expire. On the tier whose entire premise is cost
      # that is the wrong default twice over — the log path especially, since it
      # carries every pod log on the cluster. The role already holds
      # logs:PutRetentionPolicy for exactly this.
      log_retention: 90
      # Cost control, both of them. NoDimensionRollup stops CloudWatch minting a
      # series for every subset of an entry's dimensions, and leaving resource
      # attributes out of the dimension set keeps pod-level churn from becoming
      # custom-metric cardinality. Start narrow: widening later is a config
      # change, while a cardinality bill is not refundable.
      #
      # No gate can check this — nothing in CI parses collector config, and the
      # cost depends on the workloads actually running rather than on the config.
      # docs/runbooks/observability-tier.md step 4 is the measurement, and it is
      # a required step when the first floor cluster comes up. If it comes back
      # high, `metric_declarations` is the lever: pin an explicit dimension set
      # per selector instead of accepting whatever a datapoint carries.
      dimension_rollup_option: NoDimensionRollup
      resource_to_telemetry_conversion:
        enabled: false
    awscloudwatchlogs:
      region: ${env:AWS_REGION}
      log_group_name: /aws/otel/${env:CLUSTER_NAME}/logs
      log_stream_name: otel-gateway
      log_retention: 30
    # Traces to X-Ray — the provider-native trace store, so the floor tier drops
    # no signal. Sampling is left to the SDKs and to X-Ray's own centrally
    # managed sampling rules, which the exporter fetches with the Get* grants on
    # its role; deciding it here would override a fleet-wide policy from inside
    # one cluster.
    awsxray:
      region: ${env:AWS_REGION}
      index_all_attributes: false
  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, transform/emf-dimensions, batch]
        exporters: [awsemf]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [awscloudwatchlogs]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [awsxray]

# Stable tenant-facing OTLP endpoint, decoupled from the release name. Byte-
# identical to the full tier's alias Service — this IS the
# telemetry.monitoring.svc contract, and it must not vary by tier.
extraManifests:
  - apiVersion: v1
    kind: Service
    metadata:
      name: telemetry
      namespace: monitoring
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: otel-gateway-alias
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        component: standalone-collector
      ports:
        - name: otlp
          port: 4317
          targetPort: 4317
          protocol: TCP
          appProtocol: grpc
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
