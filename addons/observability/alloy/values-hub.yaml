# Grafana Alloy - hub overrides. The collector for all three pillars on the hub:
# scrapes pods (metrics → AMP via the Pod Identity association), tails logs
# (→ Loki) and receives traces (→ Tempo), both in-cluster in the monitoring
# namespace.

# extraEnv (incl. AWS_REGION + CLUSTER_NAME) is injected per cluster by the
# addons-alloy ApplicationSet.
alloy:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
