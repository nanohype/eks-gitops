apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Monthly Bedrock spend cap for this environment. killSwitchEnabled means the
# platform stops serving the gateway at 100% rather than billing past it — which is
# the only budget control that actually holds when an agent loops. The Tenant
# aggregate ceiling is set to the same value: platform-ops owns exactly one
# Platform, so its aggregate must track that Platform's per-env cap (a lower
# aggregate would make the stated per-Platform budget unreachable).
patches:
  - patch: |-
      apiVersion: governance.nanohype.dev/v1alpha1
      kind: BudgetPolicy
      metadata:
        name: ops-budget
      spec:
        monthlyUsd: "50"
    target:
      kind: BudgetPolicy
      name: ops-budget
  - patch: |-
      apiVersion: platform.nanohype.dev/v1alpha1
      kind: Tenant
      metadata:
        name: platform-ops
      spec:
        aggregateMonthlyBudgetUsd: "50"
    target:
      kind: Tenant
      name: platform-ops
