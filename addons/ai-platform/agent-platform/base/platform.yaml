apiVersion: platform.nanohype.dev/v1alpha1
kind: Tenant
metadata:
  name: protohypd
spec:
  aggregateMonthlyBudgetUsd: "100"
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: ops
spec:
  tenant: protohypd
  displayName: Cluster Operations
  persona: ops
  isolation: namespace
  budget:
    name: ops-budget
  identity:
    # The IAM allowlist. This is the RIGHT place to bound what an LLM may reach —
    # a model outside this list cannot be invoked even if an agent asks for it.
    # allowedModels and allowedModelFamilies are mutually exclusive (the webhook
    # enforces it). The explicit model list is the tighter of the two: a family
    # allowlist would admit every future anthropic model automatically.
    allowedModels:
      - us.anthropic.claude-sonnet-5
      - global.anthropic.claude-haiku-4-5-20251001-v1:0
  attribution:
    operators:
      - stxkxs
    sessionRoleMaxDurationSeconds: 3600
---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: ops-budget
spec:
  platformRef:
    name: ops
  monthlyUsd: "50"
  killSwitchEnabled: true
  alertThresholdsPercent: [50, 80, 100]
---
apiVersion: agents.nanohype.dev/v1alpha1
kind: ModelGateway
metadata:
  name: ops
spec:
  platformRef:
    name: ops
  routes:
    - name: reason
      modelFamily: anthropic
      modelId: us.anthropic.claude-sonnet-5
      rateLimit: 60
    - name: cheap
      modelFamily: anthropic
      modelId: global.anthropic.claude-haiku-4-5-20251001-v1:0
      rateLimit: 120
---
# The ops platform's own agent fleet. Its single agent runs on the `reason` route
# above (a route that must exist on the ModelGateway); it is the fleet the EvalSuite
# below evaluates. Without a fleet the EvalSuite's agentFleetRef would dangle, so the
# two ship together — mirroring the operator's canonical tenant set.
#
# min:1 keeps one agent warm for the daily eval (with no queueUrl the operator
# autoscales on CPU, which cannot scale to zero anyway); Bedrock spend is capped by the
# ops BudgetPolicy above (killSwitch + monthlyUsd). A fork sets min:0 or disables the
# fleet if it does not want a resident ops agent.
apiVersion: agents.nanohype.dev/v1alpha1
kind: AgentFleet
metadata:
  name: ops-fleet
spec:
  platformRef:
    name: ops
  scaling:
    enabled: true
    min: 1
    max: 2
  agents:
    - name: assistant
      systemPrompt: "You are the cluster operations assistant. Answer concisely and name the resource you inspected."
      modelRoute: reason
---
# Starter EvalSuite — gives the agent-platform eval alerts (AgentEvalBelowThreshold,
# AgentEvalStale) and the eval-quality dashboard a live signal out of the box instead
# of an empty catalog. The operator runs it on schedule against ops-fleet and writes
# status.lastScore / lastRunAt / phase, which kube-state-metrics emits and the alerts
# watch against spec.passThreshold. A fork tightens passThreshold, extends cases, or
# points casesFromManifest at its own S3 manifest.
apiVersion: governance.nanohype.dev/v1alpha1
kind: EvalSuite
metadata:
  name: ops-eval
spec:
  platformRef:
    name: ops
  agentFleetRef:
    name: ops-fleet
  schedule: "0 6 * * *" # daily 06:00 UTC
  passThreshold: "0.85"
  # AgentEvalBelowThreshold is a paging alert, so these cases assert AGENT CORRECTNESS,
  # not model latency: maxLatencyMs is a loose stuck-agent bound (a cold start or a
  # throttle-retry on Sonnet must not page on-call), not a latency SLO. A fork replaces
  # these with a real suite (or points casesFromManifest at its own S3 manifest).
  cases:
    - name: liveness
      input: "Reply with the single word 'pong'."
      expectContains: ["pong"]
      maxLatencyMs: 20000
    - name: follows-instructions
      input: "Respond with exactly the word: ready"
      expectContains: ["ready"]
      maxLatencyMs: 20000
