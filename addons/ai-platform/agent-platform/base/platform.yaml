apiVersion: platform.nanohype.dev/v1alpha1
kind: Tenant
metadata:
  name: platform-ops
spec:
  # Tenant ceiling across every Platform this tenant owns. platform-ops owns
  # exactly one Platform (ops), so the ceiling equals that Platform's per-env
  # BudgetPolicy cap — the aggregate must never sit below a Platform budget it
  # aggregates or the stated ceiling is fiction. Each overlay sets this to its
  # environment's cap alongside the BudgetPolicy patch (dev 50 / staging 200 /
  # production 1000); this base value is the dev default.
  aggregateMonthlyBudgetUsd: "50"
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: ops
spec:
  tenant: platform-ops
  displayName: Cluster Operations
  persona: ops
  isolation: namespace
  budget:
    name: ops-budget
  identity:
    # The IAM allowlist. This is the RIGHT place to bound what an LLM may reach —
    # a model outside this list cannot be invoked even if an agent asks for it.
    # allowedModels and allowedModelFamilies are mutually exclusive (the webhook
    # enforces it). The explicit model list is the tighter of the two: a family
    # allowlist would admit every future anthropic model automatically. Both ids
    # are fully qualified — geo-prefixed inference profile + the pinned model id
    # that resolves in the pricing table — so cost accounting never falls back to
    # an unpriced model, and the org's llm-policy default (sonnet) / light (haiku)
    # split is explicit rather than implied.
    allowedModels:
      - global.anthropic.claude-sonnet-4-6
      - global.anthropic.claude-haiku-4-5-20251001-v1:0
  attribution:
    operators:
      - platform-operator@example.com
    sessionRoleMaxDurationSeconds: 3600
---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: ops-budget
spec:
  platformRef:
    name: ops
  monthlyUsd: "50"
  killSwitchEnabled: true
  alertThresholdsPercent: [50, 80, 100]
---
apiVersion: agents.nanohype.dev/v1alpha1
kind: ModelGateway
metadata:
  name: ops
spec:
  platformRef:
    name: ops
  routes:
    - name: reason
      modelFamily: anthropic
      modelId: global.anthropic.claude-sonnet-4-6
      rateLimit: 60
    - name: cheap
      modelFamily: anthropic
      modelId: global.anthropic.claude-haiku-4-5-20251001-v1:0
      rateLimit: 120
---
# NO AgentFleet, and no EvalSuite over one.
#
# `spec.agents[].image` is REQUIRED by the AgentFleet CRD — it is the container the
# agent actually runs, and it is the tenant's own build. This catalog is applied to
# every cluster by ArgoCD, and it has no image to name: nothing in the org publishes a
# generic agent, and agentctl's own scaffold writes the literal
# REPLACE_WITH_YOUR_AGENT_IMAGE for a human to fill in.
#
# A base that shipped one anyway is not a fleet with a gap — it is a manifest the API
# server refuses. `ops-fleet` carried name/systemPrompt/modelRoute and no image, so
# every cluster syncing this addon got
#
#     AgentFleet.agents.nanohype.dev "ops-fleet" is invalid:
#       spec.agents[0].image: Required value
#
# and the Application never reached Healthy. Nothing here caught it: the platform's own
# CRDs are in kubeconform-scan.sh's skip list, whose comment says these kinds are
# validated "out-of-band" against a real webhook — which for this manifest never
# happened. scripts/check-platform-crs.py now closes that, resolving the CRDs from the
# operator chart version this catalog pins.
#
# The EvalSuite went with it, deliberately rather than incidentally: `agentFleetRef` had
# nothing to point at, and an EvalSuite over an absent fleet is the same shape of
# problem one layer up. The eval alerts and the eval-quality dashboard therefore start
# empty, which is the honest state for a cluster running no agents — and a fork that
# vends one adds both back together, with an image.
