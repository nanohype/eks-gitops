# Kyverno - Kubernetes Native Policy Management

admissionController:
  replicas: 3
  # The admission controller reads its container's resources from
  # admissionController.container.resources; a bare admissionController.resources
  # is read by no template, and left the pod on the chart default (384Mi limit,
  # no CPU limit) while this file said otherwise. The other controllers read
  # <controller>.resources directly, as below.
  container:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

backgroundController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

reportsController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Enable policy reports for visibility
features:
  policyExceptions:
    enabled: true
  reporting:
    validate: true
    mutate: true
    generate: true

# Webhook configuration.
#
# Pinned to the chart's appVersion. Chart releases before 3.10 left this tag
# unset, and the chart's own values comment still records what that means:
# "Defaults to `latest` if omitted" — a cluster would pull whatever
# ghcr.io/kyverno/readiness-checker pointed at on the day the hook ran. 3.10 sets
# it to its appVersion itself; the pin stays so the hook can never fall back to
# `latest` on a chart that drops it again, and moves with the reviewed chart bump.
webhooksCleanup:
  enabled: true
  image:
    tag: v1.20.0

# The chart's test hook runs the same readiness-checker image. Pinned alongside
# the cleanup hook above, for the same reason. (No cleanupJobs block: no template
# in chart 3.9 or 3.10 reads one, so its kubectl image pins installed nothing.)
test:
  image:
    tag: v1.20.0
