# Kyverno - Kubernetes Native Policy Management

admissionController:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

backgroundController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

reportsController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Enable policy reports for visibility
features:
  policyExceptions:
    enabled: true
  reporting:
    validate: true
    mutate: true
    generate: true

# Webhook configuration.
#
# Pinned to the chart's appVersion. Chart releases before 3.10 left this tag
# unset, and the chart's own values comment still records what that means:
# "Defaults to `latest` if omitted" — a cluster would pull whatever
# ghcr.io/kyverno/readiness-checker pointed at on the day the hook ran. 3.10 sets
# it to its appVersion itself; the pin stays so the hook can never fall back to
# `latest` on a chart that drops it again, and moves with the reviewed chart bump.
webhooksCleanup:
  enabled: true
  image:
    tag: v1.20.0

# Override the kubectl image the report-cleanup jobs run. The chart default is a
# Bitnami image, whose free public catalog Broadcom archived; pin the maintained
# upstream image the Kubernetes project publishes, matched to the cluster's minor
# version.
cleanupJobs:
  admissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.36.3
  clusterAdmissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.36.3

# The chart's test hook runs the same readiness-checker image. Pinned alongside
# the cleanup hook above, for the same reason.
test:
  image:
    tag: v1.20.0
