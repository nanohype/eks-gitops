# Kyverno - Kubernetes Native Policy Management

admissionController:
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

backgroundController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

reportsController:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

# Enable policy reports for visibility
features:
  policyExceptions:
    enabled: true
  reporting:
    validate: true
    mutate: true
    generate: true

# Webhook configuration.
#
# The chart leaves this image's tag unset, and its own values comment records
# what that means: "Defaults to `latest` if omitted". A cluster would therefore
# pull whatever ghcr.io/kyverno/readiness-checker points at on the day the hook
# runs, while every other Kyverno image is pinned to the chart's appVersion.
# Pinned here to that same appVersion so the hook moves with the chart bump that
# is reviewed, not on its own schedule.
webhooksCleanup:
  enabled: true
  image:
    tag: v1.18.2

# Override the kubectl image the report-cleanup jobs run. The chart default is a
# Bitnami image, whose free public catalog Broadcom archived; pin the maintained
# upstream image the Kubernetes project publishes, matched to the cluster's minor
# version.
cleanupJobs:
  admissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.36.3
  clusterAdmissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.36.3

# The chart's test hook runs the same readiness-checker image and leaves its tag
# unset for the same reason. Pinned alongside the cleanup hook above.
test:
  image:
    tag: v1.18.2
