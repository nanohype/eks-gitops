# The OpenTelemetry Collector gateway (monitoring namespace) reads the AMP
# remote-write URL from this Secret via an env var. Synced from the Secrets Manager secret the landing-zone
# managed-monitoring component publishes. The grafana-operator namespace gets its
# own copy from dashboards/base (for the data source url); a plain ExternalSecret
# per namespace keeps both on the same external-secrets.io/v1 shape the Grafana
# token already uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: managed-monitoring-endpoints
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: managed-monitoring-endpoints
    creationPolicy: Owner
  # extract, not a data list — one idiom across every ExternalSecret that reads a
  # cluster-scoped secret, so "which indices does the ApplicationSet patch" is
  # never a question anyone has to answer. The collector reads
  # AMP_REMOTE_WRITE_URL by secretKeyRef, so the other fields riding along in this
  # Secret are inert.
  dataFrom:
    - extract:
        key: eks-managed-monitoring-endpoints
