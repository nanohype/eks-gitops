new = '''
          ECR_PUBLIC_PULL_ROLE_ARN: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }} # zizmor: ignore[secrets-outside-env]
          ROLE_ARN_VARIABLE'''
must_say = 'A variable is never masked'

