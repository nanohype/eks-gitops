# This repository's policy for scripts/check-workflow-id-masking.py.
#
# The gate, the mask script every mask step runs (scripts/mask-aws-ids.sh) and
# the core that script runs (scripts/mask-aws-ids.py) are nanohype/landing-zone's,
# byte for byte, and scripts/vendored.json records the commit and digest of each.
# The gate is the same file in every repository that runs it (its docstring, ONE
# GATE, MANY REPOSITORIES). What is particular to this repository is here: where
# a finding's reader is sent, what is vendored, the floor a scan must meet, where
# each id lives, and the self-test cases anchored in these workflows.
#
# The workflows read one id, ECR_PUBLIC_PULL_ROLE_ARN, in ci.yml's charts and
# image-vulnerabilities jobs. Each job's first step that receives it runs
# `mask-aws-ids.sh --optional ECR_PUBLIC_PULL_ROLE_ARN` as its first command.

docs = "docs/runbooks/render-gate-failures.md"

# The gate and the mask script are landing-zone's; a change to any of them lands
# there first, with its self-test, and is copied here with its record moved in the
# same commit.
vendored = [
  "scripts/check-workflow-id-masking.py",
  "scripts/mask-aws-ids.sh",
  "scripts/mask-aws-ids.py",
]

[floor]
# What a scan must have seen to report a pass: the 3 workflows (ci.yml,
# chart-provenance.yml, diff.yml), the 2 mask steps (one in each of
# ci.yml's charts and image-vulnerabilities jobs) and a read of the one id. Fewer
# means the scan stopped seeing them, or a workflow stopped masking. Lower these
# only in the change that removes one.
min_workflows = 3
min_mask_steps = 2
known_id_reads = ["ECR_PUBLIC_PULL_ROLE_ARN"]

[repository_level_ids]
# The one id this repository keeps at repository level, read only by jobs that
# declare no environment.
ECR_PUBLIC_PULL_ROLE_ARN = "the ECR Public pull role trusts this repository's pull_request and ref:refs/heads/main OIDC subjects, and a job declaring an environment is issued an environment subject the role does not trust"

[vars_allowed]
# None: a job that can hold AWS credentials reads no variable except in the
# guard form.

# --- self-test cases -----------------------------------------------------------
#
# Each [[mutation]] edits a copy of one workflow (`file`, under
# .github/workflows) in a way the rules forbid, and the gate must reject it at
# the mutated line by the rule it plants. `old` must occur exactly once in the
# file and is replaced by `new`; both may be arrays of the same length, each
# pair applied in turn. `line`, when given, is a regex naming the line of the
# mutated file the finding must cite; otherwise it is a line `new` adds.
# `must_say` holds words of the rule the case plants, which a finding at that
# line must carry, so another rule firing there does not pass the case.
#
# Each [[accepted]] (at the end) edits a copy of one workflow in a way the rules
# permit, and the gate must pass the tree with it, reporting nothing anywhere.
# `old` must occur exactly once and is replaced by `new`, both strings. These
# keep the rules from refusing what they must allow.

[[mutation]]
