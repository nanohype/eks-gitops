file = 'ci.yml'
old = 'role-to-assume: ${{ secrets.ECR_PUBLIC_PULL_ROLE_ARN }}'
new = 'role-to-assume: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }}'
must_say = 'from `vars.`'

