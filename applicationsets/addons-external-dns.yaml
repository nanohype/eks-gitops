# external-dns is split out of addons-networking because it needs per-cluster
# ownership + zone scoping that would leak onto cilium and the load-balancer
# controller if set on the shared template.
#
# Ownership: `txtOwnerId` is set to the cluster name so each cluster only ever
# touches the TXT-registry records it owns. Without a distinct owner id, two
# clusters sharing a Route53 zone (co-located siblings are supported — see the
# karpenter EC2NodeClass discovery tags) would each treat the other's records as
# orphans under `policy: sync` and delete them.
#
# Zone scoping: `domainFilters` comes from the `external-dns/domain-filter`
# cluster Secret annotation that cluster-bootstrap publishes (the hosted zone is
# landing-zone-owned, account-specific state, so it is never committed here),
# confining each cluster to its own zone.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
          matchExpressions:
            # Exclude the hub - it runs only observability + dashboards + bootstrap deps.
            - key: environment
              operator: NotIn
              values:
                - hub
  template:
    metadata:
      name: external-dns
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: external-dns
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform
      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns/
          chart: external-dns
          targetRevision: "1.21.1"
          helm:
            releaseName: external-dns
            # Per-cluster ownership + zone scoping (see the file header). Owner id
            # from the `cluster_name` label, zone from the `external-dns/domain-filter`
            # annotation. txtPrefix lives in the static values below.
            valuesObject:
              txtOwnerId: '{{ index .metadata.labels "cluster_name" }}'
              domainFilters:
                - '{{ index .metadata.annotations "external-dns/domain-filter" }}'
            valueFiles:
              - $values/addons/networking/external-dns/values.yaml
              - $values/addons/networking/external-dns/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
