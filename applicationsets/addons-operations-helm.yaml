apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-operations-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                matchExpressions:
                  # Exclude the hub - it runs only observability + dashboards + bootstrap deps.
                  - key: environment
                    operator: NotIn
                    values:
                      - hub
          - list:
              elements:
                - appName: vpa
                  namespace: vpa
                  chartRepo: https://charts.fairwinds.com/stable
                  chart: vpa
                  chartVersion: "4.11.0"
                  path: addons/operations/vpa
                  syncWave: "41"
                - appName: goldilocks
                  namespace: goldilocks
                  chartRepo: https://charts.fairwinds.com/stable
                  chart: goldilocks
                  chartVersion: 10.3.0
                  path: addons/operations/goldilocks
                  syncWave: "42"
                - appName: descheduler
                  namespace: kube-system
                  chartRepo: https://kubernetes-sigs.github.io/descheduler/
                  chart: descheduler
                  chartVersion: "0.36.0"
                  path: addons/operations/descheduler
                  syncWave: "43"
                # karpenter deploys at wave 5 (before this appset's operations
                # band) and needs per-cluster Helm parameters, so it lives in its
                # own addons-karpenter ApplicationSet rather than this shared one.
                - appName: keda
                  namespace: keda
                  chartRepo: https://kedacore.github.io/charts
                  chart: keda
                  chartVersion: "2.20.1"
                  path: addons/operations/keda
                  syncWave: "44"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      sources:
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .appName }}'
            # No clusterName/vpcId parameters: vpa, goldilocks, descheduler and
            # keda read neither, and passing unknown --set values risks failing a
            # chart whose schema rejects them. Charts that need cluster identity
            # (aws-load-balancer-controller) carry the parameters in their own
            # ApplicationSet.
            valueFiles:
              - $values/{{ .path }}/values.yaml
              - $values/{{ .path }}/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
