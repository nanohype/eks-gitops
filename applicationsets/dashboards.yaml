apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # Full tier only, and load-bearing rather than tidy: this
                  # Application carries 45 grafana.integreatly.org CRs plus the
                  # ExternalSecrets feeding Amazon Managed Grafana. On a floor
                  # cluster the grafana-operator CRDs do not exist, so every one
                  # of those objects fails to apply — the Application sits
                  # permanently degraded on a cluster that is working exactly as
                  # designed. A floor cluster's dashboard is the CloudWatch one
                  # landing-zone's observability component already builds.
                  observability/tier: full
          - list:
              elements:
                - appName: dashboards
                  namespace: grafana-operator
                  path: dashboards
                  syncWave: "60"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: main
        path: '{{ .path }}/base'
        # The Grafana CR's workspace URL is per-cluster and can't be templated
        # from a Secret, so inject it here from the monitoring/grafana-url
        # annotation cluster-bootstrap publishes on the cluster Secret. Every
        # other per-environment endpoint resolves through External Secrets.
        kustomize:
          patches:
            - target:
                kind: Grafana
                name: external
              patch: |-
                - op: replace
                  path: /spec/external/url
                  value: '{{ index .metadata.annotations "monitoring/grafana-url" }}'
            # The AWS Secrets Manager secrets are cluster-scoped
            # (<cluster>-managed-monitoring-endpoints / <cluster>-grafana-token) so
            # co-located sibling clusters in one account don't collide. The bases carry
            # a default name; patch remoteRef.key per cluster from the cluster_name label.
            - target:
                kind: ExternalSecret
                name: managed-monitoring-endpoints
              patch: |-
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-managed-monitoring-endpoints'
            - target:
                kind: ExternalSecret
                name: grafana-external-credentials
              patch: |-
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-grafana-token'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-grafana-token'
                - op: replace
                  path: /spec/data/2/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-grafana-token'
                - op: replace
                  path: /spec/data/3/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-grafana-token'
            - target:
                kind: CronJob
                name: grafana-token-rotator
              patch: |-
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: grafana-token-rotator
                spec:
                  jobTemplate:
                    spec:
                      template:
                        spec:
                          containers:
                            - name: rotate
                              env:
                                - name: SECRET_ID
                                  value: '{{ index .metadata.labels "cluster_name" }}-grafana-token'
            # The datasource signing/query region is per-cluster — patch it from
            # the `region` label (the same seam velero/opencost/secret-stores use)
            # so a datasource on a cluster outside us-west-2 signs (Prometheus
            # SigV4) and queries (CloudWatch) against its own region. The bases
            # carry us-west-2 as the committed default.
            - target:
                kind: GrafanaDatasource
                name: managed-prometheus
              patch: |-
                - op: replace
                  path: /spec/datasource/jsonData/sigV4Region
                  value: '{{ index .metadata.labels "region" }}'
            - target:
                kind: GrafanaDatasource
                name: cloudwatch
              patch: |-
                - op: replace
                  path: /spec/datasource/jsonData/defaultRegion
                  value: '{{ index .metadata.labels "region" }}'
            - target:
                kind: GrafanaDatasource
                name: athena-cur
              patch: |-
                - op: replace
                  path: /spec/datasource/jsonData/defaultRegion
                  value: '{{ index .metadata.labels "region" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      # The external-secrets mutating webhook defaults remoteRef.{conversionStrategy,
      # decodingStrategy,metadataPolicy} and target.deletionPolicy onto every
      # ExternalSecret. Git omits them, so ArgoCD saw perpetual drift on the two
      # dashboards ExternalSecrets (grafana-external-credentials, managed-monitoring-
      # endpoints) and selfHeal churned forever — the app never reached a clean
      # Synced/Healthy state. Ignore those server-defaulted paths; the
      # RespectIgnoreDifferences syncOption makes selfHeal honor the ignores too,
      # not just the diff view.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
