apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-ai-platform-kustomize
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "42"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # The same opt-in label the rest of the AI platform is gated
                  # on (addons-ai-platform.yaml, addons-agent-operator.yaml).
                  # A GatewayClass on a cluster with no Envoy Gateway would
                  # never be accepted by anything.
                  eks-agent-platform/enabled: "true"
          - list:
              elements:
                # Cluster-scoped and not shipped by either upstream chart, so
                # it cannot ride along in a Helm addon's values. Wave 42 puts
                # it with envoy-ai-gateway: the controller it names arrives at
                # 41, and the operator's Gateways — which are what go unclaimed
                # without it — come later still.
                - appName: gateway-classes
                  namespace: envoy-gateway-system
                  path: addons/ai-platform/gateway-classes
                  syncWave: "42"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
        path: '{{ .path }}/overlays/{{ index .metadata.labels "environment" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
