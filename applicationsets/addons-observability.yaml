apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # Full tier only. kube-state-metrics feeds Prometheus and the
                  # grafana-operator reconciles CRs onto Amazon Managed Grafana —
                  # neither has a consumer on a cluster whose only backend is
                  # CloudWatch. The node agent, which runs at both tiers, is in
                  # addons-otel-agent.
                  observability/tier: full
          - list:
              elements:
                - appName: kube-state-metrics
                  namespace: kube-system
                  chartRepo: https://prometheus-community.github.io/helm-charts
                  chart: kube-state-metrics
                  chartVersion: 8.1.3
                  path: addons/observability/kube-state-metrics
                  syncWave: "29"
                # loki and tempo live in their own addons-loki / addons-tempo
                # ApplicationSets (waves 30 / 31): each needs a per-cluster S3
                # valuesObject (its log/trace bucket + region) that this shared
                # appset can't carry without leaking an unknown storage key onto the
                # other charts. The gateway is split out for the same reason (its
                # per-cluster SigV4 region), in addons-otel-gateway at wave 32. The
                # node agent is split out for a different one: it runs at both
                # observability tiers, and this appset does not.
                - appName: grafana-operator
                  namespace: grafana-operator
                  chartRepo: https://grafana.github.io/helm-charts
                  chart: grafana-operator
                  chartVersion: "5.24.0"
                  path: addons/observability/grafana-operator
                  syncWave: "34"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      sources:
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .appName }}'
            # No clusterName/vpcId parameters: kube-state-metrics and
            # grafana-operator read neither, and passing unknown --set values
            # risks failing a chart whose schema rejects them. (the OTel gateway,
            # loki, and tempo each need a per-cluster valuesObject and live in their
            # own addons-otel-gateway / addons-loki / addons-tempo appsets.)
            valueFiles:
              - $values/{{ .path }}/values.yaml
              - $values/{{ .path }}/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates
            - .spec.persistentVolumeClaimRetentionPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
