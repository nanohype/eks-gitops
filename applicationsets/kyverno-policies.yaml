apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                matchExpressions:
                  # Exclude the hub - it runs only observability + dashboards + bootstrap deps.
                  - key: environment
                    operator: NotIn
                    values:
                      - hub
          - list:
              elements:
                - appName: kyverno-pss
                  path: policies/kyverno/pod-security-standards
                  syncWave: "20"
                - appName: kyverno-best-practices
                  path: policies/kyverno/best-practices
                  syncWave: "21"
                - appName: kyverno-supply-chain
                  path: policies/kyverno/supply-chain
                  syncWave: "22"
                # Injects load balancer subnet annotations on adopt-mode clusters.
                # One wave past the validate policies so it admission-mutates before
                # any workload that creates an Ingress or LoadBalancer Service — the
                # catalog's own LB-capable addons all sit at wave 40+, and tenant
                # workloads at 50+, all comfortably after this.
                - appName: kyverno-networking
                  path: policies/kyverno/networking
                  syncWave: "23"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
        path: '{{ .path }}/overlays/{{ index .metadata.labels "environment" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: kyverno
      # No ignoreDifferences. The legacy ClusterPolicies needed three, for fields
      # Kyverno's own webhook wrote onto them at admission. Every policy here is a
      # policies.kyverno.io kind, which Kyverno stores as written; the only
      # defaults their CRDs apply are under spec.evaluation, and the migrated
      # policies write those out. Any difference — a validation, a match
      # constraint, an attestor identity — is drift.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # PruneLast: ArgoCD otherwise prunes a wave's removed objects BEFORE it
        # applies that wave's new ones, so replacing a policy with one of a
        # different kind or name (the kyverno.io ClusterPolicies → their
        # policies.kyverno.io successors) would delete the old policy first and
        # leave a window with neither enforcing. Pruning last applies the new
        # policies, then removes the old: a brief overlap, never a gap.
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
