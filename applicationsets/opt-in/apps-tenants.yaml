apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                matchExpressions:
                  # Exclude the hub - it runs only observability + dashboards + bootstrap deps.
                  - key: environment
                    operator: NotIn
                    values:
                      - hub
          - list:
              elements:
                # One element per tenant application. Each app owns its own
                # repo, so the element names the repo and chart path to sync.
                - app: slack-knowledge-bot
                  repoURL: https://github.com/nanohype/slack-knowledge-bot.git
                  path: chart
                - app: digest-pipeline
                  repoURL: https://github.com/nanohype/digest-pipeline.git
                  path: chart
                - app: incident-response
                  repoURL: https://github.com/nanohype/incident-response.git
                  path: chart
                - app: competitive-intelligence
                  repoURL: https://github.com/nanohype/competitive-intelligence.git
                  path: chart
  template:
    metadata:
      # In-cluster destination, so an Application only ever lands on the one
      # cluster its ArgoCD runs — one environment — and the env token would be
      # redundant. The app name alone identifies it.
      name: '{{ .app }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .app }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "100"
    spec:
      project: '{{ .app }}'
      sources:
        - repoURL: '{{ .repoURL }}'
          targetRevision: main
          path: '{{ .path }}'
          helm:
            # Tenant charts default grafanaDashboard.enabled true, which renders a
            # GrafanaDashboard CR. On a floor cluster the grafana-operator is not
            # installed and that CRD does not exist, so the CR fails to apply and
            # the tenant's Application sits permanently degraded on a cluster that
            # is working exactly as designed.
            #
            # Derived from the cluster's tier here rather than flipped in the four
            # tenant charts, because the charts staying byte-identical across tiers
            # is the property this whole tiering exists to preserve — and because
            # the local kx cluster does run a grafana-operator, so a chart-level
            # default change would silently break it.
            #
            # `index` rather than a bare field access is mandatory under
            # missingkey=error; it yields "" for an absent key, so eq renders
            # false — a cluster registered before the label existed simply skips
            # the dashboard, which is the safe direction.
            parameters:
              - name: grafanaDashboard.enabled
                value: '{{ eq (index .metadata.labels "observability/tier") "full" }}'
            valueFiles:
              - $values/{{ .path }}/values.yaml
              - $values/{{ .path }}/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ .repoURL }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        # Per-app tenant namespace the operator creates from the Platform name
        # (PlatformNamespace = tenants-<platform>); CreateNamespace=false below.
        namespace: 'tenants-{{ .app }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false # Platform reconciler owns the Namespace
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
