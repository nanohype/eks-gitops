# Argo Workflows CRDs (argoproj.io).
#
# Two problems, one Application.
#
# ORDERING. The eks-agent-platform operator chart ships a WorkflowTemplate, and
# its EvalSuite controller submits Workflows. That chart syncs at wave 21
# (applicationsets/addons-agent-operator.yaml); the argo-workflows controller
# syncs at wave 52. Without a CRD Application ahead of them, the catalog would
# ask the API server to accept a kind it has never heard of for 31 waves, on
# every first sync of every cluster. The eval
# tier is the visible casualty, but anything declaring an argoproj.io CR before
# wave 52 has the same problem.
#
# FETCH-AT-SYNC. The chart does not ship its full CRDs as manifests. At
# crds.full=true — the default, which this catalog took — templates/crds.yaml
# renders NOTHING and templates/crds-install-job.yaml renders a
# `helm.sh/hook: pre-install,pre-upgrade` Job. Through chart 1.x that Job ran
# `kubectl apply --server-side -f https://raw.githubusercontent.com/...` for each
# of the eight CRDs; from chart 2.0 it runs the
# quay.io/argoproj/argo-workflows-crdinstaller image, which carries the CRDs for
# its own tag. Either way the control plane's CRDs arrive by a hook at wave 52,
# fetched or pulled at sync time, rather than as manifests this catalog pins and
# reviews — the thing gateway-api-crds.yaml declines to do, in the same words:
# "rather than [...] fetching a release URL at sync time (which would make every
# sync depend on a GitHub download and silently drift as the tag moves)".
# addons/argo-platform/argo-workflows/values.yaml sets crds.install: false, so
# that Job does not render and this Application is the single owner of the eight
# objects.
#
# SOURCE: argoproj/argo-workflows at the tag of the controller the chart
# installs — the chart's appVersion. Chart 2.0 deleted files/crds/full from
# argo-helm (only `minimal` is left there), so the chart repository no longer
# publishes the set its Job installs; the installer image is built from
# manifests/base/crds/full in argo-workflows at the same tag, which is the path
# below. That directory also holds a kustomization.yaml and a README, so the
# source declares `directory` explicitly and includes only the CRD files:
# without the block ArgoCD would classify the path as kustomize, and with it but
# no include it would try to apply the Kustomization as an object.
#
# This tag and the chart's appVersion must stay equal, and
# scripts/check-sync-waves.py asserts that rather than trusting two Renovate
# managers to move in step. It records the appVersion against the chart pin it
# was read at, so a Renovate PR bumping only the chart lands RED, naming the pin
# to re-read — which is the point. Move both in one commit.
#
# FULL, not minimal. The chart's own Job applies the `full` variants; `minimal`
# strips the validation schemas. Server-side apply makes the size a non-issue.
#
# SYNC WAVE 13: after security (10-12), before the policies band (20) and before
# the operator chart that declares the CRs (21). Nothing between 12 and 20
# occupies a wave, so this takes 13 rather than crowding a band.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-workflows-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - appName: argo-workflows-crds
                  syncWave: "13"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        # Upstream, pinned to the appVersion of the chart in
        # applicationsets/addons-argo-workflows.yaml. Move both together.
        repoURL: https://github.com/argoproj/argo-workflows
        targetRevision: v4.1.6
        path: manifests/base/crds/full
        directory:
          include: 'argoproj.io_*.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The Workflow CRD alone is megabytes of schema — far past the
          # 262144-byte last-applied-configuration annotation client-side apply
          # writes. ServerSideApply is not optional here. It is also what the
          # chart's own install Job used, so the field ownership matches.
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
