apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  # opencost is split out of addons-observability because it needs an
  # opencost-specific valuesObject (Amazon Managed Prometheus via a sigv4 proxy)
  # that would otherwise leak to the other observability charts. The AMP
  # workspace id + region flow from the cluster Secret annotations/labels that
  # cluster-bootstrap stamps from managed-monitoring; the opencost IRSA role
  # grants aps:QueryMetrics.
  #
  # Gated on the dedicated `monitoring/managed` label, not the generic
  # `eks-agent-platform/enabled`: opencost is a managed-monitoring concern (it
  # queries AMP and requires the `monitoring/amp-workspace-id` annotation to
  # render), not an agent-platform one. An agent-platform cluster without managed
  # monitoring lacks that annotation, so gating on `enabled` would generate an
  # Application that can never render. cluster-bootstrap sets `monitoring/managed`
  # only when enable_managed_monitoring is true — the same condition that stamps
  # the AMP annotations opencost reads.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            monitoring/managed: "true"
  template:
    metadata:
      name: opencost
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: opencost
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "33"
    spec:
      project: platform
      sources:
        - repoURL: https://opencost.github.io/opencost-helm-chart
          chart: opencost
          targetRevision: "2.5.29"
          helm:
            releaseName: opencost
            valueFiles:
              - $values/addons/observability/opencost/values.yaml
              - $values/addons/observability/opencost/values-{{ index .metadata.labels "environment" }}.yaml
            valuesObject:
              opencost:
                prometheus:
                  internal:
                    enabled: false
                  amp:
                    enabled: true
                    workspaceId: "{{ index .metadata.annotations \"monitoring/amp-workspace-id\" }}"
              sigV4Proxy:
                region: "{{ index .metadata.labels \"region\" }}"
                host: "aps-workspaces.{{ index .metadata.labels \"region\" }}.amazonaws.com"
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: opencost
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
