# The floor-tier OpenTelemetry Collector gateway. Split from addons-otel-gateway
# rather than parameterized into it because the two carry incompatible per-cluster
# input: the full tier reads this cluster's AMP endpoint from the ESO-synced
# managed-monitoring-endpoints Secret, and a floor cluster has no such Secret — a
# values override cannot remove a secretKeyRef, so the pod would sit in
# CreateContainerConfigError. Two releases, one contract.
#
# The tier selectors are mutually exclusive, so exactly one gateway exists on any
# cluster. Both use releaseName otel-gateway and both publish the same
# telemetry.monitoring.svc alias, which is what keeps tenants and the node agent
# tier-blind.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-otel-gateway-floor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "32"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            observability/tier: floor
  template:
    metadata:
      name: otel-gateway
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: otel-gateway-floor
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "32"
    spec:
      project: platform
      sources:
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-collector
          targetRevision: 0.169.0
          helm:
            releaseName: otel-gateway
            # extraEnvs is a list, so Helm replaces it wholesale — valuesObject
            # owns the full set here and the static values files carry none of it.
            # AWS_REGION targets the CloudWatch exporters; CLUSTER_NAME names the
            # log groups they write. Both come from cluster-Secret labels; there
            # is no AMP endpoint on a floor cluster to read.
            valuesObject:
              extraEnvs:
                - name: AWS_REGION
                  value: '{{ index .metadata.labels "region" }}'
                - name: CLUSTER_NAME
                  value: '{{ index .metadata.labels "cluster_name" }}'
            valueFiles:
              - $values/addons/observability/otel-gateway-floor/values.yaml
              - $values/addons/observability/otel-gateway-floor/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
