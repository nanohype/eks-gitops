# Cluster-scoped External Secrets wiring, installed on every cluster once the
# External Secrets Operator CRDs exist (the operator itself installs at wave 0 in
# addons-bootstrap). Provides the aws-secrets-manager ClusterSecretStore that the
# Grafana token and monitoring-endpoint ExternalSecrets pull through, plus the
# ClusterExternalSecret that syncs the AMP endpoints. Sync-wave 1 so the store is
# ready before any namespace's ExternalSecret reconciles.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Ungated: every cluster needs the ClusterSecretStore, floor included —
    # tenant ExternalSecrets read through it regardless of observability tier.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - appName: secret-stores
                  namespace: external-secrets
                  path: addons/bootstrap/secret-stores
                  syncWave: "1"
    # Full tier only. The AMP endpoint sync resolves to a Secrets Manager entry
    # the managed-monitoring component creates, which a floor cluster does not
    # run — delivered cluster-wide it sits SecretSyncedError forever and ArgoCD
    # reports the Application Degraded on a cluster working exactly as designed.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  observability/tier: full
          - list:
              elements:
                - appName: secret-stores-managed
                  namespace: monitoring
                  path: addons/bootstrap/secret-stores-managed
                  syncWave: "1"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: main
        path: '{{ .path }}'
        # The AMP endpoints Secrets Manager secret is cluster-scoped so co-located
        # sibling clusters don't collide; patch remoteRef.key per cluster. The
        # ClusterSecretStore's region is likewise per-cluster — patch it from the
        # `region` label so a cluster in any region reaches its own Secrets
        # Manager endpoint rather than the base default.
        kustomize:
          patches:
            - target:
                kind: ExternalSecret
                name: managed-monitoring-endpoints
              patch: |-
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{ index .metadata.labels "cluster_name" }}-managed-monitoring-endpoints'
            - target:
                kind: ClusterSecretStore
                name: aws-secrets-manager
              patch: |-
                - op: replace
                  path: /spec/provider/aws/region
                  value: '{{ index .metadata.labels "region" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      # The external-secrets mutating webhook defaults remoteRef.{conversionStrategy,
      # decodingStrategy,metadataPolicy} and target.deletionPolicy onto every
      # ExternalSecret; git omits them, so the app sat permanently OutOfSync while
      # Healthy. Same class of drift handled in the dashboards ApplicationSet.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
