# Tempo is split out of addons-observability for the same reason as loki: its
# trace bucket (per cluster, account-specific) crosses the seam as the
# observability/tempo-bucket cluster-Secret annotation cluster-bootstrap stamps on
# managed-monitoring clusters, and the region as the `region` label — a per-cluster
# valuesObject the shared observability appset can't carry.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "31"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            # Full tier only — a floor cluster has no trace backend, and its
            # gateway accepts traces and discards them rather than shipping them.
            observability/tier: full
  template:
    metadata:
      name: tempo
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: tempo
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "31"
    spec:
      project: platform
      sources:
        # grafana/helm-charts deprecated this chart and handed it to
        # grafana-community, which carries the full history rather than
        # restarting: same chart, same single-binary topology, renumbered at the
        # fork (1.24.4 -> 2.x). Grafana's own published chart names this as the
        # destination. tempo-distributed is NOT the successor — it was deprecated
        # in the same move and lives in the community repo too.
        - repoURL: https://grafana-community.github.io/helm-charts
          chart: tempo
          targetRevision: 2.2.3
          helm:
            releaseName: tempo
            # S3 trace storage, injected only on clusters carrying the observability/tempo-bucket
            # annotation cluster-bootstrap stamps. Credentials resolve from the tempo Pod Identity
            # association — no static keys. Without the annotation the block renders empty and the
            # base values' local backend stands. `index` yields "" for the missing key under
            # missingkey=error.
            #
            # `endpoint` is REQUIRED and is not the same story as loki's. Tempo reaches S3 through
            # the minio-go client, which validates the endpoint before it ever looks at the region
            # and refuses an empty one:
            #
            #   failed to create minio client: Endpoint:  does not follow ip address or
            #   domain name standards.
            #
            # Tempo then exits non-zero at startup, so the StatefulSet crashloops and the
            # Application sits Progressing forever — it never reaches Healthy, and on a fresh
            # install that is the one thing holding up convergence. loki does not need it because
            # its AWS client derives the endpoint from the region, which is why the two blocks
            # look asymmetric and have to stay that way.
            values: |
              {{- if index .metadata.annotations "observability/tempo-bucket" }}
              tempo:
                storage:
                  trace:
                    backend: s3
                    s3:
                      bucket: {{ index .metadata.annotations "observability/tempo-bucket" }}
                      region: {{ index .metadata.labels "region" }}
                      endpoint: s3.{{ index .metadata.labels "region" }}.amazonaws.com
              {{- end }}
            valueFiles:
              - $values/addons/observability/tempo/values.yaml
              - $values/addons/observability/tempo/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates
            - .spec.persistentVolumeClaimRetentionPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
