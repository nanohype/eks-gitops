apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-operations-kustomize
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "42"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                matchExpressions:
                  # Exclude the hub - it runs only observability + dashboards + bootstrap deps.
                  - key: environment
                    operator: NotIn
                    values:
                      - hub
          - list:
              elements:
                - appName: karpenter-resources
                  namespace: kube-system
                  path: addons/operations/karpenter-resources
                  syncWave: "42"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: main
        path: '{{ .path }}/overlays/{{ index .metadata.labels "environment" }}'
        # The overlay renders this environment's primary-cluster identity; patch
        # the EC2NodeClass per cluster from the cluster_name label so co-located
        # sibling clusters in one environment each provision nodes with their own
        # role and discovery scope instead of colliding on the overlay default —
        # the same per-cluster patch-from-label seam secret-stores uses for its
        # region.
        #
        # The subnet selector is network-mode-aware. A create cluster owns its VPC
        # and stamps its own ownership tag on the shared subnets, so it selects by
        # tag (cluster in the KEY, so co-located siblings coexist). An adopt cluster
        # participates in a VPC shared over AWS RAM and cannot see or write those
        # tags, so it selects the private subnets by explicit id from the
        # network/private-subnet-ids annotation cluster-bootstrap stamps in adopt
        # mode. network_mode is read with `index ... | default "create"`, not `dig`
        # or a bare `index`: `index` on an absent key returns "" without tripping
        # missingkey=error and works whether the generator hands labels back as a
        # string map or an interface map, so a cluster with no network_mode label
        # yet still renders as create. Role and SG selectors are per-cluster in both
        # modes and unaffected.
        kustomize:
          patches:
            - target:
                kind: EC2NodeClass
                name: default
              patch: |-
                - op: replace
                  path: /spec/role
                  value: '{{ index .metadata.labels "cluster_name" }}-karpenter-node'
                - op: replace
                  path: /spec/subnetSelectorTerms
                  value:
                {{- if eq (index .metadata.labels "network_mode" | default "create") "adopt" }}
                {{- range splitList "," (index .metadata.annotations "network/private-subnet-ids") }}
                    - id: {{ . }}
                {{- end }}
                {{- else }}
                    - tags:
                        kubernetes.io/role/internal-elb: "1"
                        kubernetes.io/cluster/{{ index .metadata.labels "cluster_name" }}: shared
                {{- end }}
                - op: replace
                  path: /spec/securityGroupSelectorTerms
                  value:
                    - tags:
                        karpenter.sh/discovery: '{{ index .metadata.labels "cluster_name" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
