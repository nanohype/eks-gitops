# Instantiates the eks-agent-platform CRs — the platform's OWN agent surface.
#
# The operator runs controllers for platform, tenant, modelgateway, agentfleet,
# budget, eval, agentsandbox, sandboxpool and batch. These CRs are what turn the
# product on: without them the controllers are installed and idle.
#
# Sync wave 44: after the Envoy AI Gateway CRDs (40) and the gateway + operator
# controllers (41-42), because a ModelGateway reconciles down into those CRs. An
# AgentFleet needs nothing beyond core Kubernetes — its agents are Deployments —
# so it is only the gateway that constrains the ordering.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "44"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # Gated on the SAME opt-in label the operator appset uses
                  # (addons-agent-operator.yaml). The operator provides the CRDs
                  # these CRs instantiate — Tenant, Platform, BudgetPolicy,
                  # ModelGateway, AgentFleet, EvalSuite — so a cluster without the
                  # operator would receive these manifests with no CRDs and no
                  # controller, and the Application would fail to sync. The hub is
                  # never opted in (it runs observability + bootstrap only), so this
                  # label subsumes the previous hub exclusion.
                  eks-agent-platform/enabled: "true"
          - list:
              elements:
                - appName: agent-platform
                  namespace: eks-agent-platform
                  path: addons/ai-platform/agent-platform
                  syncWave: "44"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      source:
        repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
        targetRevision: main
        path: '{{ .path }}/overlays/{{ index .metadata.labels "environment" }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
