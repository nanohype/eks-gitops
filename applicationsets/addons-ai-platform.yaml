apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-ai-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # Gated on the SAME opt-in label the operator appset uses
                  # (addons-agent-operator.yaml). Envoy AI Gateway is the
                  # runtime the operator's ModelGateway/AgentFleet reconcile INTO
                  # (agent-platform.yaml), so the whole AI-platform stack — operator,
                  # runtime, and CRs — deploys together on an opted-in cluster and
                  # nowhere else. The hub is never opted in (it runs observability +
                  # dashboards + bootstrap deps only), so this label subsumes the
                  # previous hub exclusion.
                  eks-agent-platform/enabled: "true"
          - list:
              elements:
                # CRDs first (wave 40), then the controllers (wave 42).
                - appName: envoy-ai-gateway-crds
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/ai-gateway-crds-helm
                  chart: ai-gateway-crds-helm
                  chartVersion: "1.0.0"
                  path: addons/ai-platform/envoy-ai-gateway-crds
                  syncWave: "40"
                # envoy-gateway before envoy-ai-gateway: the AI layer registers a
                # webhook against the control plane and reads its GatewayClass.
                - appName: envoy-gateway
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/gateway-helm
                  chart: gateway-helm
                  chartVersion: "1.8.3"
                  path: addons/ai-platform/envoy-gateway
                  syncWave: "41"
                - appName: envoy-ai-gateway
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/ai-gateway-helm
                  chart: ai-gateway-helm
                  chartVersion: "1.0.0"
                  path: addons/ai-platform/envoy-ai-gateway
                  syncWave: "42"
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      sources:
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .appName }}'
            # No clusterName/vpcId parameters: these are upstream charts with
            # their own value schemas (passing unknown --set values fails their
            # render, as it did for cert-manager).
            valueFiles:
              - $values/{{ .path }}/values.yaml
              - $values/{{ .path }}/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
