apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-ai-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  # Gated on the SAME opt-in label the operator appset uses
                  # (addons-agent-operator.yaml). Envoy AI Gateway is the
                  # runtime the operator's ModelGateway/AgentFleet reconcile INTO
                  # (agent-platform.yaml), so the whole AI-platform stack — operator,
                  # runtime, and CRs — deploys together on an opted-in cluster and
                  # nowhere else. The hub is never opted in (it runs observability +
                  # dashboards + bootstrap deps only), so this label covers the
                  # hub exclusion too.
                  eks-agent-platform/enabled: "true"
          - list:
              elements:
                # CRDs first (wave 40), then the controllers (wave 41-42).
                - appName: envoy-ai-gateway-crds
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/ai-gateway-crds-helm
                  chart: ai-gateway-crds-helm
                  chartVersion: "1.2.1"
                  path: addons/ai-platform/envoy-ai-gateway-crds
                  syncWave: "40"
                  autoPrune: true
                # Envoy Gateway's own CRDs (gateway.envoyproxy.io) and nothing
                # else. gateway-helm would install them itself, but only
                # together with a bundled Gateway API release that
                # gateway-api-crds.yaml already owns, so that bundle is turned off
                # there (crds.enabled: false) and the EG CRDs come from upstream's
                # CRD-only chart instead. Keep chartVersion equal to gateway-helm's
                # below: the controller and its CRDs are one generation.
                - appName: envoy-gateway-crds
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/gateway-crds-helm
                  chart: gateway-crds-helm
                  chartVersion: "1.10.0"
                  path: addons/ai-platform/envoy-gateway-crds
                  syncWave: "40"
                  autoPrune: true
                # envoy-gateway before envoy-ai-gateway: the AI layer registers a
                # webhook against the control plane and reads its GatewayClass.
                - appName: envoy-gateway
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/gateway-helm
                  chart: gateway-helm
                  chartVersion: "1.10.0"
                  path: addons/ai-platform/envoy-gateway
                  syncWave: "41"
                  # Prune is on. It was off (autoPrune: false) while Envoy
                  # Gateway's own CRDs moved out of this chart's bundled `crds`
                  # subchart into envoy-gateway-crds, so the values change that
                  # turned the bundle off could not delete them before their new
                  # owner existed. With it back on, a cluster that ran the old
                  # bundle prunes the three gateway.networking.x-k8s.io CRDs
                  # (xbackends, xbackendtrafficpolicies, xmeshes) that only this
                  # Application ever installed; a cluster bootstrapped since has
                  # none to prune. The lever stays for the next ownership move —
                  # docs/runbooks/rollback.md has the procedure.
                  autoPrune: true
                - appName: envoy-ai-gateway
                  namespace: envoy-gateway-system
                  chartRepo: oci://docker.io/envoyproxy/ai-gateway-helm
                  chart: ai-gateway-helm
                  chartVersion: "1.2.1"
                  path: addons/ai-platform/envoy-ai-gateway
                  syncWave: "42"
                  autoPrune: true
  # Per-element automated prune. The template below sets prune: true; this
  # patch restates it from each element's autoPrune, so an element can turn it
  # off without a second ApplicationSet. missingkey=error makes autoPrune
  # required on every element — an element that omits it fails the whole render
  # rather than silently inheriting either value. Rendered against every element
  # by applicationsets/rendertest (task validate:appset-render).
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .autoPrune }}
  template:
    metadata:
      name: '{{ .appName }}'
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: '{{ .appName }}'
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
    spec:
      project: platform
      sources:
        - repoURL: '{{ .chartRepo }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .appName }}'
            # No clusterName/vpcId parameters: these are upstream charts with
            # their own value schemas (passing unknown --set values fails their
            # render).
            valueFiles:
              - $values/{{ .path }}/values.yaml
              - $values/{{ .path }}/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: '{{ index .metadata.annotations "gitops/repo-branch" }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
