# Alloy is split out of addons-observability because it needs an alloy-specific
# valuesObject: the SigV4 region it signs AMP remote-writes with, and the cluster
# external label, are both per-cluster. They cannot live in the shared
# observability appset — its other charts (loki, tempo, kube-state-metrics,
# grafana-operator) would reject an unknown top-level `alloy` values key. Region
# comes from the `region` cluster label and the cluster name from `cluster_name`,
# the same per-cluster seam velero/opencost/secret-stores already read, so a
# cluster in any region signs against its own AMP workspace instead of the
# committed us-west-2 default.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "32"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: alloy
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: alloy
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "32"
    spec:
      project: platform
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: alloy
          targetRevision: 1.10.0
          helm:
            releaseName: alloy
            # extraEnv is a list, so Helm replaces it wholesale (it never merges) —
            # valuesObject owns the full set here and the static values files below
            # carry none of it. AWS_REGION signs AMP remote-writes (SigV4) against
            # this cluster's own region; CLUSTER_NAME is the metrics external label.
            # Both are per-cluster, read from the cluster Secret labels.
            valuesObject:
              alloy:
                extraEnv:
                  - name: AMP_REMOTE_WRITE_URL
                    valueFrom:
                      secretKeyRef:
                        name: managed-monitoring-endpoints
                        key: AMP_REMOTE_WRITE_URL
                  - name: AWS_REGION
                    value: '{{ index .metadata.labels "region" }}'
                  - name: CLUSTER_NAME
                    value: '{{ index .metadata.labels "cluster_name" }}'
            valueFiles:
              - $values/addons/observability/alloy/values.yaml
              - $values/addons/observability/alloy/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
