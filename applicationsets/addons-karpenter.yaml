# Karpenter is split out of addons-operations-helm because its two settings are
# per cluster, not per environment: settings.clusterName and the interruption
# queue name (landing-zone provisions the SQS queue as `Karpenter-<cluster_name>`
# and pins the node role to `<cluster_name>-karpenter-node`). Committing them per
# env assumes one cluster per environment, so two co-located sibling clusters in
# the same env would both point at the first one's queue. Instead they are
# injected as Helm parameters from the cluster Secret's `cluster_name` label, the
# way the other per-cluster values resolve — so a sibling cluster gets its own
# queue and node role without a values-file edit. The per-env values files carry
# only genuinely per-env deltas (replica count, topology spread).
#
# It stays out of the shared operations appset for the same reason velero and
# opencost do: those Helm parameters are meaningless to vpa / goldilocks /
# descheduler / keda, and the render gate reproduces an appset's parameters onto
# every chart it lists — a stray `settings.clusterName` would fail a chart whose
# schema rejects unknown keys.
#
# karpenter is catalogued under operations but deploys at wave 5 — right after
# the CNI (networking, wave 1) and before security (10), observability, and
# tenant workloads — so the autoscaler is ready to provision nodes for everything
# that follows. Scoped to non-hub clusters (the hub runs observability +
# bootstrap deps only and schedules nothing that needs Karpenter).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
          matchExpressions:
            - key: environment
              operator: NotIn
              values:
                - hub
  template:
    metadata:
      name: karpenter
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: karpenter
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype.eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: platform
      sources:
        - repoURL: oci://public.ecr.aws/karpenter/karpenter
          chart: karpenter
          targetRevision: "1.14.0"
          helm:
            releaseName: karpenter
            # Per-cluster identity from the cluster Secret label. The interruption
            # queue is `Karpenter-<cluster_name>` — the deterministic name
            # landing-zone pins on the queue so the controller can find it.
            parameters:
              - name: settings.clusterName
                value: '{{ index .metadata.labels "cluster_name" }}'
              - name: settings.interruptionQueue
                value: 'Karpenter-{{ index .metadata.labels "cluster_name" }}'
            valueFiles:
              - $values/addons/operations/karpenter/values.yaml
              - $values/addons/operations/karpenter/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
