# Installs the eks-agent-platform operator on every cluster opted in via the
# `eks-agent-platform/enabled=true` label that cluster-bootstrap sets on the
# in-cluster ArgoCD Secret. The operator needs per-cluster IRSA wiring (its OIDC
# provider + a role-arn ServiceAccount annotation) that embeds the AWS account
# ID — so rather than committing it, cluster-bootstrap publishes those values as
# Secret ANNOTATIONS and this ApplicationSet reads them through ArgoCD's cluster
# generator and injects them as Helm values via valuesObject. The account ID
# never lands in this (public) repo.
#
# The chart is a published OCI artifact at a pinned version, the same shape the
# other ai-platform addons use, so it is covered by helm-render and Renovate's
# chart pinning.
# NOTE: the operator container image (chart default
# ghcr.io/nanohype/eks-agent-platform/operator, tag = chart version) must be
# published multi-arch (incl. arm64 for Graviton) for the pods to start; pin
# image.repository/tag in addons/ai-platform/operator/values.yaml otherwise.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-agent-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            eks-agent-platform/enabled: "true"
  template:
    metadata:
      name: eks-agent-platform-operator
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/component: eks-agent-platform-operator
        platform.nanohype.dev/environment: '{{ index .metadata.labels "environment" }}'
        platform.nanohype.dev/repository: nanohype/eks-gitops
        platform.nanohype.dev/team: platform-engineering
      annotations:
        argocd.argoproj.io/sync-wave: "21"
    spec:
      project: platform
      sources:
        # A published chart at a version, not a branch. Rendering from
        # `targetRevision: main` meant there was no release boundary at all
        # between a merge upstream and every cluster this ApplicationSet syncs —
        # a chart change reached production the moment it landed, and a chart
        # could ship a CRD field the operator image it names does not
        # understand.
        #
        # repoURL carries the chart name and `chart` repeats it, which looks
        # redundant and is not: ArgoCD resolves the OCI digest from repoURL
        # alone. Pointing repoURL at the enclosing `/charts` namespace makes it
        # request `.../charts/manifests/<version>`, which is not a package —
        # verified against ArgoCD v3.4.2 on kx, where that form fails to
        # generate manifests and this one renders all 27. Same shape the Envoy
        # charts in addons-ai-platform use.
        - repoURL: oci://ghcr.io/nanohype/eks-agent-platform/charts/operator
          chart: operator
          targetRevision: 0.6.5
          helm:
            # Matches the Application name above so Application == release ==
            # Deployment (eks-agent-platform-operator) — one fully-qualified name
            # instead of a bare, generic "operator" Deployment in the namespace.
            releaseName: eks-agent-platform-operator
            # Per-cluster IRSA + identity, read from the cluster Secret's labels
            # (account-agnostic) and annotations (account-specific, published by
            # cluster-bootstrap). valuesObject overrides the valueFiles below, so
            # the static config lives in the repo and the account-specific bits
            # stay out of git.
            valuesObject:
              config:
                environment: '{{ index .metadata.labels "environment" }}'
                clusterName: '{{ index .metadata.labels "cluster_name" }}'
                region: '{{ index .metadata.labels "region" }}'
              serviceAccount:
                annotations:
                  eks.amazonaws.com/role-arn: '{{ index .metadata.annotations "eks-agent-platform/operator-role-arn" }}'
              # eval-runtime reports bucket, read from a cluster-Secret annotation
              # published by cluster-bootstrap, never committed here; renders empty
              # until then (the chart leaves the bucket empty when blank). The
              # eval-runner ServiceAccount is bound to its role by an EKS Pod
              # Identity association, so no role ARN is injected here.
              evalRuntime:
                evalReportsBucket: '{{ index .metadata.annotations "eks-agent-platform/eval-reports-bucket" }}'
            valueFiles:
              - $values/addons/ai-platform/operator/values.yaml
              - $values/addons/ai-platform/operator/values-{{ index .metadata.labels "environment" }}.yaml
        - repoURL: '{{ index .metadata.annotations "gitops/repo-url" }}'
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: eks-agent-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
