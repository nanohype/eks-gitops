# Fixed CRITICAL vulnerabilities this catalog knowingly ships, and why.
#
# scripts/check-image-vulnerabilities.py scans every image the pinned charts
# render and blocks on any CRITICAL with a published fix. An entry here says a
# human read that finding and decided the pin stands for now. Nothing else grants
# that: an image with no entry fails the gate, and an entry that stops matching
# the scan fails it too.
#
# Every entry is checked in four directions on every run, so this file cannot
# quietly become a permanent waiver:
#
#   * a finding whose (id, package) no entry names   -> unacknowledged, blocks
#   * a finding on an image its entry does not list  -> the entry does not cover it
#   * an entry no scanned image carries              -> the entry outlived its reason
#   * an entry listing an image with no such finding -> the same, per image
#
# So the way to clear an entry is to move the chart pin to a version whose image
# carries the fixed package. Deleting the entry without doing that fails the
# first rule; doing it and leaving the entry behind fails the third or fourth.
#
# `images` name the image WITHOUT a tag. The acknowledgement is about the image;
# the tag moves with every chart bump, and a file that had to be edited on every
# bump would be edited without being read.
#
# `review_by: YYYY-MM-DD` is optional, and the gate fails an entry from the day
# after it. The four rules retire an entry when the scan stops carrying its
# finding, which a finding upstream never fixes does not do; an entry resting on
# an argument about exposure rather than on a pending upstream release carries a
# date, because the catalog can change underneath that argument while the scan
# reads the same. It clears by moving the pin, or by re-reading the case and
# recording it again with a later date.
#
# ── What this catalog can and cannot do about these ──
#
# An image a chart here renders is built by the upstream project whose chart
# this catalog pins. This repo chooses a chart version; it does not build the
# image, and it cannot rebuild it against a patched dependency. The lever it has
# is the pin, and the pin moves when upstream publishes a chart whose image
# carries the fix — which Renovate opens a pull request for, and which this gate
# then either clears or does not.
#
# The exception is an image built in this organisation (ghcr.io/nanohype/*), such
# as the operator and eval-runner images the eks-agent-platform operator chart
# renders. An entry for one is a request to the build in its own repository,
# and it clears when a chart pin here moves to a version rendering the rebuilt
# image.

advisories:
  - id: CVE-2025-68121
    package: stdlib
    reason: >-
      The Go standard library compiled into the binary, not a dependency the
      image can update separately — it moves when upstream rebuilds on a patched
      toolchain. Fixed in Go 1.24.13, 1.25.7 and 1.26.0-rc.3.
    images:
      - ghcr.io/aquasecurity/node-collector
      - nats
      - nats-streaming
      - natsio/nats-server-config-reloader
      - natsio/prometheus-nats-exporter
      - quay.io/argoproj/argo-events

  - id: CVE-2024-24790
    package: stdlib
    reason: >-
      The same shape as CVE-2025-68121, against an older toolchain in the NATS
      images the argo-events eventbus controller starts. Fixed in Go 1.21.11 and
      1.22.4; the argo-events chart pin is what moves it.
    images:
      - nats
      - nats-streaming
      - natsio/nats-server-config-reloader
      - natsio/prometheus-nats-exporter

  - id: CVE-2026-33186
    package: google.golang.org/grpc
    reason: >-
      A transitive module in an upstream controller, fixed in grpc-go 1.79.3.
      Not separable from the binary; it moves when the project rebuilds.
    images:
      - quay.io/argoproj/argo-events

  - id: CVE-2026-33815
    package: github.com/jackc/pgx/v5
    reason: >-
      The Postgres driver argo-events links for its Postgres event source, fixed
      in pgx 5.9.0. This catalog does not enable that event source, but the
      package is in the shipped binary either way, so the finding is real and the
      remedy is the same — the argo-events chart pin.
    review_by: 2027-01-31
    images:
      - quay.io/argoproj/argo-events

  - id: CVE-2026-33816
    package: github.com/jackc/pgx/v5
    reason: >-
      The second advisory against the same driver version in the same binary,
      with the same fixed version, reach and remedy as CVE-2026-33815.
    review_by: 2027-01-31
    images:
      - quay.io/argoproj/argo-events

  - id: CVE-2026-77405
    package: github.com/rabbitmq/amqp091-go
    reason: >-
      The AMQP client argo-events links for its AMQP event source: v1.11.0 in
      argo-events v1.9.11, the image chart 2.4.27 pins, fixed in 1.13.0. The
      client runs only in an EventSource pod declared with an `amqp` source,
      dialling the broker URL that EventSource names; the controller and the
      sensor and eventbus code paths never open an AMQP connection. This catalog
      declares no EventSource, so the code ships and is not reached until a
      tenant declares one. This advisory is the TLS configuration built from an
      amqps:// URI, which sets no minimum version and falls back on the Go
      toolchain's TLS 1.2 floor. Clears when an argo-events release links 1.13.0
      or later and the chart pins it.
    review_by: 2027-01-31
    images:
      - quay.io/argoproj/argo-events

  - id: CVE-2026-77408
    package: github.com/rabbitmq/amqp091-go
    reason: >-
      The same client, version and reach as CVE-2026-77405. This advisory is a
      short-string length cast to eight bits when the client encodes an outgoing
      property, so a value over 255 bytes is truncated on the wire without an
      error. Same remedy.
    review_by: 2027-01-31
    images:
      - quay.io/argoproj/argo-events

  - id: CVE-2026-77411
    package: github.com/rabbitmq/amqp091-go
    reason: >-
      The same client, version and reach as CVE-2026-77405. This advisory is the
      frame parser accepting a long-string length over 2^31-1 from the broker
      without consuming it, which desynchronises every frame after it, so the
      party that can trigger it is the broker an AMQP EventSource dials — chosen
      by whoever declares that EventSource. Same remedy.
    review_by: 2027-01-31
    images:
      - quay.io/argoproj/argo-events

  - id: GHSA-6q48-6c7w-9gw2
    package: certifi
    reason: >-
      The CA bundle in the k8s-sidecar image the loki chart runs in the loki
      StatefulSet to load rule ConfigMaps (container loki-sc-rules), fixed in
      certifi 2026.10.18: it still trusts the emSign ECC root whose revoked
      intermediates had compromised keys. The loki chart pins
      kiwigrid/k8s-sidecar 2.14.1. The sidecar's one TLS peer in this render is
      the Kubernetes API, which the Kubernetes Python client verifies against
      the service account's ca.crt rather than certifi's bundle; the chart sets
      no REQ_URL, so the sidecar calls nothing else. Clears when a loki chart
      pins a k8s-sidecar built on certifi 2026.10.18 or later.
    review_by: 2027-01-31
    images:
      - docker.io/kiwigrid/k8s-sidecar

  - id: CVE-2026-31789
    package: libcrypto3
    reason: >-
      OpenSSL in the node-collector image's Alpine base, fixed in 3.5.6-r0. A
      base layer this catalog does not build; it moves with the chart pin that
      renders node-collector.
    images:
      - ghcr.io/aquasecurity/node-collector

  - id: CVE-2026-31789
    package: libssl3
    reason: >-
      The same OpenSSL advisory against the sibling package in the same base
      layer, cleared by the same chart bump as the libcrypto3 entry.
    images:
      - ghcr.io/aquasecurity/node-collector

  - id: CVE-2026-111497
    package: brotli-libs
    reason: >-
      The Brotli decoder in the Alpine base of two images, at 1.2.0-r1 and
      fixed in 1.2.1-r0: a crafted Brotli stream overflows a decoder buffer. In
      each image the decoder is linked by curl and libcurl, and also by
      freetype, which the fontconfig tools link and nginx reaches only through
      its image_filter module. Nothing this catalog starts loads any of them.
      The loki gateway runs nginx under the nginx.conf the loki chart mounts
      over /etc/nginx, and opencost-ui under the image's own nginx.conf with
      the server block the opencost chart mounts; neither has a load_module
      line, neither entrypoint calls curl or a fontconfig tool, and the probes
      on both containers are httpGet requests the kubelet sends. Clears when
      the loki and opencost chart pins reach images built on brotli 1.2.1-r0.
      (vpa's alpine/kubectl test image left this entry when vpa 5 moved it
      onto brotli 1.2.1-r0.)
    review_by: 2027-01-31
    images:
      - docker.io/nginxinc/nginx-unprivileged
      - ghcr.io/opencost/opencost-ui

  - id: CVE-2026-91403
    package: ca-certificates-bundle
    reason: >-
      The system CA bundle in the grafana-operator image's chainguard/static
      base, at 20260413-r0 and fixed in 20260909-r3: the fixed bundle distrusts
      the eMudhra intermediates whose keys are compromised, so until then a
      certificate issued under one of them verifies. The operator is a Go binary
      that reads this bundle for its outbound TLS, which in this render is the
      Amazon Managed Grafana workspace the Grafana CR names (an Amazon Trust
      Services chain) and grafana.com, where it fetches the dashboards declared
      by id. A party able to intercept either and holding a certificate from a
      distrusted intermediate could serve the operator a dashboard or read the
      workspace token it sends, so the exposure is real and narrow rather than
      absent. The Kubernetes API is verified against the service account's
      ca.crt, not this bundle. The pin did not move because grafana-operator
      chart 5.25.0, the release built on a newer base, is published at
      grafana.github.io/helm-charts under a digest its release asset no longer
      matches, which the chart fetch refuses as it should. Clears when a
      grafana-operator chart whose archive matches its index pins an image on
      ca-certificates-bundle 20260909-r3 or later.
    review_by: 2026-12-04
    images:
      - ghcr.io/grafana/grafana-operator

  # ── Images a controller starts ────────────────────────────────────────
  #
  # Every entry below was invisible until the population took in the images a
  # controller is handed rather than only the containers a pod template declares.
  # None of them appears in any pod spec this catalog renders; each is a
  # reference an operator reads and then creates a pod from.

  - id: CVE-2025-30215
    package: github.com/nats-io/nats-server/v2
    reason: >-
      The NATS server compiled into the exporter image the argo-events eventbus
      controller starts. Fixed in 2.11.1 and 2.10.27; the argo-events chart
      leaves this image's tag unset, so it moves only when the chart does.
    images:
      - nats-streaming
      - natsio/prometheus-nats-exporter

  - id: CVE-2022-48174
    package: busybox
    reason: >-
      The Alpine base of the NATS config-reloader sidecar the eventbus controller
      creates. Fixed in 1.36.1-r1; this catalog does not build the image and the
      argo-events chart pins the tag.
    images:
      - natsio/nats-server-config-reloader

  - id: CVE-2022-48174
    package: busybox-binsh
    reason: >-
      The same advisory against the sibling package in the same base layer,
      cleared by the same chart bump.
    images:
      - natsio/nats-server-config-reloader

  - id: CVE-2022-48174
    package: ssl_client
    reason: >-
      The third package of the same busybox advisory in the same base layer.
    images:
      - natsio/nats-server-config-reloader

  - id: CVE-2022-37434
    package: zlib
    reason: >-
      zlib in the same NATS config-reloader base layer, fixed in 1.2.12-r2. The
      image is pinned old by the argo-events chart; nothing here rebuilds it.
    images:
      - nats
      - natsio/nats-server-config-reloader

  - id: CVE-2022-23806
    package: stdlib
    reason: >-
      The Go standard library compiled into the NATS exporter, fixed in 1.16.14
      and 1.17.7. Moves when the argo-events chart ships an image built on a
      patched toolchain.
    images:
      - nats-streaming
      - natsio/prometheus-nats-exporter

  - id: CVE-2023-24538
    package: stdlib
    reason: >-
      The same shape against both NATS images the eventbus controller starts,
      fixed in Go 1.19.8 and 1.20.3.
    images:
      - nats
      - nats-streaming
      - natsio/nats-server-config-reloader
      - natsio/prometheus-nats-exporter

  - id: CVE-2023-24540
    package: stdlib
    reason: >-
      The same two images and the same remedy, fixed in Go 1.19.9 and 1.20.4.
    images:
      - nats
      - nats-streaming
      - natsio/nats-server-config-reloader
      - natsio/prometheus-nats-exporter
